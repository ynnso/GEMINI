<!DOCTYPE html>
<html lang="en" x-data="{ isDark: true }" :class="isDark ? 'dark' : ''">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>S2S Field App with Updated Mini Shoot Pricing</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      overscroll-behavior-y: none;
    }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    [x-cloak] { display: none !important; }
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }

    @keyframes subtle-pulse-white {
      0%, 100% { border-color: rgba(255, 255, 255, 0.25); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
      50% { border-color: rgba(255, 255, 255, 0.8); box-shadow: 0 0 12px 0 rgba(255, 255, 255, 0.25); }
    }

    @keyframes subtle-pulse-red-light {
      0%, 100% { border-color: rgba(239, 68, 68, 0.4); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
      50% { border-color: rgba(239, 68, 68, 0.9); box-shadow: 0 0 10px 0 rgba(239, 68, 68, 0.2); }
    }

    .animate-pulse-dark { animation: subtle-pulse-white 2s infinite ease-in-out; }
    .animate-pulse-light { animation: subtle-pulse-red-light 1.8s infinite ease-in-out; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="w-full min-h-screen transition-colors duration-300"
      :class="isDark ? 'bg-black text-white' : 'bg-neutral-100 text-neutral-900'"
      x-data="{
        activeSheet: null,
        activeTab: 'photos',
        
        state: 'idle',
        includeTax: true,
        taxRate: 0.0825,

        /* CART STATE */
        clearedCache: [],
        cartItems: [
          { id: 1, title: 'MLS Photos: Full Shoot', desc: '2,000 – 2,999 Sq Ft', price: 206, icon: 'camera', state: 'active', timer: null },
          { id: 2, title: 'MLS Photos: Ranch Shoot', desc: '36 imgs', price: 349, icon: 'home', state: 'active', timer: null },
          { id: 3, title: 'MLS Aerial Video', desc: '2 min duration', price: 249, icon: 'video', state: 'active', timer: null }
        ],

        /* CART ACTIONS */
        deleteItem(item) {
          item.state = 'deleted';
          if (item.timer) clearTimeout(item.timer);
          item.timer = setTimeout(() => {
            item.state = 'removed';
          }, 6000);
        },
        restoreItem(item) {
          if (item.timer) clearTimeout(item.timer);
          item.state = 'active';
        },
        permanentlyDismiss(item) {
          if (item.timer) clearTimeout(item.timer);
          item.state = 'removed';
        },
        clearCart() {
          const activeItems = this.cartItems.filter(i => i.state === 'active');
          if (activeItems.length === 0) return;
          this.clearedCache = JSON.parse(JSON.stringify(activeItems));
          this.cartItems.forEach(i => {
            if (i.timer) clearTimeout(i.timer);
            i.state = 'removed';
          });
        },
        restoreClearedCart() {
          if (this.clearedCache.length === 0) return;
          this.cartItems = JSON.parse(JSON.stringify(this.clearedCache));
          this.cartItems.forEach(i => i.state = 'active');
          this.clearedCache = [];
        },
        activeCount() {
          return this.cartItems.filter(i => i.state === 'active').length;
        },
        calculateSubtotal() {
          return this.cartItems
            .filter(i => i.state === 'active')
            .reduce((acc, i) => acc + i.price, 0);
        },

        /* FULL SHOOT STATE */
        dropdownOpen: false,
        count: 25,
        selectedBase: 25,
        selectedSqFt: '0-1999',
        extraCost: 5,

        /* UPDATED MINI SHOOT STATE */
        miniCount: 12,
        miniBasePrice: 119,
        miniExtraCost: 10,

        /* RANCH SHOOT STATE */
        ranchCount: 25,
        ranchSelectedBase: 25,
        ranchExtraCost: 5,
        ranchPriceMatrix: { 25: 299, 36: 349 },

        /* UNIFIED DRAG STATE */
        dragY: 0,
        startY: 0,
        isDragging: false,

        sqFtOptions: [
          { label: '0 – 1,999 Sq Ft', value: '0-1999' },
          { label: '2,000 – 2,999 Sq Ft', value: '2000-2999' },
          { label: '3,000 – 3,999 Sq Ft', value: '3000-3999' },
          { label: '4,000 – 4,999 Sq Ft', value: '4000-4999' },
          { label: '5,000 – 6,999 Sq Ft', value: '5000-6999' },
          { label: '7,000 – 9,999 Sq Ft', value: '7000-9999' },
          { label: '10,000+ Sq Ft', value: '10000+' }
        ],

        priceMatrix: {
          '0-1999':    { 25: 139, 36: 179, 40: 189, 50: 224 },
          '2000-2999': { 25: 166, 36: 206, 40: 216, 50: 251 },
          '3000-3999': { 25: 189, 36: 229, 40: 239, 50: 274 },
          '4000-4999': { 25: 214, 36: 254, 40: 264, 50: 299 },
          '5000-6999': { 25: 279, 36: 319, 40: 329, 50: 374 },
          '7000-9999': { 25: 339, 36: 379, 40: 389, 50: 434 },
          '10000+':    { 25: 399, 36: 439, 40: 449, 50: 499 }
        },

        /* FULL SHOOT LOGIC */
        get holdsSelection() { return this.selectedSqFt !== ''; },

        get selectedSqFtLabel() {
          const found = this.sqFtOptions.find(o => o.value === this.selectedSqFt);
          return found ? found.label : 'Select Sq Ft';
        },

        selectSqFt(val) {
          this.selectedSqFt = val;
          this.dropdownOpen = false;
          this.handleSqFtChange();
        },

        handleSqFtChange() {
          this.selectedBase = 25;
          if (this.count < 25) this.count = 25;
          this.evaluateCheapestBase();
        },

        getTierPrice(imgs) {
          if (!this.holdsSelection) return '--';
          return this.priceMatrix[this.selectedSqFt][imgs];
        },

        selectTier(c) { 
          if (!this.holdsSelection) return;
          this.selectedBase = c;
          this.count = c; 
        },

        evaluateCheapestBase() {
          if (!this.holdsSelection) return;
          const tiers = [25, 36, 40, 50];
          let bestTier = tiers[0];
          let minCost = Infinity;

          for (let t of tiers) {
            let cost = (this.count >= t) ? (this.getTierPrice(t) + (this.count - t) * this.extraCost) : this.getTierPrice(t);
            if (cost < minCost) {
              minCost = cost;
              bestTier = t;
            }
          }

          if (this.count === 33) this.selectedBase = 25;
          else if (this.count === 38) this.selectedBase = 36;
          else if (this.count === 47) this.selectedBase = 40;
          else this.selectedBase = bestTier;
        },

        sanitizeInput() {
          let val = parseInt(this.count, 10);
          if (isNaN(val) || val < 25) val = 25;
          if (val > 150) val = 150;
          this.count = val;
          this.evaluateCheapestBase();
        },

        get effectiveTier() {
          return { imgs: this.selectedBase, price: this.holdsSelection ? this.getTierPrice(this.selectedBase) : 0 };
        },

        get targetUpgradeTier() {
          if (!this.holdsSelection) return null;
          if (this.selectedBase === 25 && this.count === 33) return 36;
          if (this.selectedBase === 36 && this.count === 38) return 40;
          if (this.selectedBase === 40 && this.count === 47) return 50;
          return null;
        },

        get extras() { return Math.max(0, this.count - this.effectiveTier.imgs); },
        get extraTotal() { return this.extras * this.extraCost; },
        get rawTotal() { return this.effectiveTier.price + this.extraTotal; },
        get finalTotal() { 
          if (!this.holdsSelection) return null;
          const amount = this.includeTax ? this.rawTotal * (1 + this.taxRate) : this.rawTotal;
          return amount.toFixed(2);
        },

        get priceDollars() { return this.finalTotal ? this.finalTotal.split('.')[0] : '--'; },
        get priceCents() { return this.finalTotal ? '.' + this.finalTotal.split('.')[1] : ''; },

        updateCount(dir) {
          if (!this.holdsSelection) return;
          if (dir === 'up' && this.count < 150) {
            this.count++;
            this.evaluateCheapestBase();
          }
          if (dir === 'down' && this.count > 25) {
            this.count--;
            this.evaluateCheapestBase();
          }
        },

        /* UPDATED MINI SHOOT LOGIC */
        get miniExtras() { return Math.max(0, this.miniCount - 12); },
        get miniExtraTotal() { return this.miniExtras * this.miniExtraCost; },
        get miniRawTotal() { return this.miniBasePrice + this.miniExtraTotal; },
        get miniFinalTotal() {
          const amount = this.includeTax ? this.miniRawTotal * (1 + this.taxRate) : this.miniRawTotal;
          return amount.toFixed(2);
        },
        get miniPriceDollars() { return this.miniFinalTotal.split('.')[0]; },
        get miniPriceCents() { return '.' + this.miniFinalTotal.split('.')[1]; },

        updateMiniCount(dir) {
          if (dir === 'up' && this.miniCount < 24) {
            this.miniCount++;
          }
          if (dir === 'down' && this.miniCount > 12) {
            this.miniCount--;
          }
        },

        sanitizeMiniInput() {
          let val = parseInt(this.miniCount, 10);
          if (isNaN(val) || val < 12) val = 12;
          if (val > 24) val = 24;
          this.miniCount = val;
        },

        /* RANCH SHOOT LOGIC */
        getRanchTierPrice(imgs) {
          return this.ranchPriceMatrix[imgs];
        },

        selectRanchTier(c) {
          this.ranchSelectedBase = c;
          this.ranchCount = c;
        },

        evaluateRanchCheapestBase() {
          if (this.ranchCount === 35) {
            this.ranchSelectedBase = 25;
          } else if (this.ranchCount >= 36) {
            this.ranchSelectedBase = 36;
          } else {
            this.ranchSelectedBase = 25;
          }
        },

        sanitizeRanchInput() {
          let val = parseInt(this.ranchCount, 10);
          if (isNaN(val) || val < 25) val = 25;
          if (val > 150) val = 150;
          this.ranchCount = val;
          this.evaluateRanchCheapestBase();
        },

        get ranchEffectiveTier() {
          return { imgs: this.ranchSelectedBase, price: this.getRanchTierPrice(this.ranchSelectedBase) };
        },

        get ranchTargetUpgradeTier() {
          if (this.ranchSelectedBase === 25 && this.ranchCount === 35) return 36;
          return null;
        },

        get ranchExtras() { return Math.max(0, this.ranchCount - this.ranchEffectiveTier.imgs); },
        get ranchExtraTotal() { return this.ranchExtras * this.ranchExtraCost; },
        get ranchRawTotal() { return this.ranchEffectiveTier.price + this.ranchExtraTotal; },
        get ranchFinalTotal() {
          const amount = this.includeTax ? this.ranchRawTotal * (1 + this.taxRate) : this.ranchRawTotal;
          return amount.toFixed(2);
        },

        get ranchPriceDollars() { return this.ranchFinalTotal ? this.ranchFinalTotal.split('.')[0] : '299'; },
        get ranchPriceCents() { return this.ranchFinalTotal ? '.' + this.ranchFinalTotal.split('.')[1] : '.00'; },

        updateRanchCount(dir) {
          if (dir === 'up' && this.ranchCount < 150) {
            this.ranchCount++;
            this.evaluateRanchCheapestBase();
          }
          if (dir === 'down' && this.ranchCount > 25) {
            this.ranchCount--;
            this.evaluateRanchCheapestBase();
          }
        },

        /* ADD ITEM TO CART FROM OPTION SHEETS */
        addConfiguredItemToCart(title, desc, rawPrice, iconName) {
          if (this.state !== 'idle') return;
          this.state = 'success';
          
          const newItem = {
            id: Date.now(),
            title: title,
            desc: desc,
            price: rawPrice,
            icon: iconName,
            state: 'active',
            timer: null
          };

          this.cartItems.push(newItem);

          if (window.navigator && window.navigator.vibrate) {
            window.navigator.vibrate(40);
          }
          
          setTimeout(() => { 
            this.state = 'idle'; 
            this.closeSheet();
            setTimeout(() => {
              this.openSheet('cart');
            }, 250);
          }, 600);
        },

        /* SHEET CONTROLS */
        openSheet(sheetName) {
          this.dragY = 0;
          this.activeSheet = null;
          this.$nextTick(() => {
            this.activeSheet = sheetName;
          });
        },

        closeSheet() {
          this.activeSheet = null;
          setTimeout(() => { this.dragY = 0; }, 250);
        },

        dragStart(e) {
          this.startY = e.clientY ?? (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
          this.isDragging = true;
        },

        dragMove(e) {
          if (!this.isDragging) return;
          const currentY = e.clientY ?? (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
          let delta = currentY - this.startY;
          if (delta > 0) {
            this.dragY = delta;
          }
        },

        dragEnd() {
          if (!this.isDragging) return;
          this.isDragging = false;
          if (this.dragY > 120) {
            this.closeSheet();
          } else {
            this.dragY = 0;
          }
        }
      }">

  <!-- APP CONTAINER -->
  <div class="w-full min-h-screen max-w-md mx-auto flex flex-col justify-between relative pb-28">

    <!-- APP HEADER -->
    <header class="px-5 pt-6 pb-4 grid grid-cols-3 items-center backdrop-blur-xl sticky top-0 z-30 border-b transition-colors duration-300"
            :class="isDark ? 'bg-black/85 border-white/10' : 'bg-white/85 border-neutral-200 shadow-sm'">
      
      <!-- LOGO -->
      <div class="justify-self-start font-black text-[22px] tracking-tight leading-none" :class="isDark ? 'text-white' : 'text-neutral-900'">
        s<span class="text-[#E50914]">2</span>s
      </div>

      <!-- SUN / MOON OUTLINE ICON TOGGLE -->
      <div class="justify-self-center">
        <button @click="isDark = !isDark" 
                class="w-10 h-10 rounded-full flex items-center justify-center transition-colors duration-300 focus:outline-none cursor-pointer"
                :class="isDark ? 'text-white hover:text-neutral-300' : 'text-neutral-900 hover:text-neutral-600'"
                :title="isDark ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
          
          <template x-if="isDark">
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
            </svg>
          </template>

          <template x-if="!isDark">
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m0 13.5V21m8.966-8.966h-2.25m-13.5 0H3m15.364-6.364l-1.591 1.591M6.758 17.242l-1.591 1.591m12.728 0l-1.591-1.591M6.758 6.758L5.167 5.167M12 8.25a3.75 3.75 0 100 7.5 3.75 3.75 0 000-7.5z" />
            </svg>
          </template>

        </button>
      </div>

      <!-- CART ICON TOP NAV BUTTON (OPENS CART QUOTE SHEET) -->
      <div class="justify-self-end">
        <button @click="openSheet('cart')"
                class="w-10 h-10 rounded-full flex items-center justify-center relative transition-colors duration-300 focus:outline-none cursor-pointer"
                :class="isDark ? 'text-white hover:text-neutral-300' : 'text-neutral-900 hover:text-neutral-600'"
                title="View Quote Cart">
          
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2.5 3.5h2l2.3 8.8a2 2 0 001.9 1.5h8.6a2 2 0 001.9-1.5l1.8-6.8" stroke-width="2.3" />
            <circle cx="9" cy="19.5" r="1.5" fill="currentColor" />
            <circle cx="16.5" cy="19.5" r="1.5" fill="currentColor" />
            <path d="M11 7.5h5M13.5 5v5" stroke-width="2.6" stroke="currentColor" />
          </svg>

          <template x-if="activeCount() > 0">
            <div class="absolute -top-0.5 -right-0.5 bg-[#E50914] text-white text-[10px] font-black w-4.5 h-4.5 rounded-full flex items-center justify-center shadow-sm"
                 x-text="activeCount()"></div>
          </template>
        </button>
      </div>

    </header>

    <!-- DASHBOARD CONTENT -->
    <main class="p-4 flex-1 flex flex-col gap-4">

      <!-- PHOTOS SECTION -->
      <section class="rounded-3xl p-4 flex flex-col gap-3.5 border transition-colors duration-300"
               :class="isDark ? 'bg-[#121212] border-[#262626] border-l-4 border-l-white' : 'bg-white border-neutral-300 border-l-4 border-l-neutral-900 shadow-md'">
        
        <div class="flex items-center gap-2 font-extrabold text-[19px]" :class="isDark ? 'text-white' : 'text-neutral-900'">
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574v9.176A2.25 2.25 0 004.5 21h15a2.25 2.25 0 002.25-2.25V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z" />
          </svg>
          <span>Photos</span>
        </div>

        <div class="flex border rounded-2xl p-1 gap-1 transition-colors duration-300"
             :class="isDark ? 'bg-black border-[#262626]' : 'bg-neutral-100 border-neutral-200'">
          <button class="flex-1 py-2 text-[12px] font-black text-center bg-[#E50914] text-white rounded-xl shadow-[0_0_12px_rgba(229,9,20,0.35)]">MLS</button>
          <button class="flex-1 py-2 text-[12px] font-bold text-center text-[#8E8E93]">Airbnb</button>
          <button class="flex-1 py-2 text-[12px] font-bold text-center text-[#8E8E93]">PORT</button>
        </div>

        <div class="flex flex-col gap-2.5 pt-1">
          
          <button @click="openSheet('full')"
                  class="p-4 rounded-2xl flex items-center justify-between text-left border transition-all active:scale-[0.98] cursor-pointer"
                  :class="isDark ? 'bg-black border-[#262626] text-white active:border-white' : 'bg-neutral-50 border-neutral-200 text-neutral-900 active:border-neutral-900'">
            <span class="text-[15px] font-black">Full Shoot</span>
            <svg class="w-5 h-5 text-[#8E8E93]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
            </svg>
          </button>

          <div class="p-4 rounded-2xl flex items-center justify-between text-left border opacity-50 transition-colors cursor-not-allowed"
               :class="isDark ? 'bg-black border-[#262626] text-white' : 'bg-neutral-50 border-neutral-200 text-neutral-900'">
            <span class="text-[15px] font-bold">Reshoot</span>
            <svg class="w-5 h-5 text-[#8E8E93]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
            </svg>
          </div>

          <button @click="openSheet('ranch')"
                  class="p-4 rounded-2xl flex items-center justify-between text-left border transition-all active:scale-[0.98] cursor-pointer"
                  :class="isDark ? 'bg-black border-[#262626] text-white active:border-white' : 'bg-neutral-50 border-neutral-200 text-neutral-900 active:border-neutral-900'">
            <span class="text-[15px] font-black">Ranch Shoot</span>
            <svg class="w-5 h-5 text-[#8E8E93]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
            </svg>
          </button>

          <div class="p-4 rounded-2xl flex items-center justify-between text-left border opacity-50 transition-colors cursor-not-allowed"
               :class="isDark ? 'bg-black border-[#262626] text-white' : 'bg-neutral-50 border-neutral-200 text-neutral-900'">
            <span class="text-[15px] font-bold">Exterior Only</span>
            <svg class="w-5 h-5 text-[#8E8E93]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
            </svg>
          </div>

          <button @click="openSheet('mini')"
                  class="p-4 rounded-2xl flex items-center justify-between text-left border transition-all active:scale-[0.98] cursor-pointer"
                  :class="isDark ? 'bg-black border-[#262626] text-white active:border-white' : 'bg-neutral-50 border-neutral-200 text-neutral-900 active:border-neutral-900'">
            <span class="text-[15px] font-black">Mini Shoot</span>
            <svg class="w-5 h-5 text-[#8E8E93]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
            </svg>
          </button>

        </div>
      </section>

      <!-- TILES -->
      <div class="grid grid-cols-2 gap-3">
        <div class="rounded-3xl p-4 h-[104px] flex flex-col justify-between border transition-colors duration-300"
             :class="isDark ? 'bg-[#121212] border-[#262626]' : 'bg-white border-neutral-300 shadow-sm'">
          <div class="flex justify-between items-center">
            <svg class="w-5 h-5" :class="isDark ? 'text-white' : 'text-neutral-900'" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>

           :style="`transform: translateY(${dragY}px)`"
           @pointermove.window="dragMove($event)"
           @pointerup.window="dragEnd()"
           class="fixed bottom-0 left-0 right-0 max-w-md mx-auto border-t-2 rounded-t-[36px] p-5 pt-3 z-50 shadow-[0_-10px_25px_rgba(255,255,255,0.15)] flex flex-col gap-3 max-h-[92vh] overflow-y-auto no-scrollbar transition-colors duration-300"

                   @touchmove="if(swiping) { offsetX = $event.touches[0].clientX - startX; if(offsetX > 0) offsetX = 0; }"

                      </svg>

                        <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                      </svg>

          </div>

        </div>

    <!-- FULL SHOOT BOTTOM SHEET -->

                      includeTax

                        : (isDark ? 'bg-white/5 text-neutral-400 border-white/10 hover:border-white/20 hover:text-white' : 'bg-black/5 text-neutral-500 border-black/10 hover:border-black/20 hover:text-black')

            </button>

           x-transition:leave-end="translate-y-full"
           :style="`transform: translateY(${dragY}px)`"
           @pointermove.window="dragMove($event)"
           @pointerup.window="dragEnd()"
           class="fixed bottom-0 left-0 right-0 max-w-md mx-auto border-t rounded-t-[36px] p-5 pt-3 z-50 shadow-2xl flex flex-col gap-3.5 max-h-[92vh] overflow-y-auto no-scrollbar transition-colors duration-300"
           :class="isDark ? 'bg-[#050505] text-white border-white/20' : 'bg-white text-neutral-900 border-neutral-300'">

        <div class="py-2.5 w-full flex justify-center cursor-grab active:cursor-grabbing touch-none select-none"
             @pointerdown="dragStart($event)">
          <div class="w-12 h-1.5 rounded-full transition-colors duration-300"
               :class="isDark ? 'bg-white/30 hover:bg-white/50' : 'bg-neutral-300 hover:bg-neutral-400'"></div>
        </div>

        <div class="flex items-end justify-between gap-2 pb-0.5">
          <div class="flex items-center gap-3">
            <div class="w-11 h-11 rounded-2xl flex items-center justify-center shrink-0 border transition-colors duration-300"
                 :class="isDark ? 'bg-white/5 border-white/10 text-white' : 'bg-neutral-100 border-neutral-300 text-neutral-900'">
              <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
              </svg>
            </div>
            <div class="flex flex-col justify-center">
              <span class="text-[13px] font-extrabold leading-none uppercase tracking-widest mb-1"
                    :class="isDark ? 'text-neutral-400' : 'text-neutral-500'">MLS Photos</span>
              <h1 class="text-[28px] font-black leading-none tracking-tight" :class="isDark ? 'text-white' : 'text-neutral-900'">Ranch Shoot</h1>
            </div>
          </div>

          <div class="flex items-baseline gap-1.5 select-none tabular-nums">
            <button @click="includeTax = !includeTax"
                    title="Toggle Sales Tax"
                    class="p-0 cursor-pointer outline-none focus:outline-none group active:scale-90 transition-transform self-baseline mb-[2px]">
              <span class="inline-flex items-center justify-center px-1.5 py-0.5 rounded-[4px] text-[10px] font-black tracking-wider uppercase transition-all duration-300 backdrop-blur-md border leading-tight"
                    :class="[
                      includeTax 
                        ? 'bg-emerald-400/20 text-emerald-400 border-emerald-400/50 shadow-[0_0_6px_rgba(52,211,153,0.3)]' 
                        : (isDark ? 'bg-white/5 text-neutral-400 border-white/10 hover:border-white/20 hover:text-white' : 'bg-black/5 text-neutral-500 border-black/10 hover:border-black/20 hover:text-black')
                    ]">
                TAX
              </span>
            </button>

            <div class="text-[30px] font-black leading-none tracking-tighter flex items-baseline" :class="isDark ? 'text-white' : 'text-neutral-900'">
              <span class="text-[15px] font-black leading-none self-start pt-[2px] mr-[1px] opacity-90">$</span>
              <span x-text="ranchPriceDollars" class="leading-none"></span>
              <span class="text-[15px] font-black leading-none opacity-90 self-baseline" x-text="ranchPriceCents"></span>
            </div>
          </div>
        </div>

        <div>
          <div class="grid grid-cols-2 gap-2 mb-3.5 tabular-nums">
            <template x-for="tImg in [25, 36]" :key="tImg">
              <button @click="selectRanchTier(tImg)"
                      :class="[
                        ranchTargetUpgradeTier === tImg ? 'bg-emerald-400 text-black font-black ring-2 ring-black' : '',
                        !ranchTargetUpgradeTier && ranchEffectiveTier.imgs === tImg ? (isDark ? 'bg-white text-black font-extrabold shadow-lg border-white' : 'bg-neutral-900 text-white font-extrabold shadow-md border-neutral-900') : '',
                        ranchTargetUpgradeTier && ranchTargetUpgradeTier !== tImg ? 'opacity-20 border-transparent bg-transparent' : '',
                        !ranchTargetUpgradeTier && ranchEffectiveTier.imgs !== tImg ? (isDark ? 'bg-neutral-900/60 text-neutral-400 border-white/10 hover:border-white/20' : 'bg-neutral-200/50 text-neutral-600 border-neutral-300 hover:border-neutral-400') : ''
                      ]"
                      class="py-3 px-2 rounded-2xl border flex flex-col items-center justify-center text-center transition-all duration-200 active:scale-95 cursor-pointer">
                <span class="text-[16px] font-bold leading-tight" x-text="tImg + ' Photos'"></span>
                <div class="flex items-start justify-center mt-0.5 leading-none">
                  <span class="text-[10px] font-bold leading-none pt-[1px] mr-[0.5px]">$</span>
                  <span class="text-[14px] font-extrabold leading-none" x-text="getRanchTierPrice(tImg)"></span>
                </div>
              </button>
            </template>
          </div>

          <div class="rounded-2xl border divide-y mb-3.5 tabular-nums overflow-hidden transition-colors duration-300"
               :class="isDark ? 'bg-neutral-900 border-white/10 divide-white/10' : 'bg-white border-neutral-300 divide-neutral-200 shadow-sm'">
            
            <div class="px-4 h-[48px] flex items-center justify-between">
              <span class="text-[15px] font-semibold" :class="isDark ? 'text-neutral-300' : 'text-neutral-700'" x-text="'Base ' + ranchEffectiveTier.imgs + ' Photos'"></span>
              <div class="flex items-start text-[15px] font-bold" :class="isDark ? 'text-neutral-300' : 'text-neutral-800'">
                <span class="text-[10px] font-bold leading-none pt-[1px] mr-[0.5px]">$</span>
                <span class="leading-none" x-text="ranchEffectiveTier.price"></span>
              </div>
            </div>

            <div @click="ranchTargetUpgradeTier && selectRanchTier(ranchTargetUpgradeTier)"
                 class="px-4 h-[48px] flex items-center justify-center transition-all duration-300"
                 :class="[
                   ranchTargetUpgradeTier 
                     ? 'bg-emerald-400 text-black rounded-b-2xl cursor-pointer hover:opacity-95 active:scale-[0.99]'
                     : (ranchExtras > 0 ? (isDark ? 'bg-white text-black font-bold' : 'bg-black text-white font-bold') : (isDark ? 'bg-transparent text-neutral-400 font-semibold' : 'bg-transparent text-neutral-600 font-semibold'))
                 ]">
              
              <template x-if="!ranchTargetUpgradeTier">
                <div class="flex items-center justify-between w-full">
                  <div class="text-[15px] transition-colors flex items-start">
                    <span class="text-[10px] font-bold leading-none pt-[1px] mr-[0.5px]">$</span>
                    <span class="leading-none" x-text="ranchExtras > 0 ? '5 / Extra × ' + ranchExtras : '5 / Extra'"></span>
                  </div>
                  
                  <div class="flex items-center text-[15px] font-bold transition-colors">
                    <template x-if="ranchExtras > 0">
                      <div class="flex items-start">
                        <span class="leading-none mr-[0.5px]">+</span>
                        <span class="text-[10px] font-bold leading-none pt-[1px] mr-[0.5px]">$</span>
                        <span class="leading-none" x-text="ranchExtraTotal"></span>
                      </div>
                    </template>
                    <template x-if="ranchExtras === 0">
                      <div class="flex items-start">
                        <span class="text-[10px] font-bold leading-none pt-[1px] mr-[0.5px]">$</span>
                        <span class="leading-none">0</span>
                      </div>
                    </template>
                  </div>
                </div>
              </template>

              <template x-if="ranchTargetUpgradeTier">
                <div class="flex items-center justify-center gap-2 w-full select-none text-center">
                  <svg class="w-4 h-4 shrink-0 text-black" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l7.5-7.5 7.5 7.5m-15 6l7.5-7.5 7.5 7.5" />
                  </svg>
                  <span class="text-[15px] font-black tracking-tight leading-none text-black">
                    <span x-text="ranchTargetUpgradeTier"></span> Upgrade – Same Price!
                  </span>
                </div>
              </template>
            </div>

          </div>

          <div class="flex items-center justify-between gap-2 mb-2">
            <span class="text-[16px] font-bold" :class="isDark ? 'text-white' : 'text-neutral-900'">Total Photos</span>
            <div class="flex items-center gap-2 shrink-0">
              <div class="flex items-center rounded-2xl border p-1 transition-colors h-11"
                   :class="isDark ? 'bg-neutral-900 border-white/10' : 'bg-white border-neutral-300 shadow-sm'">
                <button @click="updateRanchCount('down')" :disabled="ranchCount <= 25"
                        :class="ranchCount <= 25 ? 'opacity-20 cursor-not-allowed' : (isDark ? 'hover:bg-white/10 text-white cursor-pointer' : 'hover:bg-neutral-100 text-black cursor-pointer')"
                        class="w-8 h-8 rounded-xl font-bold text-lg flex items-center justify-center transition-all active:scale-90">-</button>
                
                <input type="number" 
                       x-model.number="ranchCount"
                       @change="sanitizeRanchInput()"
                       @blur="sanitizeRanchInput()"
                       min="25"
                       max="150"
                       class="w-10 h-8 bg-transparent text-center text-[16px] font-black focus:outline-none tabular-nums"
                       :class="isDark ? 'text-white' : 'text-neutral-900'" />
                
                <button @click="updateRanchCount('up')" :disabled="ranchCount >= 150"
                        :class="ranchCount >= 150 ? 'opacity-20 cursor-not-allowed' : (isDark ? 'hover:bg-white/10 text-white cursor-pointer' : 'hover:bg-neutral-100 text-black cursor-pointer')"
                        class="w-8 h-8 rounded-xl font-bold text-lg flex items-center justify-center transition-all active:scale-90">+</button>
              </div>

              <button @click="addConfiguredItemToCart('MLS Photos: Ranch Shoot', ranchCount + ' imgs', ranchRawTotal, 'home')" 
                      :disabled="state !== 'idle'"
                      :class="state === 'success' ? 'bg-emerald-400 text-black font-black cursor-pointer' : (isDark ? 'bg-white text-black hover:bg-neutral-200 cursor-pointer' : 'bg-black text-white hover:bg-neutral-800 cursor-pointer')"
                      class="h-11 px-4 rounded-2xl flex items-center justify-center transition-all duration-200 active:scale-95 shadow-md">
                <template x-if="state !== 'success'">
                  <svg class="w-6 h-6" :class="isDark ? 'text-black' : 'text-white'" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2.5 3.5h2l2.3 8.8a2 2 0 001.9 1.5h8.6a2 2 0 001.9-1.5l1.8-6.8" stroke-width="2.3" />
                    <circle cx="9" cy="19.5" r="1.5" fill="currentColor" />
                    <circle cx="16.5" cy="19.5" r="1.5" fill="currentColor" />
                    <path d="M11 7.5h5M13.5 5v5" stroke-width="2.6" stroke="currentColor" />
                  </svg>
                </template>
                <template x-if="state === 'success'">
                  <svg class="w-6 h-6 text-black" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2.5 3.5h2l2.3 8.8a2 2 0 001.9 1.5h8.6a2 2 0 001.9-1.5l1.8-6.8" stroke-width="2.3" />
                    <circle cx="9" cy="19.5" r="1.5" fill="currentColor" />
                    <circle cx="16.5" cy="19.5" r="1.5" fill="currentColor" />
                    <path d="M11 7.5l2 2 4.2-4.5" stroke-width="2.8" stroke="currentColor" />
                  </svg>
                </template>
              </button>
            </div>
          </div>
        </div>

        <div class="flex items-center justify-between pt-1 pb-2">
          <div class="relative inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl text-[13px] font-bold border transition-all tracking-tight cursor-pointer"
               :class="isDark ? 'text-neutral-400 bg-white/5 border-white/10 hover:border-white/30' : 'text-neutral-700 bg-neutral-200/60 border-neutral-300 hover:border-neutral-400 shadow-sm'">
            <svg class="w-3.5 h-3.5" :class="isDark ? 'text-white' : 'text-neutral-900'" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z" />
            </svg>
            <span>Wizard</span>
          </div>
        </div>

      </div>
    </template>

  </div>

</body>
</html>
