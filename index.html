<!DOCTYPE html>
<html lang="en" class="h-full antialiased" x-data="{ isDark: true }" :class="isDark ? 'bg-[#050505] text-white' : 'bg-neutral-100 text-neutral-900'">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLS Photo Calculator - Fully Refined</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    [x-cloak] { display: none !important; }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
  </style>
</head>
<body class="min-h-full p-4 flex flex-col items-center justify-center transition-colors duration-300"
      x-data="{ 
        state: 'idle',
        isOpen: false,
        includeTax: false,
        taxRate: 0.0825,
        count: 25,
        selectedBase: 25,
        selectedSqFt: '0-1999',
        selectedLabel: '0 – 1,999 Sq Ft',
        extraCost: 5,

        sqFtOptions: [
          { label: '0 – 1,999 Sq Ft', value: '0-1999' },
          { label: '2,000 – 2,999 Sq Ft', value: '2000-2999' },
          { label: '3,000 – 3,999 Sq Ft', value: '3000-3999' },
          { label: '4,000 – 4,999 Sq Ft', value: '4000-4999' },
          { label: '5,000 – 6,999 Sq Ft', value: '5000-6999' },
          { label: '7,000 – 9,999 Sq Ft', value: '7000-9999' },
          { label: '10,000+ Sq Ft', value: '10000+' }
        ],

        priceMatrix: {
          '0-1999':    { 25: 139, 36: 179, 40: 189, 50: 224 },
          '2000-2999': { 25: 166, 36: 206, 40: 216, 50: 251 },
          '3000-3999': { 25: 189, 36: 229, 40: 239, 50: 274 },
          '4000-4999': { 25: 214, 36: 254, 40: 264, 50: 299 },
          '5000-6999': { 25: 279, 36: 319, 40: 329, 50: 374 },
          '7000-9999': { 25: 339, 36: 379, 40: 389, 50: 434 },
          '10000+':    { 25: 399, 36: 439, 40: 449, 50: 499 }
        },

        get holdsSelection() { return this.selectedSqFt !== ''; },

        selectOption(opt) {
          this.selectedSqFt = opt.value;
          this.selectedLabel = opt.label;
          this.isOpen = false;
          this.selectedBase = 25;
          if (this.count < 25) this.count = 25;
          this.evaluateCheapestBase();
        },

        getTierPrice(imgs) {
          if (!this.holdsSelection) return '--';
          return this.priceMatrix[this.selectedSqFt][imgs];
        },

        selectTier(c) { 
          if (!this.holdsSelection) return;
          this.selectedBase = c;
          this.count = c; 
        },

        evaluateCheapestBase() {
          if (!this.holdsSelection) return;
          const tiers = [25, 36, 40, 50];
          let bestTier = tiers[0];
          let minCost = Infinity;

          for (let t of tiers) {
            let cost = (this.count >= t) ? (this.getTierPrice(t) + (this.count - t) * this.extraCost) : this.getTierPrice(t);
            if (cost < minCost) {
              minCost = cost;
              bestTier = t;
            }
          }

          if (this.count === 33) this.selectedBase = 25;
          else if (this.count === 38) this.selectedBase = 36;
          else if (this.count === 47) this.selectedBase = 40;
          else this.selectedBase = bestTier;
        },

        sanitizeInput() {
          let val = parseInt(this.count, 10);
          if (isNaN(val) || val < 25) val = 25;
          if (val > 150) val = 150;
          this.count = val;
          this.evaluateCheapestBase();
        },

        get effectiveTier() {
          return { imgs: this.selectedBase, price: this.holdsSelection ? this.getTierPrice(this.selectedBase) : 0 };
        },

        get targetUpgradeTier() {
          if (!this.holdsSelection) return null;
          if (this.selectedBase === 25 && this.count === 33) return 36;
          if (this.selectedBase === 36 && this.count === 38) return 40;
          if (this.selectedBase === 40 && this.count === 47) return 50;
          return null;
        },

        get extras() { return Math.max(0, this.count - this.effectiveTier.imgs); },
        get extraTotal() { return this.extras * this.extraCost; },
        get rawTotal() { return this.effectiveTier.price + this.extraTotal; },
        get finalTotal() { 
          if (!this.holdsSelection) return null;
          const amount = this.includeTax ? this.rawTotal * (1 + this.taxRate) : this.rawTotal;
          return amount.toFixed(2);
        },

        get priceDollars() { return this.finalTotal ? this.finalTotal.split('.')[0] : '--'; },
        get priceCents() { return this.finalTotal ? '.' + this.finalTotal.split('.')[1] : ''; },

        updateCount(dir) {
          if (!this.holdsSelection) return;
          if (dir === 'up' && this.count < 150) {
            this.count++;
            this.evaluateCheapestBase();
          }
          if (dir === 'down' && this.count > 25) {
            this.count--;
            this.evaluateCheapestBase();
          }
        },

        triggerCart() {
          if (!this.holdsSelection || this.state !== 'idle') return;
          this.state = 'success';
          if (window.navigator && window.navigator.vibrate) {
            window.navigator.vibrate(40);
          }
          setTimeout(() => { this.state = 'idle'; }, 2500);
        }
      }">

  <!-- MAIN CARD CONTAINER -->
  <main class="w-full max-w-sm p-5 rounded-3xl border transition-colors duration-300 relative shadow-2xl"
        :class="isDark ? 'bg-[#121212] border-white/10 text-white' : 'bg-white border-black/10 text-neutral-900'">

    <!-- HERO HEADER -->
    <div class="mb-5 flex items-end justify-between gap-2 pb-0.5">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-2xl flex items-center justify-center shrink-0 border transition-colors"
             :class="isDark ? 'bg-white/5 border-white/10 text-white' : 'bg-neutral-100 border-black/10 text-neutral-900'">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
        </div>
        <div class="flex flex-col justify-center">
          <span class="text-[13px] font-extrabold leading-none uppercase tracking-widest mb-1" :class="isDark ? 'text-neutral-400' : 'text-neutral-500'">MLS Photos</span>
          <h1 class="text-[28px] font-black leading-none tracking-tight">Full Shoot</h1>
        </div>
      </div>

      <!-- PRICE & TAX CHIP -->
      <div class="flex items-baseline gap-1.5 select-none tabular-nums">
        <button @click="includeTax = !includeTax"
                class="p-1 -m-1 cursor-pointer outline-none active:scale-90 transition-transform self-baseline">
          <span class="inline-flex items-center justify-center px-1.5 py-0.5 rounded-[4px] text-[11px] font-black uppercase transition-all duration-300 backdrop-blur-md border leading-tight"
                :class="[
                  includeTax 
                    ? 'bg-emerald-400/20 text-emerald-400 border-emerald-400/50' 
                    : (isDark ? 'bg-white/5 text-neutral-400 border-white/10' : 'bg-black/5 text-neutral-500 border-black/10')
                ]">
            TAX
          </span>
        </button>

        <div class="text-[28px] font-black leading-none tracking-tighter flex items-baseline">
          <span class="text-base font-black -mr-[0.5px] self-start pt-[2px] leading-none opacity-90">$</span>
          <span x-text="priceDollars" class="leading-none"></span>
          <span class="text-2xl font-black leading-none -ml-[0.5px] opacity-90" x-text="priceCents"></span>
        </div>
      </div>
    </div>

    <!-- SQ FT POPOVER SELECTOR -->
    <div class="relative mb-4">
      <button @click="isOpen = !isOpen" 
              class="w-full h-12 rounded-xl border flex items-center justify-between px-4 text-[17px] font-bold transition-all active:scale-[0.99] shadow-sm"
              :class="isDark ? 'bg-white/5 border-white/15 text-white' : 'bg-neutral-100 border-black/10 text-neutral-900'">
        <span class="w-full text-center pl-4" x-text="selectedLabel"></span>
        <svg class="w-4 h-4 shrink-0 transition-transform duration-300" :class="isOpen ? 'rotate-180' : ''" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
        </svg>
      </button>

      <!-- DROPDOWN OVERLAY -->
      <div x-show="isOpen" x-cloak
           @click.outside="isOpen = false"
           x-transition:enter="transition ease-out duration-200"
           x-transition:enter-start="opacity-0 -translate-y-2 scale-95"
           x-transition:enter-end="opacity-100 translate-y-0 scale-100"
           x-transition:leave="transition ease-in duration-150"
           x-transition:leave-start="opacity-100 translate-y-0 scale-100"
           x-transition:leave-end="opacity-0 -translate-y-2 scale-95"
           class="absolute z-50 top-full mt-2 left-0 w-full rounded-2xl p-2 backdrop-blur-2xl border max-h-60 overflow-y-auto origin-top shadow-2xl"
           :class="isDark ? 'bg-[#18181B]/95 border-white/15 text-white' : 'bg-white/95 border-black/10 text-neutral-900'">
        
        <div class="py-2 text-center text-[13px] font-extrabold text-neutral-400 border-b mb-1"
             :class="isDark ? 'border-white/10' : 'border-black/5'">
          Select Sq Ft
        </div>
        
        <div class="space-y-1">
          <template x-for="opt in sqFtOptions" :key="opt.value">
            <button @click="selectOption(opt)" 
                    class="w-full h-11 px-4 rounded-xl flex items-center justify-center text-center text-[15px] font-semibold transition-all relative active:scale-[0.98]"
                    :class="[
                      selectedSqFt === opt.value 
                        ? (isDark ? 'bg-white/10 text-white font-extrabold' : 'bg-black/5 text-black font-extrabold')
                        : (isDark ? 'hover:bg-white/5 text-neutral-300' : 'hover:bg-black/5 text-neutral-700')
                    ]">
              <span x-text="opt.label"></span>
              <template x-if="selectedSqFt === opt.value">
                <svg class="w-4 h-4 text-emerald-500 absolute right-3 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
                </svg>
              </template>
            </button>
          </template>
        </div>
      </div>
    </div>

    <!-- TIER TILES -->
    <div class="grid grid-cols-4 gap-1.5 mb-4 tabular-nums">
      <template x-for="tImg in [25, 36, 40, 50]" :key="tImg">
        <button @click="selectTier(tImg)"
                :class="[
                  targetUpgradeTier === tImg ? 'bg-emerald-400 text-black font-black ring-2 ring-black' : '',
                  !targetUpgradeTier && effectiveTier.imgs === tImg ? (isDark ? 'bg-white text-black font-extrabold shadow-lg' : 'bg-neutral-900 text-white font-extrabold shadow-md') : '',
                  !targetUpgradeTier && effectiveTier.imgs !== tImg ? (isDark ? 'bg-white/5 text-neutral-400 border-white/10' : 'bg-neutral-100 text-neutral-600 border-black/10') : ''
                ]"
                class="py-2.5 px-1 rounded-xl border flex flex-col items-center justify-center text-center transition-all active:scale-95">
          <span class="text-[15px] font-bold leading-tight" x-text="tImg"></span>
          <div class="flex items-center justify-center mt-0.5 leading-none">
            <span class="text-[11px] font-bold mr-[1px]">$</span>
            <span class="text-[13px] font-extrabold" x-text="getTierPrice(tImg)"></span>
          </div>
        </button>
      </template>
    </div>

    <!-- INSET BREAKDOWN -->
    <div class="rounded-2xl border divide-y mb-4 tabular-nums overflow-hidden"
         :class="isDark ? 'bg-white/5 border-white/10 divide-white/10' : 'bg-neutral-50 border-black/10 divide-neutral-200'">
      <div class="px-3.5 h-[48px] flex items-center justify-between">
        <span class="text-[15px] font-semibold" :class="isDark ? 'text-neutral-300' : 'text-neutral-700'" x-text="'Base ' + effectiveTier.imgs + ' Photos'"></span>
        <div class="flex items-center text-[15px] font-bold">
          <span class="text-[12px] font-bold mr-[1px]">$</span>
          <span x-text="effectiveTier.price"></span>
        </div>
      </div>

      <div @click="targetUpgradeTier && selectTier(targetUpgradeTier)"
           class="px-3.5 h-[48px] flex items-center justify-center transition-all"
           :class="[
             targetUpgradeTier 
               ? 'bg-emerald-400 text-black rounded-b-xl cursor-pointer' 
               : (extras > 0 ? (isDark ? 'bg-white text-black font-bold' : 'bg-black text-white font-bold') : 'bg-transparent text-neutral-400')
           ]">
        <template x-if="!targetUpgradeTier">
          <div class="flex items-center justify-between w-full">
            <div class="text-[15px] flex items-center">
              <span class="text-[12px] font-bold mr-[1px]">$</span>
              <span x-text="extras > 0 ? '5 / Extra × ' + extras : '5 / Extra'"></span>
            </div>
            <div class="flex items-center text-[15px] font-bold">
              <span>+</span><span class="text-[12px] font-bold mr-[1px]">$</span><span x-text="extraTotal"></span>
            </div>
          </div>
        </template>
        <template x-if="targetUpgradeTier">
          <div class="flex items-center justify-center gap-2 w-full text-center">
            <span class="text-[15px] font-black leading-none text-black">
              <span x-text="targetUpgradeTier"></span> Upgrade – Same Price!
            </span>
          </div>
        </template>
      </div>
    </div>

    <!-- STEPPER & CTA -->
    <div class="flex items-center justify-between gap-2 mb-4">
      <span class="text-[16px] font-bold">Total Photos</span>
      <div class="flex items-center gap-2 shrink-0">
        <div class="flex items-center rounded-xl border p-1 h-11"
             :class="isDark ? 'bg-white/5 border-white/10' : 'bg-neutral-100 border-black/10'">
          <button @click="updateCount('down')" :disabled="count <= 25"
                  class="w-7 h-7 rounded-lg font-bold text-lg flex items-center justify-center active:scale-90">-</button>
          <input type="number" x-model.number="count" @change="sanitizeInput()" @blur="sanitizeInput()"
                 class="w-10 h-7 bg-transparent text-center text-[15px] font-black focus:outline-none tabular-nums" />
          <button @click="updateCount('up')" :disabled="count >= 150"
                  class="w-7 h-7 rounded-lg font-bold text-lg flex items-center justify-center active:scale-90">+</button>
        </div>

        <button @click="triggerCart()"
                :class="state === 'success' ? 'bg-emerald-400 text-black' : (isDark ? 'bg-white text-black' : 'bg-black text-white')"
                class="h-11 px-4 rounded-xl flex items-center justify-center transition-all active:scale-95 shadow-md">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.3">
            <path d="M2.5 3.5h2l2.3 8.8a2 2 0 001.9 1.5h8.6a2 2 0 001.9-1.5l1.8-6.8" />
            <circle cx="9" cy="19.5" r="1.5" fill="currentColor" />
            <circle cx="16.5" cy="19.5" r="1.5" fill="currentColor" />
          </svg>
        </button>
      </div>
    </div>

    <!-- FOOTER TOGGLES -->
    <div class="flex items-center justify-between pt-2 border-t" :class="isDark ? 'border-white/10' : 'border-black/10'">
      <div class="px-3 py-1.5 rounded-lg text-[13px] font-bold border shrink-0"
           :class="isDark ? 'text-neutral-400 bg-white/5 border-white/10' : 'text-neutral-700 bg-neutral-100 border-black/10'">
        <span>Wizard</span>
      </div>
      <button @click="isDark = !isDark" class="w-8 h-8 flex items-center justify-center text-lg">
        <span x-text="isDark ? '☀️' : '🌙'"></span>
      </button>
    </div>

  </main>
</body>
</html>
