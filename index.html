<!DOCTYPE html>
<html lang="en" class="h-full antialiased bg-[#050505] text-white">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full Component Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="min-h-full p-4 flex flex-col items-center justify-center"
      x-data="{ 
        sqft: '0 – 1,999 Sq Ft',
        selectedPhotos: 25,
        basePrice: 139,
        photos: [
          { count: 25, price: 139 },
          { count: 36, price: 169 },
          { count: 40, price: 189 },
          { count: 50, price: 219 }
        ]
      }">

  <!-- FULL RESTORED COMPONENT CARD -->
  <div class="w-full max-w-sm bg-neutral-900 border border-white/10 rounded-3xl p-5 shadow-2xl relative overflow-hidden">
    
    <!-- Ambient Red Background Glow -->
    <div class="absolute -top-12 -left-12 w-32 h-32 bg-red-600/20 rounded-full blur-2xl pointer-events-none"></div>

    <!-- Restored Clean Header Unit -->
    <header class="flex items-center justify-between pb-4 mb-4 border-b border-white/10 relative z-10">
      <div>
        <span class="text-[9px] font-black uppercase tracking-[0.2em] text-red-500 block mb-0.5">MLS Photos</span>
        <h1 class="text-xl font-black tracking-tight text-white">Full Shoot</h1>
      </div>
      <div class="text-3xl font-black tracking-tight text-white tabular-nums">
        <span class="text-lg font-bold text-red-500">$</span><span x-text="basePrice"></span><span class="text-sm font-bold opacity-60">.00</span>
      </div>
    </header>

    <!-- Calculator Selector Step 1: Sq Ft Indicator -->
    <div class="mb-4">
      <label class="text-[10px] font-black uppercase tracking-widest text-neutral-400 block mb-1.5">Coverage Area</label>
      <div class="w-full h-10 rounded-xl border border-white/10 bg-white/5 flex items-center justify-between px-3 text-xs font-bold text-neutral-200">
        <span x-text="sqft"></span>
        <svg class="w-4 h-4 text-neutral-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
        </svg>
      </div>
    </div>

    <!-- Calculator Selector Step 2: Photo Count Grid -->
    <div>
      <label class="text-[10px] font-black uppercase tracking-widest text-neutral-400 block mb-1.5">Select Photo Count</label>
      <div class="grid grid-cols-4 gap-2">
        <template x-for="item in photos" :key="item.count">
          <button @click="selectedPhotos = item.count; basePrice = item.price"
                  class="h-14 rounded-xl border flex flex-col items-center justify-center transition-all duration-150 active:scale-95"
                  :class="selectedPhotos === item.count 
                    ? 'bg-red-600 border-red-500 text-white shadow-lg shadow-red-600/30' 
                    : 'bg-white/5 border-white/10 text-neutral-300 hover:border-white/20'">
            <span class="text-xs font-black" x-text="item.count"></span>
            <span class="text-[10px] font-extrabold opacity-80" x-text="'$' + item.price"></span>
          </button>
        </template>
      </div>
    </div>

    <!-- Action Button -->
    <button class="w-full mt-5 py-3 rounded-xl bg-white text-black font-black text-xs uppercase tracking-wider hover:bg-neutral-200 transition-colors">
      Add To Order
    </button>

  </div>

</body>
</html>
