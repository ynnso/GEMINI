        levenshtein(a, b) {
          const m = a.length, n = b.length;
          if (m === 0) return n;
          if (n === 0) return m;
          let prev = Array.from({ length: n + 1 }, (_, i) => i);
          for (let i = 1; i <= m; i++) {
            const row = [i];
            for (let j = 1; j <= n; j++) {
              const cost = a[i - 1] === b[j - 1] ? 0 : 1;
              row[j] = Math.min(row[j - 1] + 1, prev[j] + 1, prev[j - 1] + cost);
            }
            prev = row;
          }
          return prev[n];
        },
        fuzzyTypoBudget(len) { return len <= 3 ? 0 : (len <= 6 ? 1 : 2); },
        fuzzyMatch(query, text) {
          const t = text.toLowerCase();

          const budget = this.fuzzyTypoBudget(query.length);
          if (budget === 0) return false;
          const words = t.split(/\s+/);
          for (const w of words) {
            const slice = w.slice(0, query.length + budget);
            if (this.levenshtein(query, slice) <= budget) return true;
          }
          return this.levenshtein(query, t.slice(0, query.length + budget)) <= budget;
        },

          this.dragY = 0;
          this.activeSheet = null;
          if (this.ctaTimeoutId) { clearTimeout(this.ctaTimeoutId); this.ctaTimeoutId = null; }
          this.state = 'idle';
          if (sheetName === 'floorplan') { this.floorSqFt = '0-3999'; this.floorPlanType = '2D'; }
          if (sheetName === 'matterport') { this.mpSqFt = '0-1999'; this.mpService = 'Standard'; }
          if (sheetName === 'zillow') { this.zillowSqFt = '0-1999'; }
          this.$nextTick(() => {
            this.activeSheet = sheetName;
          });
        },

        closeSheet() {
          this.activeSheet = null;
          this.mpCustomSqftInput = '';
          setTimeout(() => { this.dragY = 0; }, 300);
        },

        /* FAVE 5 */
        fave5: [],
        showFave5Sheet: false,
        faveRemoveConfirmIndex: null,
        faveRemoveConfirmTimer: null,
        faveProductSheets: ['full','mini','reshoot','exterior','ranch','airbnb','zillow','matterport','videoBuzz','videoHD','videoFullHD','floorplan','aerialProduct','port','addonProduct'],
        faveHeroMap: { full:'photos', mini:'photos', reshoot:'photos', exterior:'photos', ranch:'photos', airbnb:'photos', zillow:'tour360', matterport:'tour360', videoBuzz:'video', videoHD:'video', videoFullHD:'video', floorplan:'floor', aerialProduct:'aerial', port:'aerial', addonProduct:'addons' },
        saveFave5() { try { sessionStorage.setItem('fave5', JSON.stringify(this.fave5)); } catch (e) {} },
        loadFave5() {
          try { this.fave5 = JSON.parse(sessionStorage.getItem('fave5')) || []; }
          catch (e) { this.fave5 = []; }
        },
        sqFtLabelFor(value, options) {
          const found = (options || []).find(o => o.value === value);
          return found ? found.label : value;
        },
        captureFaveParams(sheet) {
          switch (sheet) {
            case 'full': return { selectedSqFt: this.selectedSqFt, count: this.count };
            case 'mini': return { miniCount: this.miniCount };
            case 'reshoot': return { reshootCount: this.reshootCount };
            case 'exterior': return { exteriorCount: this.exteriorCount };
            case 'ranch': return { ranchCount: this.ranchCount, ranchSelectedBase: this.ranchSelectedBase };
            case 'airbnb': return { airbnbCount: this.airbnbCount };
            case 'zillow': return { zillowSqFt: this.zillowSqFt };
            case 'matterport': return { mpPortSide: this.mpPortSide, mpSqFt: this.mpSqFt, mpService: this.mpService, mpCustomSqft: this.mpCustomSqft };
            case 'videoBuzz': case 'videoHD': case 'videoFullHD':
              return { videoSelectedSide: this.videoSelectedSide, videoPortSector: this.videoPortSector, videoSelected: this.videoSelected };
            case 'floorplan': return { floorPortSide: this.floorPortSide, floorSqFt: this.floorSqFt, floorPlanType: this.floorPlanType, floorNumFloors: this.floorNumFloors };
            case 'aerialProduct': return { aerialSelectedSide: this.aerialSelectedSide, aerialSelected: this.aerialSelected, aerialQty: this.aerialQty };
            case 'port': return { portBrand: this.portBrand, portQty: this.portQty };
            case 'addonProduct': return { addonsCategory: this.addonsCategory, addonSelected: this.addonSelected, addonQty: this.addonQty, addonHours: this.addonHours };
            default: return {};
          }
        },
        restoreFaveParams(sheet, p) {
          switch (sheet) {
            case 'full': this.selectedSqFt = p.selectedSqFt; this.count = p.count; this.evaluateCheapestBase(); break;
            case 'mini': this.miniCount = p.miniCount; break;
            case 'reshoot': this.reshootCount = p.reshootCount; break;
            case 'exterior': this.exteriorCount = p.exteriorCount; break;
            case 'ranch': this.ranchCount = p.ranchCount; this.ranchSelectedBase = p.ranchSelectedBase; break;
            case 'airbnb': this.airbnbCount = p.airbnbCount; break;
            case 'zillow': this.zillowSqFt = p.zillowSqFt; break;
            case 'matterport': this.mpPortSide = p.mpPortSide; this.mpSqFt = p.mpSqFt; this.mpService = p.mpService; this.mpCustomSqft = p.mpCustomSqft; break;
            case 'videoBuzz': case 'videoHD': case 'videoFullHD':
              this.videoSelectedSide = p.videoSelectedSide; this.videoPortSector = p.videoPortSector; this.videoSelected = p.videoSelected; break;
            case 'floorplan': this.floorPortSide = p.floorPortSide; this.floorSqFt = p.floorSqFt; this.floorPlanType = p.floorPlanType; this.floorNumFloors = p.floorNumFloors; break;
            case 'aerialProduct': this.aerialSelectedSide = p.aerialSelectedSide; this.aerialSelected = p.aerialSelected; this.aerialQty = p.aerialQty; break;
            case 'port': this.portBrand = p.portBrand; this.portQty = p.portQty; break;
            case 'addonProduct': this.addonsCategory = p.addonsCategory; this.addonSelected = p.addonSelected; this.addonQty = p.addonQty; this.addonHours = p.addonHours; break;
          }
        },
        aerialPartLabelMap: {
          'Aerial Mini 2 Images': '2 Images',
          'Aerial Standard 5 Images': '5 Images',
          'Aerial Curb Appeal Video 30 sec': '30 sec Video',
          'Aerial Video 2 min': '2 min Video'
        },
        aerialComboDetail(selected) {
          return selected.split(' + ').map(part => this.aerialPartLabelMap[part] || part).join(' + ');
        },
        addonFaveSuffix(p) {
          if (this.addonHasStepper(p.addonSelected)) return p.addonQty + ' Photos';
          if (this.addonIsHourly(p.addonSelected)) return p.addonHours + ' Hr';
          return '';
        },
        faveLabel(sheet, p) {
          switch (sheet) {
            case 'full': return 'MLS Full Shoot ' + this.sqFtLabelFor(p.selectedSqFt, this.sqFtOptions) + ' ' + p.count + ' Photos';
            case 'mini': return 'MLS Mini Shoot ' + p.miniCount + ' Photos';
            case 'reshoot': return 'MLS Reshoot ' + p.reshootCount + ' Photos';
            case 'exterior': return 'MLS Exterior Only ' + p.exteriorCount + ' Photos';
            case 'ranch': return 'MLS Ranch Shoot ' + p.ranchCount + ' Photos';
            case 'airbnb': return 'Airbnb Package ' + p.airbnbCount + ' Photos';
            case 'zillow': return 'Zillow 3D Tour ' + this.sqFtLabelFor(p.zillowSqFt, this.zillowSqFtOptions);
            case 'matterport': return p.mpPortSide + ' Matterport ' + p.mpService + ' ' + (p.mpSqFt === '6000' ? (p.mpCustomSqft + ' Sq Ft') : this.sqFtLabelFor(p.mpSqFt, this.mpSqFtOptions));
            case 'videoBuzz': case 'videoHD': case 'videoFullHD':
              return (p.videoSelectedSide === 'PORT' ? ('PORT ' + p.videoPortSector) : 'MLS') + ' ' + p.videoSelected;
            case 'floorplan': return p.floorPortSide + ' Floor Plan ' + this.sqFtLabelFor(p.floorSqFt, this.floorSqFtOptions) + ' ' + p.floorPlanType;
            case 'aerialProduct': return p.aerialSelectedSide + ' ' + p.aerialSelected;
            case 'port': return 'PORT ' + p.portBrand + ' ' + p.portQty + ' Photos';
            case 'addonProduct': {
              const suffix = this.addonFaveSuffix(p);
              return 'Add-Ons ' + p.addonSelected + (suffix ? ' ' + suffix : '');
            }
            default: return this.catTitle[sheet] || sheet;
          }
        },
        faveRawTotalGetter: {
          full: 'rawTotal', mini: 'miniRawTotal', reshoot: 'reshootRawTotal', exterior: 'exteriorRawTotal',
          ranch: 'ranchRawTotal', airbnb: 'airbnbRawTotal', zillow: 'zillowRawTotal', matterport: 'mpRawTotal',
          videoBuzz: 'videoRawTotal', videoHD: 'videoRawTotal', videoFullHD: 'videoRawTotal',
          floorplan: 'floorRawTotal', aerialProduct: 'aerialRawTotal', port: 'portRawTotal', addonProduct: 'addonRawTotal'
        },
        faveEntryPrice(entry) {
          const sheet = entry.sheet;
          const getterName = this.faveRawTotalGetter[sheet];
          if (!getterName) return null;
          const backup = this.captureFaveParams(sheet);
          this.restoreFaveParams(sheet, entry.params);
          const price = this[getterName];
          this.restoreFaveParams(sheet, backup);
          return price;
        },
        get currentFaveIndex() {
          if (!this.faveProductSheets.includes(this.activeSheet)) return -1;
          const params = this.captureFaveParams(this.activeSheet);
          return this.fave5.findIndex(f => f.sheet === this.activeSheet && JSON.stringify(f.params) === JSON.stringify(params));
        },
        addCurrentToFave() {
          const sheet = this.activeSheet;
          const params = this.captureFaveParams(sheet);
          const entry = { sheet, hero: this.faveHeroMap[sheet], label: this.faveLabel(sheet, params), params };
          this.fave5.unshift(entry);
          if (this.fave5.length > 5) this.fave5.length = 5;
          this.saveFave5();
        },
        jumpToFave(entry) {
          this.openSheet(entry.sheet);
          this.restoreFaveParams(entry.sheet, entry.params);
          this.makeHero(entry.hero);
          this.showFave5Sheet = false;
        },
        toggleFaveHeart() {
          if (this.showFave5Sheet) { this.showFave5Sheet = false; this.faveRemoveConfirmIndex = null; return; }
          const idx = this.currentFaveIndex;
          if (idx !== -1) {
            if (this.faveRemoveConfirmIndex === idx) {
              this.fave5.splice(idx, 1);
              this.saveFave5();
              this.faveRemoveConfirmIndex = null;
              if (this.faveRemoveConfirmTimer) clearTimeout(this.faveRemoveConfirmTimer);
              return;
            }
            this.faveRemoveConfirmIndex = idx;
            if (this.faveRemoveConfirmTimer) clearTimeout(this.faveRemoveConfirmTimer);
            this.faveRemoveConfirmTimer = setTimeout(() => { this.faveRemoveConfirmIndex = null; }, 2500);
            return;
          }
          if (this.faveProductSheets.includes(this.activeSheet)) {
            this.addCurrentToFave();
          }
          this.showFave5Sheet = true;
        },
        initFaveSortable(el) {
          if (typeof Sortable === 'undefined') return;
          if (el._sortableInstance) return;
          el._sortableInstance = Sortable.create(el, {
            handle: '.fave-drag-handle',
            animation: 150,
            onEnd: (evt) => {
              const moved = this.fave5.splice(evt.oldIndex, 1)[0];
              this.fave5.splice(evt.newIndex, 0, moved);
              this.saveFave5();
            }
          });
        },

        dragStart(e) {
          const clientY = e.clientY ?? (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
          this.startY = clientY;
          this.lastY = clientY;
          this.lastTime = Date.now();
          this.velocityY = 0;
          this.isDragging = true;
        },

        dragMove(e) {
          if (!this.isDragging) return;
          const currentY = e.clientY ?? (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
          const now = Date.now();
          const deltaY = currentY - this.startY;
          const dt = now - this.lastTime;

          if (dt > 0) {
            this.velocityY = (currentY - this.lastY) / dt;
          }

          this.lastY = currentY;
          this.lastTime = now;

          if (deltaY < 0) {
            this.dragY = deltaY * 0.25; 
          } else {
            this.dragY = deltaY;
          }
        },

        dragEnd() {
          if (!this.isDragging) return;
          this.isDragging = false;

          if (this.dragY > 100 || this.velocityY > 0.45) {
            if (this.showFave5Sheet) {
              this.showFave5Sheet = false;
              setTimeout(() => { this.dragY = 0; }, 300);
            } else {
              this.closeSheet();
            }
          } else {
            this.dragY = 0;
          }
        }
      }));
});
</script>

                :disabled="state !== 'idle'"
                :class="state === 'success' ? 'bg-white text-[#e60000] border-2 border-[#e60000]' : 'text-white'"
                :style="state !== 'success' ? (isDark ? 'background:#ff2a2a; box-shadow: 4px 4px 12px rgba(255,42,42,0.35), 4px 4px 8px #14171c;' : 'background:#e60000; box-shadow: 4px 4px 12px rgba(230,0,0,0.35), 4px 4px 8px #b8bec9;') : ''"
                class="h-14 rounded-[16px] flex items-center justify-center gap-2 transition-all duration-200 active:scale-[0.97] shrink-0 mx-5 mb-[84px]">
          <template x-if="state !== 'success'">
            <span class="flex items-center -space-x-3">
              <svg class="w-10 h-10 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M12 6V18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M6 12H18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <svg class="w-14 h-14 text-white" viewBox="0 0 24 24" stroke-width="1.8" fill="none">
                <path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17" stroke="currentColor"/>
              </svg>
            </span>
          </template>
          <template x-if="state === 'success'">
            <span class="flex items-center -space-x-3">
              <svg class="w-10 h-10 text-[#e60000]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M12 6V18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M6 12H18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <svg class="w-14 h-14 text-[#e60000]" viewBox="0 0 24 24" stroke-width="1.8" fill="none">
                <path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17" stroke="currentColor"/>
              </svg>
            </span>
          </template>
        </button>

      </div>
    </template>

  </div>

</body>
</html>
