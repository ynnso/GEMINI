<!DOCTYPE html>
<html lang="en" class="h-full antialiased" x-data="{ isDark: true, variant: 'badge-right' }" :class="isDark ? 'bg-[#050505] text-white' : 'bg-neutral-100 text-neutral-900'">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tax Chip Variants Showcase</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    [x-cloak] { display: none !important; }
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }

    @keyframes subtle-pulse-white {
      0%, 100% { border-color: rgba(255, 255, 255, 0.25); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
      50% { border-color: rgba(255, 255, 255, 0.8); box-shadow: 0 0 12px 0 rgba(255, 255, 255, 0.25); }
    }

    @keyframes subtle-pulse-red-light {
      0%, 100% { border-color: rgba(239, 68, 68, 0.4); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
      50% { border-color: rgba(239, 68, 68, 0.9); box-shadow: 0 0 10px 0 rgba(239, 68, 68, 0.2); }
    }

    .animate-pulse-dark { animation: subtle-pulse-white 2s infinite ease-in-out; }
    .animate-pulse-light { animation: subtle-pulse-red-light 1.8s infinite ease-in-out; }

    select.text-center-select {
      text-align-last: center;
      text-align: center;
    }
  </style>
</head>
<body class="min-h-full p-4 flex flex-col items-center justify-center transition-colors duration-300"
      x-data="{ 
        state: 'idle',
        includeTax: false,
        taxRate: 0.0825,
        count: 25,
        selectedBase: 25,
        selectedSqFt: '0-1999',
        extraCost: 5,

        sqFtOptions: [
          { label: '0 – 1,999 Sq Ft', value: '0-1999' },
          { label: '2,000 – 2,999 Sq Ft', value: '2000-2999' },
          { label: '3,000 – 3,999 Sq Ft', value: '3000-3999' },
          { label: '4,000 – 4,999 Sq Ft', value: '4000-4999' },
          { label: '5,000 – 6,999 Sq Ft', value: '5000-6999' },
          { label: '7,000 – 9,999 Sq Ft', value: '7000-9999' },
          { label: '10,000+ Sq Ft', value: '10000+' }
        ],

        priceMatrix: {
          '0-1999':    { 25: 139, 36: 179, 40: 189, 50: 224 },
          '2000-2999': { 25: 166, 36: 206, 40: 216, 50: 251 },
          '3000-3999': { 25: 189, 36: 229, 40: 239, 50: 274 },
          '4000-4999': { 25: 214, 36: 254, 40: 264, 50: 299 },
          '5000-6999': { 25: 279, 36: 319, 40: 329, 50: 374 },
          '7000-9999': { 25: 339, 36: 379, 40: 389, 50: 434 },
          '10000+':    { 25: 399, 36: 439, 40: 449, 50: 499 }
        },

        get holdsSelection() { return this.selectedSqFt !== ''; },

        handleSqFtChange() {
          this.selectedBase = 25;
          if (this.count < 25) this.count = 25;
          this.evaluateCheapestBase();
        },

        getTierPrice(imgs) {
          if (!this.holdsSelection) return '--';
          return this.priceMatrix[this.selectedSqFt][imgs];
        },

        selectTier(c) { 
          if (!this.holdsSelection) return;
          this.selectedBase = c;
          this.count = c; 
        },

        evaluateCheapestBase() {
          if (!this.holdsSelection) return;
          const tiers = [25, 36, 40, 50];
          let bestTier = tiers[0];
          let minCost = Infinity;

          for (let t of tiers) {
            let cost = (this.count >= t) ? (this.getTierPrice(t) + (this.count - t) * this.extraCost) : this.getTierPrice(t);
            if (cost < minCost) {
              minCost = cost;
              bestTier = t;
            }
          }

          if (this.count === 33) this.selectedBase = 25;
          else if (this.count === 38) this.selectedBase = 36;
          else if (this.count === 47) this.selectedBase = 40;
          else this.selectedBase = bestTier;
        },

        sanitizeInput() {
          let val = parseInt(this.count, 10);
          if (isNaN(val) || val < 25) val = 25;
          if (val > 150) val = 150;
          this.count = val;
          this.evaluateCheapestBase();
        },

        get effectiveTier() {
          return { imgs: this.selectedBase, price: this.holdsSelection ? this.getTierPrice(this.selectedBase) : 0 };
        },

        get targetUpgradeTier() {
          if (!this.holdsSelection) return null;
          if (this.selectedBase === 25 && this.count === 33) return 36;
          if (this.selectedBase === 36 && this.count === 38) return 40;
          if (this.selectedBase === 40 && this.count === 47) return 50;
          return null;
        },

        get extras() { return Math.max(0, this.count - this.effectiveTier.imgs); },
        get extraTotal() { return this.extras * this.extraCost; },
        get rawTotal() { return this.effectiveTier.price + this.extraTotal; },
        get finalTotal() { 
          if (!this.holdsSelection) return null;
          const amount = this.includeTax ? this.rawTotal * (1 + this.taxRate) : this.rawTotal;
          return amount.toFixed(2);
        },

        get priceDollars() { return this.finalTotal ? this.finalTotal.split('.')[0] : '--'; },
        get priceCents() { return this.finalTotal ? '.' + this.finalTotal.split('.')[1] : ''; },

        updateCount(dir) {
          if (!this.holdsSelection) return;
          if (dir === 'up' && this.count < 150) {
            this.count++;
            this.evaluateCheapestBase();
          }
          if (dir === 'down' && this.count > 25) {
            this.count--;
            this.evaluateCheapestBase();
          }
        },

        triggerCart() {
          if (!this.holdsSelection || this.state !== 'idle') return;
          this.state = 'success';
          if (window.navigator && window.navigator.vibrate) {
            window.navigator.vibrate(40);
          }
          setTimeout(() => { this.state = 'idle'; }, 2500);
        }
      }">

  <!-- VARIANT TESTER TOOLBAR -->
  <header class="mb-6 flex flex-wrap items-center justify-center gap-1.5 p-1.5 rounded-2xl border text-[11px] font-bold transition-colors"
          :class="isDark ? 'bg-neutral-900/80 border-white/10 text-neutral-400' : 'bg-white border-neutral-300 text-neutral-600 shadow-sm'">
    <span class="px-2 text-[10px] uppercase tracking-wider font-extrabold opacity-60">Variant:</span>
    
    <button @click="variant = 'badge-right'" 
            :class="variant === 'badge-right' ? (isDark ? 'bg-white text-black font-extrabold' : 'bg-black text-white font-extrabold') : 'hover:opacity-100 opacity-70'"
            class="px-2.5 py-1 rounded-xl transition-all">1. Baseline Badge</button>
    
    <button @click="variant = 'ceiling-right'" 
            :class="variant === 'ceiling-right' ? (isDark ? 'bg-white text-black font-extrabold' : 'bg-black text-white font-extrabold') : 'hover:opacity-100 opacity-70'"
            class="px-2.5 py-1 rounded-xl transition-all">2. Ceiling Stack</button>
    
    <button @click="variant = 'under-subtle'" 
            :class="variant === 'under-subtle' ? (isDark ? 'bg-white text-black font-extrabold' : 'bg-black text-white font-extrabold') : 'hover:opacity-100 opacity-70'"
            class="px-2.5 py-1 rounded-xl transition-all">3. Under Pill</button>

    <button @click="variant = 'dot-left'" 
            :class="variant === 'dot-left' ? (isDark ? 'bg-white text-black font-extrabold' : 'bg-black text-white font-extrabold') : 'hover:opacity-100 opacity-70'"
            class="px-2.5 py-1 rounded-xl transition-all">4. Status Dot</button>
  </header>

  <!-- MAIN CARD CONTAINER -->
  <main class="w-full max-w-sm py-6 border-y px-2 transition-colors duration-300"
        :class="isDark ? 'border-white/15' : 'border-neutral-300'">

    <!-- HERO HEADER -->
    <div class="mb-5 flex items-center justify-between gap-2">
      
      <!-- LEFT TITLE & ICON BLOCK -->
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-xl flex items-center justify-center shrink-0 border transition-colors"
             :class="isDark ? 'bg-white/5 border-white/10 text-white' : 'bg-white border-neutral-300 text-neutral-900 shadow-sm'">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
        </div>
        <div class="flex flex-col justify-center">
          <span class="text-[10px] font-extrabold leading-none uppercase tracking-widest mb-1" :class="isDark ? 'text-neutral-400' : 'text-neutral-500'">MLS Photos</span>
          <h1 class="text-2xl font-black leading-none tracking-tight transition-colors" :class="isDark ? 'text-white' : 'text-neutral-900'">Full Shoot</h1>
        </div>
      </div>

      <!-- RIGHT PRICE BLOCK WITH DYNAMIC TAX CHIP VARIANTS -->
      <div class="flex flex-col items-end justify-center select-none">
        
        <!-- VARIANT 2: CEILING STACK (TOP RIGHT OF PRICE) -->
        <template x-if="variant === 'ceiling-right'">
          <button @click="includeTax = !includeTax"
                  :disabled="!holdsSelection"
                  class="mb-1 px-1.5 py-0.5 rounded-full text-[9px] font-black tracking-wider uppercase transition-all duration-200 border cursor-pointer active:scale-95"
                  :class="[
                    includeTax 
                      ? 'bg-emerald-400 text-black border-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.3)]' 
                      : (isDark 
                          ? 'bg-white/5 text-neutral-400 border-white/10 hover:border-white/20' 
                          : 'bg-neutral-200/80 text-neutral-600 border-neutral-300 hover:border-neutral-400')
                  ]">
            <span x-text="includeTax ? 'TAX INCL' : '+ TAX'"></span>
          </button>
        </template>

        <!-- MAIN PRICE LINE -->
        <div class="flex items-baseline gap-1.5 transition-colors tabular-nums">
          
          <div class="text-3xl font-black leading-none tracking-tighter flex items-baseline"
               :class="isDark ? 'text-white' : 'text-neutral-900'">
            <template x-if="holdsSelection">
              <span class="text-sm font-black -mr-[0.5px] self-start pt-[2px] leading-none opacity-90">$</span>
            </template>
            <span x-text="priceDollars" class="leading-none"></span>
            <span class="text-2xl font-black leading-none -ml-[0.5px] opacity-90" x-text="priceCents"></span>
          </div>

          <!-- VARIANT 1: BASELINE BADGE (RIGHT SIDE OF CENTS) -->
          <template x-if="variant === 'badge-right'">
            <button @click="includeTax = !includeTax"
                    :disabled="!holdsSelection"
                    class="px-1.5 py-0.5 rounded-md text-[9px] font-black tracking-wider uppercase transition-all duration-200 border cursor-pointer active:scale-95 shrink-0"
                    :class="[
                      includeTax 
                        ? 'bg-emerald-400 text-black border-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.3)]' 
                        : (isDark 
                            ? 'bg-white/5 text-neutral-400 border-white/10 hover:border-white/20' 
                            : 'bg-neutral-200/80 text-neutral-600 border-neutral-300 hover:border-neutral-400')
                    ]">
              <span x-text="includeTax ? 'TAX INCL' : '+ TAX'"></span>
            </button>
          </template>

          <!-- VARIANT 4: STATUS DOT INLINE -->
          <template x-if="variant === 'dot-left'">
            <button @click="includeTax = !includeTax"
                    :disabled="!holdsSelection"
                    class="flex items-center gap-1 px-1.5 py-0.5 rounded-full text-[9px] font-black tracking-tight uppercase transition-all duration-200 border cursor-pointer active:scale-95"
                    :class="[
                      includeTax 
                        ? 'bg-emerald-400/10 text-emerald-400 border-emerald-400/40' 
                        : (isDark 
                            ? 'bg-white/5 text-neutral-500 border-white/10 hover:border-white/20' 
                            : 'bg-neutral-200/60 text-neutral-500 border-neutral-300 hover:border-neutral-400')
                    ]">
              <span class="w-1.5 h-1.5 rounded-full" :class="includeTax ? 'bg-emerald-400 animate-pulse' : 'bg-neutral-500'"></span>
              <span x-text="includeTax ? 'TAX' : '+ TAX'"></span>
            </button>
          </template>

        </div>

        <!-- VARIANT 3: UNDER SUBTLE PILL -->
        <template x-if="variant === 'under-subtle'">
          <button @click="includeTax = !includeTax"
                  :disabled="!holdsSelection"
                  class="mt-1 px-2 py-0.5 rounded-full text-[9px] font-extrabold tracking-wider uppercase transition-all duration-200 cursor-pointer active:scale-95"
                  :class="[
                    includeTax 
                      ? 'bg-emerald-400 text-black shadow-sm' 
                      : (isDark 
                          ? 'text-neutral-500 hover:text-neutral-300' 
                          : 'text-neutral-500 hover:text-black')
                  ]">
            <span x-text="includeTax ? 'TAX INCLUDED' : '+ ADD TAX'"></span>
          </button>
        </template>

      </div>

    </div>

    <!-- CLEAN PROPERTY SIZE SELECTOR -->
    <div class="mb-4">
      <div class="relative">
        <select x-model="selectedSqFt" 
                @change="handleSqFtChange()"
                class="text-center-select w-full h-11 appearance-none pl-8 pr-8 rounded-xl text-xs font-bold border cursor-pointer focus:outline-none transition-all shadow-sm"
                :class="[
                  !holdsSelection 
                    ? (isDark 
                        ? 'animate-pulse-dark bg-neutral-900 text-white border-white/30' 
                        : 'animate-pulse-light bg-white text-red-600 border-red-500/80') 
                    : (isDark 
                        ? 'bg-neutral-900/90 text-white border-white/20' 
                        : 'bg-white text-neutral-900 border-neutral-300')
                ]">
          <option value="" disabled selected :class="isDark ? 'text-white' : 'text-neutral-900'">Select Sq Ft</option>
          <template x-for="opt in sqFtOptions" :key="opt.value">
            <option :value="opt.value" x-text="opt.label" :class="isDark ? 'bg-neutral-900 text-white' : 'bg-white text-neutral-900'"></option>
          </template>
        </select>
        
        <div class="absolute inset-y-0 right-3.5 flex items-center pointer-events-none"
             :class="!holdsSelection && !isDark ? 'text-red-500' : (isDark ? 'text-white' : 'text-neutral-600')">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
          </svg>
        </div>
      </div>
    </div>

    <!-- MAIN INTERACTIVE SECTION -->
    <div :class="!holdsSelection && 'opacity-30 pointer-events-none select-none'">
      
      <!-- PHOTO TIER TILES -->
      <div class="grid grid-cols-4 gap-1.5 mb-4 tabular-nums">
        <template x-for="tImg in [25, 36, 40, 50]" :key="tImg">
          <button @click="selectTier(tImg)"
                  :disabled="!holdsSelection"
                  :class="[
                    targetUpgradeTier === tImg 
                      ? 'bg-emerald-400 text-black font-black ring-2 ring-black' 
                      : '',

                    !targetUpgradeTier && effectiveTier.imgs === tImg && holdsSelection
                      ? (isDark 
                          ? 'bg-white text-black font-extrabold shadow-lg border-white' 
                          : 'bg-neutral-900 text-white font-extrabold shadow-md border-neutral-900') 
                      : '',

                    targetUpgradeTier && targetUpgradeTier !== tImg 
                      ? (isDark ? 'opacity-20 border-transparent bg-transparent' : 'opacity-25 border-transparent bg-transparent') 
                      : '',

                    !targetUpgradeTier && effectiveTier.imgs !== tImg 
                      ? (isDark 
                          ? 'bg-neutral-900/60 text-neutral-400 border-white/10 hover:border-white/20' 
                          : 'bg-neutral-200/50 text-neutral-600 border-neutral-300 hover:border-neutral-400') 
                      : ''
                  ]"
                  class="py-2.5 px-1 rounded-xl border flex flex-col items-center justify-center text-center transition-all duration-200 active:scale-95">
            
            <span class="text-xs font-bold leading-tight" 
                  x-text="tImg"></span>
            
            <div class="flex items-center justify-center mt-0.5 leading-none">
              <template x-if="holdsSelection"><span class="text-[9px] font-bold mr-[1px]">$</span></template>
              <span class="text-xs font-extrabold" 
                    x-text="getTierPrice(tImg)"></span>
            </div>
          </button>
        </template>
      </div>

      <!-- INSET LINE ITEMS -->
      <div class="rounded-xl border divide-y mb-4 tabular-nums transition-colors duration-300 overflow-hidden"
           :class="isDark ? 'bg-neutral-900 border-white/10 divide-white/10' : 'bg-white border-neutral-300 divide-neutral-200 shadow-sm'">
        
        <!-- Base Package Row -->
        <div class="px-3.5 h-[46px] flex items-center justify-between">
          <span class="text-xs font-semibold transition-colors"
                :class="isDark ? 'text-neutral-300' : 'text-neutral-700'" 
                x-text="'Base ' + (holdsSelection ? effectiveTier.imgs : 25) + ' Photos'"></span>
          
          <div class="flex items-center text-xs font-bold transition-colors"
               :class="isDark ? 'text-neutral-300' : 'text-neutral-800'">
            <template x-if="holdsSelection"><span class="text-[10px] font-bold mr-[1px]">$</span></template>
            <span x-text="holdsSelection ? effectiveTier.price : '--'"></span>
          </div>
        </div>

        <!-- TOAST CONTAINER ROW -->
        <div @click="targetUpgradeTier && selectTier(targetUpgradeTier)"
             class="px-3.5 h-[46px] flex items-center justify-center transition-all duration-300"
             :class="[
               targetUpgradeTier 
                 ? 'bg-emerald-400 text-black rounded-b-xl cursor-pointer hover:opacity-95 active:scale-[0.99]'
                 : (extras > 0 && holdsSelection
                     ? (isDark ? 'bg-white text-black font-bold' : 'bg-black text-white font-bold') 
                     : (isDark ? 'bg-transparent text-neutral-400 font-semibold' : 'bg-transparent text-neutral-600 font-semibold'))
             ]">
          
          <template x-if="!targetUpgradeTier">
            <div class="flex items-center justify-between w-full">
              <div class="text-xs transition-colors flex items-center">
                <span class="text-[10px] font-bold mr-[1px]">$</span>
                <span x-text="extras > 0 && holdsSelection ? '5 / Extra × ' + extras : '5 / Extra'"></span>
              </div>
              
              <div class="flex items-center text-xs font-bold transition-colors">
                <template x-if="extras > 0 && holdsSelection">
                  <div class="flex items-center">
                    <span>+</span><span class="text-[10px] font-bold mr-[1px]">$</span><span x-text="extraTotal"></span>
                  </div>
                </template>
                <template x-if="extras === 0 || !holdsSelection">
                  <div class="flex items-center">
                    <span class="text-[10px] font-bold mr-[1px]">$</span><span>0</span>
                  </div>
                </template>
              </div>
            </div>
          </template>

          <!-- UPGRADE BANNER -->
          <template x-if="targetUpgradeTier">
            <div class="flex items-center justify-center gap-2 w-full select-none text-center">
              <svg class="w-4 h-4 shrink-0 text-black" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l7.5-7.5 7.5 7.5m-15 6l7.5-7.5 7.5 7.5" />
              </svg>
              <span class="text-sm font-black tracking-tight leading-none text-black">
                <span x-text="targetUpgradeTier"></span> Upgrade – Same Price!
              </span>
            </div>
          </template>
        </div>

      </div>

      <!-- SEPARATED STEPPER & CTA -->
      <div class="flex items-center justify-between gap-2 mb-4">
        <span class="text-xs font-bold transition-colors" :class="isDark ? 'text-white' : 'text-neutral-900'">Total Photos</span>
        
        <div class="flex items-center gap-2 shrink-0">
          <!-- INDEPENDENT STEPPER CONTAINER -->
          <div class="flex items-center rounded-xl border p-1 transition-colors h-10"
               :class="isDark ? 'bg-neutral-900 border-white/10' : 'bg-white border-neutral-300 shadow-sm'">
            <button @click="updateCount('down')" :disabled="!holdsSelection || count <= 25"
                    :class="!holdsSelection || count <= 25 ? 'opacity-20 cursor-not-allowed' : (isDark ? 'hover:bg-white/10 text-white' : 'hover:bg-neutral-100 text-black')"
                    class="w-6 h-6 rounded-lg font-bold text-base flex items-center justify-center transition-all active:scale-90">-</button>
            
            <input type="number" 
                   x-model.number="count"
                   @change="sanitizeInput()"
                   @blur="sanitizeInput()"
                   :disabled="!holdsSelection"
                   min="25"
                   max="150"
                   class="w-9 h-6 bg-transparent text-center text-xs font-black focus:outline-none tabular-nums transition-colors"
                   :class="isDark ? 'text-white' : 'text-neutral-900'" />
            
            <button @click="updateCount('up')" :disabled="!holdsSelection || count >= 150"
                    :class="!holdsSelection || count >= 150 ? 'opacity-20 cursor-not-allowed' : (isDark ? 'hover:bg-white/10 text-white' : 'hover:bg-neutral-100 text-black')"
                    class="w-6 h-6 rounded-lg font-bold text-base flex items-center justify-center transition-all active:scale-90">+</button>
          </div>

          <!-- INDEPENDENT HIGH-WEIGHT CTA BUTTON -->
          <button @click="triggerCart()" 
                  :disabled="!holdsSelection || state !== 'idle'"
                  :class="[
                    !holdsSelection 
                      ? (isDark ? 'opacity-30 cursor-not-allowed bg-neutral-800 text-neutral-500' : 'opacity-40 cursor-not-allowed bg-neutral-300 text-neutral-500') 
                      : (state === 'success'
                          ? 'bg-emerald-400 text-black font-black'
                          : (isDark ? 'bg-white text-black hover:bg-neutral-200' : 'bg-black text-white hover:bg-neutral-800'))
                  ]"
                  class="h-10 px-4 rounded-xl flex items-center justify-center transition-all duration-200 active:scale-95 shadow-md">
            
            <!-- IDLE STATE -->
            <template x-if="state !== 'success'">
              <svg class="w-4 h-4" :class="!holdsSelection ? 'text-neutral-400' : (isDark ? 'text-black' : 'text-white')" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2.5 3.5h2l2.3 8.8a2 2 0 001.9 1.5h8.6a2 2 0 001.9-1.5l1.8-6.8" stroke-width="2.3" />
                <circle cx="9" cy="19.5" r="1.5" fill="currentColor" />
                <circle cx="16.5" cy="19.5" r="1.5" fill="currentColor" />
                <path d="M11 7.5h5M13.5 5v5" stroke-width="2.6" stroke="currentColor" />
              </svg>
            </template>

            <!-- SUCCESS STATE -->
            <template x-if="state === 'success'">
              <svg class="w-4 h-4 text-black" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2.5 3.5h2l2.3 8.8a2 2 0 001.9 1.5h8.6a2 2 0 001.9-1.5l1.8-6.8" stroke-width="2.3" />
                <circle cx="9" cy="19.5" r="1.5" fill="currentColor" />
                <circle cx="16.5" cy="19.5" r="1.5" fill="currentColor" />
                <path d="M11 7.5l2 2 4.2-4.5" stroke-width="2.8" stroke="currentColor" />
              </svg>
            </template>
          </button>
        </div>
      </div>

    </div>

    <!-- FOOTER WIZARD & THEME TOGGLE -->
    <div class="flex items-center justify-between pt-2">
      <div class="relative inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-[10px] font-bold border transition-all tracking-tight shrink-0 cursor-pointer"
           :class="isDark ? 'text-neutral-400 bg-white/5 border-white/10 hover:border-white/30' : 'text-neutral-700 bg-neutral-200/60 border-neutral-300 hover:border-neutral-400 shadow-sm'">
        <svg class="w-3 h-3" :class="isDark ? 'text-white' : 'text-neutral-900'" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z" />
        </svg>
        <span>Wizard</span>
      </div>

      <!-- Theme Toggle Switch -->
      <button @click="isDark = !isDark" 
              class="w-7 h-7 flex items-center justify-center transition-colors rounded-lg"
              :class="isDark ? 'text-neutral-400 hover:text-white' : 'text-neutral-500 hover:text-black'"
              :title="isDark ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
        <template x-if="isDark">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m0 13.5V21m8.966-8.966h-2.25m-13.5 0H3m15.364-6.364l-1.591 1.591M6.758 17.242l-1.591 1.591m12.728 0l-1.591-1.591M6.758 6.758L5.167 5.167M12 8.25a3.75 3.75 0 100 7.5 3.75 3.75 0 000-7.5z" />
          </svg>
        </template>
        <template x-if="!isDark">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
          </svg>
        </template>
      </button>
    </div>

  </main>
</body>
</html>
