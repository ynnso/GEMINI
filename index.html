<!DOCTYPE html>
<html lang="en" class="h-full bg-black text-white antialiased">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full Shoot - Gold Standard Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body, .pjs-font { font-family: 'Plus Jakarta Sans', sans-serif; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    [x-cloak] { display: none !important; }
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] { -moz-appearance: textfield; }
  </style>
</head>
<body class="min-h-full bg-[#050505] text-white p-4 md:p-8 flex flex-col items-center justify-center pjs-font"
      x-data="{ 
        state: 'idle',
        toast: false,
        flashingTier: null,
        includeTax: false,
        taxRate: 0.08,
        count: 33,
        previousTierImgs: 25,
        maxCount: 150,
        extraCost: 5,

        selectTier(tierCount) {
          this.count = tierCount;
        },

        // DYNAMIC TIER COMPUTATION & AUTO-SWITCH PULSE
        get effectiveTier() {
          let tier = { imgs: 25, price: 139 };
          if (this.count >= 47) tier = { imgs: 50, price: 224 };
          else if (this.count >= 38) tier = { imgs: 40, price: 189 };
          else if (this.count >= 33) tier = { imgs: 36, price: 179 };

          if (tier.imgs > this.previousTierImgs) {
            this.pulseUpgradeTile(tier.imgs);
          }
          this.previousTierImgs = tier.imgs;

          return tier;
        },

        pulseUpgradeTile(tierImgs) {
          this.flashingTier = tierImgs;
          setTimeout(() => { this.flashingTier = null; }, 1800);
        },

        get extras() { 
          return Math.max(0, this.count - this.effectiveTier.imgs); 
        },

        get extraTotal() { 
          return this.extras * this.extraCost; 
        },

        get rawTotal() { 
          return this.effectiveTier.price + this.extraTotal; 
        },

        get finalTotal() { 
          const amount = this.includeTax ? this.rawTotal * (1 + this.taxRate) : this.rawTotal;
          return amount.toFixed(2);
        },

        get priceDollars() { return this.finalTotal.split('.')[0].padStart(3, '0'); },
        get priceCents() { return this.finalTotal.split('.')[1]; },

        getDigit(str, index) {
          return parseInt(str[index]) || 0;
        },

        validateInput() {
          let val = parseInt(this.count);
          if (isNaN(val) || val < 25) {
            this.count = 25;
          } else if (val > this.maxCount) {
            this.count = this.maxCount;
          } else {
            this.count = val;
          }
        },

        updateCount(direction) {
          if (this.state === 'success') return;
          if(direction === 'up' && this.count < this.maxCount) {
            this.count++;
          } else if (direction === 'down' && this.count > 25) {
            this.count--;
          }
        },

        triggerSequence() {
          if (this.state !== 'idle') return;
          this.state = 'success';
          this.toast = true;
          setTimeout(() => {
            this.toast = false;
            setTimeout(() => { this.state = 'idle'; }, 300);
          }, 2800);
        }
      }">

  <!-- TOAST NOTIFICATION -->
  <aside x-show="toast" 
         x-transition:enter="transition ease-out duration-300 transform"
         x-transition:enter-start="-translate-y-3 opacity-0 scale-95"
         x-transition:enter-end="translate-y-0 opacity-100 scale-100"
         x-transition:leave="transition ease-in duration-200 transform"
         x-transition:leave-start="translate-y-0 opacity-100"
         x-transition:leave-end="-translate-y-2 opacity-0"
         x-cloak
         class="absolute -top-12 left-0 right-0 mx-auto w-max bg-neutral-900 border border-white/20 px-4 py-1.5 rounded-full shadow-2xl flex items-center gap-2 text-xs font-semibold text-white z-50">
      <span class="w-1.5 h-1.5 rounded-full bg-white animate-ping"></span>
      <span>Added to cart • <span class="text-neutral-300 tabular-nums" x-text="'$' + finalTotal"></span></span>
  </aside>

  <!-- CARD CONTAINER -->
  <main class="w-full max-w-sm relative bg-[#0A0A0A] p-6 rounded-2xl border border-white/10 transition-all duration-300 group hover:border-white/20 shadow-2xl">
    
    <!-- 1. Header Controls -->
    <div class="flex items-center justify-between mb-4">
      <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-medium bg-white/5 border border-white/10 text-neutral-400">
        🪄 Wizard
      </span>
      <button class="w-6 h-6 rounded-full border border-white/10 flex items-center justify-center text-xs text-neutral-400 hover:border-white/30 transition-colors" title="Includes base photo package with optional extra images.">
        ⓘ
      </button>
    </div>

    <!-- 2. Hero Row -->
    <div class="flex items-start justify-between gap-3 mb-5">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-black border border-white/20 flex items-center justify-center text-white shrink-0">
          <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
        </div>
        <div>
          <span class="text-[10px] font-bold text-neutral-400 uppercase tracking-wider block">MLS PHOTOS</span>
          <h3 class="text-base font-extrabold text-white leading-tight">Full Shoot</h3>
        </div>
      </div>

      <!-- HERO PRICE -->
      <div class="flex flex-col items-end shrink-0">
        <div class="text-red-500 font-bold text-3xl tracking-tighter flex items-start leading-none select-none">
          <span class="text-xs font-bold leading-none mt-0.5 mr-[1px]">$</span>
          
          <div class="flex items-baseline leading-none">
            <div class="w-[0.52em] h-[1em] overflow-hidden inline-flex justify-center leading-none">
              <div class="flex flex-col transition-transform duration-300 ease-out" 
                   :style="`transform: translateY(-${getDigit(priceDollars, 0) * 1}em);`">
                <template x-for="n in 10" :key="n-1"><span class="h-[1em] flex items-center justify-center" x-text="n-1"></span></template>
              </div>
            </div>

            <div class="w-[0.52em] h-[1em] overflow-hidden inline-flex justify-center leading-none">
              <div class="flex flex-col transition-transform duration-300 ease-out" 
                   :style="`transform: translateY(-${getDigit(priceDollars, 1) * 1}em);`">
                <template x-for="n in 10" :key="n-1"><span class="h-[1em] flex items-center justify-center" x-text="n-1"></span></template>
              </div>
            </div>

            <div class="w-[0.52em] h-[1em] overflow-hidden inline-flex justify-center leading-none">
              <div class="flex flex-col transition-transform duration-300 ease-out" 
                   :style="`transform: translateY(-${getDigit(priceDollars, 2) * 1}em);`">
                <template x-for="n in 10" :key="n-1"><span class="h-[1em] flex items-center justify-center" x-text="n-1"></span></template>
              </div>
            </div>
          </div>

          <div class="flex items-baseline text-xs font-bold leading-none ml-[1px] self-end mb-0.5">
            <span class="mr-[1px]">.</span>
            <div class="w-[0.52em] h-[1em] overflow-hidden inline-flex justify-center leading-none">
              <div class="flex flex-col transition-transform duration-300 ease-out" 
                   :style="`transform: translateY(-${getDigit(priceCents, 0) * 1}em);`">
                <template x-for="n in 10" :key="n-1"><span class="h-[1em] flex items-center justify-center" x-text="n-1"></span></template>
              </div>
            </div>
            <div class="w-[0.52em] h-[1em] overflow-hidden inline-flex justify-center leading-none">
              <div class="flex flex-col transition-transform duration-300 ease-out" 
                   :style="`transform: translateY(-${getDigit(priceCents, 1) * 1}em);`">
                <template x-for="n in 10" :key="n-1"><span class="h-[1em] flex items-center justify-center" x-text="n-1"></span></template>
              </div>
            </div>
          </div>
        </div>
        
        <!-- Tax Switcher -->
        <label class="flex items-center gap-1.5 mt-2 cursor-pointer select-none">
          <span class="text-[10px] font-medium text-neutral-400" x-text="includeTax ? 'Inc. Tax' : 'No Tax'"></span>
          <input type="checkbox" x-model="includeTax" class="sr-only">
          <div class="w-6 h-3.5 bg-neutral-800 rounded-full border border-white/10 transition-colors relative"
               :class="includeTax ? 'bg-white/20 border-white/30' : 'bg-neutral-800'">
            <div class="w-2.5 h-2.5 bg-neutral-400 rounded-full absolute top-0.5 left-0.5 transition-transform"
                 :class="includeTax ? 'translate-x-2.5 bg-white' : 'translate-x-0'"></div>
          </div>
        </label>
      </div>
    </div>

    <!-- 3. Tier Buttons -->
    <div class="grid grid-cols-2 gap-2 mb-4">
      <template x-for="t in [{imgs: 25, price: 139}, {imgs: 36, price: 179}, {imgs: 40, price: 189}, {imgs: 50, price: 224}]" :key="t.imgs">
        <button @click="selectTier(t.imgs)"
                :class="effectiveTier.imgs === t.imgs ? 'bg-white text-black border-white shadow-lg' : 'bg-neutral-900 text-neutral-400 border-white/10 hover:border-white/20 hover:text-white'"
                :style="flashingTier === t.imgs ? 'box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.9), 0 0 12px rgba(255, 255, 255, 0.3);' : ''"
                class="py-2.5 px-3 rounded-xl border flex flex-col items-center justify-center transition-all duration-300 active:scale-95 relative">
          <span class="text-xs font-bold" :class="effectiveTier.imgs === t.imgs ? 'text-black' : 'text-neutral-300'" x-text="t.imgs + ' Images'"></span>
          
          <div class="mt-0.5 flex items-center gap-1">
            <template x-if="flashingTier === t.imgs">
              <svg class="w-3.5 h-3.5 text-black shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
              </svg>
            </template>
            <span class="text-sm font-extrabold" 
                  :class="effectiveTier.imgs === t.imgs ? 'text-black' : 'text-white'"
                  x-text="flashingTier === t.imgs ? 'Upgraded!' : '$' + t.price"></span>
          </div>
        </button>
      </template>
    </div>

    <!-- 4. Line-Item Breakdown (Gold Standard Context) -->
    <div class="py-3 border-y border-white/10 space-y-2 mb-4 text-xs tabular-nums">
      <div class="flex justify-between text-neutral-400">
        <span>Base Tier</span>
        <span class="text-white font-semibold" x-text="effectiveTier.imgs + ' Images ($' + effectiveTier.price + ')'"></span>
      </div>

      <div class="flex justify-between items-center">
        <span class="text-neutral-400" 
              x-text="extras > 0 ? '$5/extra × ' + extras : (count < effectiveTier.imgs ? 'Included Capacity' : '$5/extra')">
        </span>

        <span class="font-bold transition-all" 
              :class="extras === 0 ? 'text-neutral-500 font-normal' : 'text-white'"
              x-text="extras > 0 ? '+$' + extraTotal : (count < effectiveTier.imgs ? count + '/' + effectiveTier.imgs : '-')">
        </span>
      </div>
    </div>

    <!-- 5. Stepper Row -->
    <div class="flex items-center justify-between py-1 mb-4">
      <span class="text-xs font-semibold text-neutral-300">Image Count</span>
      <div class="flex items-center gap-1 bg-neutral-900 p-1 rounded-xl border border-white/10">
        <button @click="updateCount('down')" 
                :disabled="count <= 25"
                :class="count <= 25 ? 'opacity-20 cursor-not-allowed' : 'hover:bg-neutral-700 active:scale-95 text-white'"
                class="w-7 h-7 rounded-lg bg-neutral-800 font-bold text-sm flex items-center justify-center transition-all duration-150">
          -
        </button>
        
        <input type="number" 
               x-model.number="count"
               @blur="validateInput()"
               @keydown.enter="$event.target.blur()"
               class="w-14 h-7 bg-transparent text-center text-xs font-bold text-white focus:outline-none focus:bg-neutral-800 rounded-md tabular-nums" />

        <button @click="updateCount('up')"
                :disabled="count >= maxCount"
                :class="count >= maxCount ? 'opacity-20 cursor-not-allowed' : 'hover:bg-neutral-700 active:scale-95 text-white'"
                class="w-7 h-7 rounded-lg bg-neutral-800 text-white font-bold text-sm flex items-center justify-center hover:bg-neutral-700 active:scale-95 transition-all duration-150">
          +
        </button>
      </div>
    </div>

    <!-- 6. CTA Button -->
    <button @click="triggerSequence()" :disabled="state !== 'idle'"
            :class="state === 'success' ? 'bg-black border-[2.5px] border-white text-white' : 'bg-white border-[2.5px] border-black text-black active:scale-[0.98]'"
            class="relative w-full h-12 rounded-2xl flex items-center justify-between px-5 transition-all duration-300 group disabled:pointer-events-none z-10">
      
      <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
        <svg x-show="state !== 'success'" class="w-7 h-7 text-black transition-transform duration-200 group-hover:scale-110" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
        </svg>
        
        <div x-show="state === 'success'" x-cloak class="w-7 h-7 rounded-full bg-white text-black flex items-center justify-center shadow-sm">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
          </svg>
        </div>
      </div>

      <div class="ml-auto transition-all duration-300">
        <svg class="w-7 h-7" :class="state === 'success' ? 'text-white' : 'text-black'" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" /></svg>
      </div>
    </button>

  </main>

</body>
</html>
