<!DOCTYPE html>
<html lang="en" class="h-full antialiased" x-data="{ isDark: true }" :class="isDark ? 'bg-[#050505] text-white' : 'bg-neutral-100 text-neutral-900'">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Original Restored Baseline Hero</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="min-h-full p-4 flex flex-col items-center justify-center transition-colors duration-300"
      x-data="{ 
        includeTax: false,
        taxRate: 0.0825,
        rawPrice: 139,
        get finalTotal() {
          const val = this.includeTax ? this.rawPrice * (1 + this.taxRate) : this.rawPrice;
          return val.toFixed(2);
        },
        get priceDollars() { return this.finalTotal.split('.')[0]; },
        get priceCents() { return '.' + this.finalTotal.split('.')[1]; }
      }">

  <!-- MAIN CARD CONTAINER -->
  <main class="w-full max-w-sm p-4 rounded-2xl border transition-all duration-300 relative shadow-xl"
        :class="isDark ? 'bg-neutral-900 border-white/10' : 'bg-white border-neutral-300'">

    <!-- ORIGINAL BASELINE HERO HEADER -->
    <div class="flex items-center justify-between pb-4 mb-4 border-b" :class="isDark ? 'border-white/10' : 'border-neutral-200'">
      <div class="flex items-center gap-3">
        <!-- Service Icon -->
        <div class="w-9 h-9 rounded-xl bg-red-600/10 text-red-500 flex items-center justify-center shrink-0 border border-red-500/20">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z" />
          </svg>
        </div>
        <!-- Title & Category -->
        <div>
          <span class="text-[9px] font-black uppercase tracking-widest text-red-500 block">MLS PHOTOS</span>
          <h1 class="text-base font-black tracking-tight leading-tight">Full Shoot</h1>
        </div>
      </div>

      <!-- Price & Tax Toggle -->
      <div class="flex items-center gap-2 tabular-nums">
        <button @click="includeTax = !includeTax"
                class="px-2 py-0.5 rounded text-[8px] font-black uppercase border transition-all"
                :class="includeTax 
                  ? 'bg-red-600 text-white border-red-600' 
                  : (isDark ? 'bg-white/5 text-neutral-400 border-white/10' : 'bg-neutral-100 text-neutral-600 border-neutral-300')">
          TAX
        </button>
        <div class="text-2xl font-black tracking-tight">
          $<span x-text="priceDollars"></span><span class="text-sm font-bold opacity-80" x-text="priceCents"></span>
        </div>
      </div>
    </div>

    <!-- CALCULATOR CONTENT -->
    <div class="space-y-3">
      <div>
        <label class="text-[10px] font-black uppercase tracking-widest text-neutral-400 block mb-1.5">Coverage Area</label>
        <div class="h-10 rounded-xl border flex items-center justify-between px-3 text-xs font-bold"
             :class="isDark ? 'border-white/10 bg-white/5' : 'border-neutral-300 bg-neutral-100'">
          <span>0 – 1,999 Sq Ft</span>
          <svg class="w-4 h-4 text-neutral-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
          </svg>
        </div>
      </div>

      <div>
        <label class="text-[10px] font-black uppercase tracking-widest text-neutral-400 block mb-1.5">Select Photo Count</label>
        <div class="grid grid-cols-4 gap-1.5">
          <button class="h-12 rounded-xl bg-red-600 text-white flex flex-col items-center justify-center text-xs font-bold shadow-md shadow-red-600/30">
            <span>25</span>
            <span class="text-[10px] opacity-90">$139</span>
          </button>
          <button class="h-12 rounded-xl border flex flex-col items-center justify-center text-xs font-bold" :class="isDark ? 'border-white/10 hover:border-white/20' : 'border-neutral-300 hover:border-neutral-400'">
            <span>36</span>
            <span class="text-[10px] opacity-60">$169</span>
          </button>
          <button class="h-12 rounded-xl border flex flex-col items-center justify-center text-xs font-bold" :class="isDark ? 'border-white/10 hover:border-white/20' : 'border-neutral-300 hover:border-neutral-400'">
            <span>40</span>
            <span class="text-[10px] opacity-60">$189</span>
          </button>
          <button class="h-12 rounded-xl border flex flex-col items-center justify-center text-xs font-bold" :class="isDark ? 'border-white/10 hover:border-white/20' : 'border-neutral-300 hover:border-neutral-400'">
            <span>50</span>
            <span class="text-[10px] opacity-60">$219</span>
          </button>
        </div>
      </div>
    </div>

    <!-- FOOTER CONTROLS -->
    <div class="flex items-center justify-between pt-4 mt-4 border-t" :class="isDark ? 'border-white/10' : 'border-neutral-200'">
      <span class="text-[10px] font-bold opacity-50">Restored Baseline Hero</span>
      <button @click="isDark = !isDark" 
              class="w-7 h-7 flex items-center justify-center rounded-lg text-xs"
              :class="isDark ? 'text-neutral-400 hover:text-white' : 'text-neutral-500 hover:text-black'">
        <span x-text="isDark ? '☀️' : '🌙'"></span>
      </button>
    </div>

  </main>
</body>
</html>
