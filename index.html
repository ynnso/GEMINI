<!DOCTYPE html>
<html lang="en" class="h-full antialiased" x-data="{ isDark: true, layoutMode: 'hairline' }" :class="isDark ? 'bg-[#050505] text-white' : 'bg-neutral-100 text-neutral-900'">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout Divider Options</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    [x-cloak] { display: none !important; }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    select.text-center-select { text-align-last: center; text-align: center; }
  </style>
</head>
<body class="min-h-full p-4 flex flex-col items-center justify-center transition-colors duration-300"
      x-data="{ 
        state: 'idle',
        includeTax: false,
        taxRate: 0.0825,
        count: 25,
        selectedBase: 25,
        selectedSqFt: '10000+',
        extraCost: 5,

        sqFtOptions: [
          { label: '0 – 1,999 Sq Ft', value: '0-1999' },
          { label: '2,000 – 2,999 Sq Ft', value: '2000-2999' },
          { label: '3,000 – 3,999 Sq Ft', value: '3000-3999' },
          { label: '4,000 – 4,999 Sq Ft', value: '4000-4999' },
          { label: '5,000 – 6,999 Sq Ft', value: '5000-6999' },
          { label: '7,000 – 9,999 Sq Ft', value: '7000-9999' },
          { label: '10,000+ Sq Ft', value: '10000+' }
        ],

        priceMatrix: {
          '0-1999':    { 25: 139, 36: 179, 40: 189, 50: 224 },
          '2000-2999': { 25: 166, 36: 206, 40: 216, 50: 251 },
          '3000-3999': { 25: 189, 36: 229, 40: 239, 50: 274 },
          '4000-4999': { 25: 214, 36: 254, 40: 264, 50: 299 },
          '5000-6999': { 25: 279, 36: 319, 40: 329, 50: 374 },
          '7000-9999': { 25: 339, 36: 379, 40: 389, 50: 434 },
          '10000+':    { 25: 399, 36: 439, 40: 449, 50: 499 }
        },

        get holdsSelection() { return this.selectedSqFt !== ''; },

        getTierPrice(imgs) {
          if (!this.holdsSelection) return '--';
          return this.priceMatrix[this.selectedSqFt][imgs];
        },

        selectTier(c) { 
          if (!this.holdsSelection) return;
          this.selectedBase = c;
          this.count = c; 
        },

        get effectiveTier() {
          return { imgs: this.selectedBase, price: this.holdsSelection ? this.getTierPrice(this.selectedBase) : 0 };
        },

        get extras() { return Math.max(0, this.count - this.effectiveTier.imgs); },
        get extraTotal() { return this.extras * this.extraCost; },
        get rawTotal() { return this.effectiveTier.price + this.extraTotal; },
        get finalTotal() { 
          if (!this.holdsSelection) return null;
          const amount = this.includeTax ? this.rawTotal * (1 + this.taxRate) : this.rawTotal;
          return amount.toFixed(2);
        },

        get priceDollars() { return this.finalTotal ? this.finalTotal.split('.')[0] : '--'; },
        get priceCents() { return this.finalTotal ? '.' + this.finalTotal.split('.')[1] : ''; }
      }">

  <!-- LAYOUT SWITCHER HEADER -->
  <div class="mb-6 flex flex-wrap items-center justify-center gap-2 p-1.5 rounded-xl border text-xs font-bold transition-colors max-w-sm w-full"
       :class="isDark ? 'bg-neutral-900 border-white/10 text-neutral-300' : 'bg-white border-neutral-300 text-neutral-700 shadow-sm'">
    <span class="text-[10px] uppercase tracking-wider text-neutral-500 font-black px-1">Layout:</span>
    <button @click="layoutMode = 'original'" class="px-2.5 py-1 rounded-lg transition-all" :class="layoutMode === 'original' ? 'bg-red-600 text-white' : 'hover:opacity-80'">Card Containers</button>
    <button @click="layoutMode = 'hairline'" class="px-2.5 py-1 rounded-lg transition-all" :class="layoutMode === 'hairline' ? 'bg-red-600 text-white' : 'hover:opacity-80'">Hairlines</button>
    <button @click="layoutMode = 'surface'" class="px-2.5 py-1 rounded-lg transition-all" :class="layoutMode === 'surface' ? 'bg-red-600 text-white' : 'hover:opacity-80'">Color Tones</button>
  </div>

  <!-- MAIN CONTAINER -->
  <main class="w-full max-w-sm py-4 transition-colors duration-300"
        :class="[
          layoutMode === 'original' ? 'px-2 border-y border-white/10' : '',
          layoutMode === 'hairline' ? 'divide-y divide-white/10 border-y border-white/10' : '',
          layoutMode === 'surface' ? 'space-y-3' : ''
        ]">

    <!-- HERO HEADER -->
    <div class="pb-4 flex items-end justify-between gap-2" :class="layoutMode === 'original' ? 'mb-4 border-b border-white/10' : ''">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-xl flex items-center justify-center shrink-0 border"
             :class="isDark ? 'bg-white/5 border-white/10 text-white' : 'bg-white border-neutral-300 text-neutral-900'">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
        </div>
        <div>
          <span class="text-[10px] font-extrabold uppercase tracking-widest text-neutral-400 block">MLS Photos</span>
          <h1 class="text-2xl font-black tracking-tight leading-none">Full Shoot</h1>
        </div>
      </div>

      <div class="flex items-baseline gap-1.5 tabular-nums">
        <button @click="includeTax = !includeTax" class="px-1.5 py-0.5 rounded text-[8px] font-bold border"
                :class="includeTax ? 'bg-emerald-400/20 text-emerald-400 border-emerald-400/50' : 'bg-white/5 text-neutral-400 border-white/10'">TAX</button>
        <div class="text-3xl font-black tracking-tighter">
          $<span x-text="priceDollars"></span><span class="text-xl font-bold" x-text="priceCents"></span>
        </div>
      </div>
    </div>

    <!-- SQ FT SELECTOR -->
    <div class="py-4">
      <div class="relative">
        <select x-model="selectedSqFt" 
                class="w-full h-11 text-center-select appearance-none px-4 rounded-xl text-xs font-bold border focus:outline-none transition-all"
                :class="[
                  layoutMode === 'original' ? (isDark ? 'bg-neutral-900 border-white/20' : 'bg-white border-neutral-300') : '',
                  layoutMode === 'hairline' ? 'bg-transparent border-none text-center font-extrabold text-sm' : '',
                  layoutMode === 'surface' ? (isDark ? 'bg-white/5 border-transparent' : 'bg-neutral-200/50 border-transparent') : ''
                ]">
          <template x-for="opt in sqFtOptions" :key="opt.value">
            <option :value="opt.value" x-text="opt.label" :class="isDark ? 'bg-neutral-900 text-white' : 'bg-white text-neutral-900'"></option>
          </template>
        </select>
        <div class="absolute inset-y-0 right-3.5 flex items-center pointer-events-none text-neutral-400">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" /></svg>
        </div>
      </div>
    </div>

    <!-- TIER TILES -->
    <div class="py-4">
      <div class="grid grid-cols-4 gap-2 tabular-nums">
        <template x-for="tImg in [25, 36, 40, 50]" :key="tImg">
          <button @click="selectTier(tImg)"
                  :class="[
                    selectedBase === tImg ? (isDark ? 'bg-white text-black font-extrabold' : 'bg-neutral-900 text-white font-extrabold') : (isDark ? 'bg-white/5 text-neutral-400 border border-white/10' : 'bg-neutral-200/50 text-neutral-600 border border-neutral-300'),
                    layoutMode === 'hairline' ? 'rounded-lg py-2' : 'rounded-xl py-2.5'
                  ]"
                  class="flex flex-col items-center justify-center text-center transition-all">
            <span class="text-xs font-bold" x-text="tImg"></span>
            <span class="text-xs font-extrabold" x-text="'$' + getTierPrice(tImg)"></span>
          </button>
        </template>
      </div>
    </div>

    <!-- BREAKDOWN LIST -->
    <div class="py-4">
      <div :class="[
        layoutMode === 'original' ? 'rounded-xl border border-white/10 divide-y divide-white/10 bg-neutral-900' : '',
        layoutMode === 'hairline' ? 'space-y-2' : '',
        layoutMode === 'surface' ? 'rounded-xl bg-white/5 p-3 space-y-2' : ''
      ]">
        <div class="flex items-center justify-between text-xs font-bold px-1">
          <span class="text-neutral-400" x-text="'Base ' + selectedBase + ' Photos'"></span>
          <span x-text="'$' + effectiveTier.price"></span>
        </div>
        <div class="flex items-center justify-between text-xs font-bold px-1 pt-1">
          <span class="text-neutral-400">$5 / Extra</span>
          <span x-text="'$' + extraTotal"></span>
        </div>
      </div>
    </div>

    <!-- STEPPER & CTA -->
    <div class="pt-4 flex items-center justify-between gap-2">
      <span class="text-xs font-bold">Total Photos</span>
      <div class="flex items-center gap-2">
        <div class="flex items-center rounded-xl border border-white/10 bg-white/5 p-1 h-10">
          <button @click="count > 25 && count--" class="w-6 h-6 rounded-lg font-bold text-base flex items-center justify-center">-</button>
          <span class="w-8 text-center text-xs font-black" x-text="count"></span>
          <button @click="count++" class="w-6 h-6 rounded-lg font-bold text-base flex items-center justify-center">+</button>
        </div>
        <button class="h-10 px-4 rounded-xl bg-white text-black font-black text-xs uppercase tracking-wider">
          Cart
        </button>
      </div>
    </div>

    <!-- FOOTER TOGGLE -->
    <div class="pt-4 flex items-center justify-between">
      <span class="text-[10px] font-bold text-neutral-500">Wizard Mode Active</span>
      <button @click="isDark = !isDark" class="text-xs" x-text="isDark ? '☀️ Light' : '🌙 Dark'"></button>
    </div>

  </main>
</body>
</html>
