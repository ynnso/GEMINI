<!DOCTYPE html>
<html lang="en" x-data="{ isDark: true }" :class="isDark ? 'dark' : ''">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>S2S Field App - Real Mobile Canvas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      overscroll-behavior-y: none;
    }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    [x-cloak] { display: none !important; }
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }

    @keyframes subtle-pulse-white {
      0%, 100% { border-color: rgba(255, 255, 255, 0.25); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
      50% { border-color: rgba(255, 255, 255, 0.8); box-shadow: 0 0 12px 0 rgba(255, 255, 255, 0.25); }
    }

    @keyframes subtle-pulse-red-light {
      0%, 100% { border-color: rgba(239, 68, 68, 0.4); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
      50% { border-color: rgba(239, 68, 68, 0.9); box-shadow: 0 0 10px 0 rgba(239, 68, 68, 0.2); }
    }

    .animate-pulse-dark { animation: subtle-pulse-white 2s infinite ease-in-out; }
    .animate-pulse-light { animation: subtle-pulse-red-light 1.8s infinite ease-in-out; }

    /* Custom Scrollbar */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="w-full min-h-screen transition-colors duration-300"
      :class="isDark ? 'bg-black text-white' : 'bg-neutral-100 text-neutral-900'"
      x-data="{
        sheetOpen: false,
        cartCount: 0,
        activeTab: 'photos',
        
        /* FULL SHOOT GOLD STANDARD STATE */
        state: 'idle',
        dropdownOpen: false,
        includeTax: false,
        taxRate: 0.0825,
        count: 25,
        selectedBase: 25,
        selectedSqFt: '0-1999',
        extraCost: 5,

        /* GESTURE / DRAG STATE FOR SMOOTH GLIDE */
        dragY: 0,
        startY: 0,
        isDragging: false,

        sqFtOptions: [
          { label: '0 – 1,999 Sq Ft', value: '0-1999' },
          { label: '2,000 – 2,999 Sq Ft', value: '2000-2999' },
          { label: '3,000 – 3,999 Sq Ft', value: '3000-3999' },
          { label: '4,000 – 4,999 Sq Ft', value: '4000-4999' },
          { label: '5,000 – 6,999 Sq Ft', value: '5000-6999' },
          { label: '7,000 – 9,999 Sq Ft', value: '7000-9999' },
          { label: '10,000+ Sq Ft', value: '10000+' }
        ],

        priceMatrix: {
          '0-1999':    { 25: 139, 36: 179, 40: 189, 50: 224 },
          '2000-2999': { 25: 166, 36: 206, 40: 216, 50: 251 },
          '3000-3999': { 25: 189, 36: 229, 40: 239, 50: 274 },
          '4000-4999': { 25: 214, 36: 254, 40: 264, 50: 299 },
          '5000-6999': { 25: 279, 36: 319, 40: 329, 50: 374 },
          '7000-9999': { 25: 339, 36: 379, 40: 389, 50: 434 },
          '10000+':    { 25: 399, 36: 439, 40: 449, 50: 499 }
        },

        get holdsSelection() { return this.selectedSqFt !== ''; },

        get selectedSqFtLabel() {
          const found = this.sqFtOptions.find(o => o.value === this.selectedSqFt);
          return found ? found.label : 'Select Sq Ft';
        },

        selectSqFt(val) {
          this.selectedSqFt = val;
          this.dropdownOpen = false;
          this.handleSqFtChange();
        },

        handleSqFtChange() {
          this.selectedBase = 25;
          if (this.count < 25) this.count = 25;
          this.evaluateCheapestBase();
        },

        getTierPrice(imgs) {
          if (!this.holdsSelection) return '--';
          return this.priceMatrix[this.selectedSqFt][imgs];
        },

        selectTier(c) { 
          if (!this.holdsSelection) return;
          this.selectedBase = c;
          this.count = c; 
        },

        evaluateCheapestBase() {
          if (!this.holdsSelection) return;
          const tiers = [25, 36, 40, 50];
          let bestTier = tiers[0];
          let minCost = Infinity;

          for (let t of tiers) {
            let cost = (this.count >= t) ? (this.getTierPrice(t) + (this.count - t) * this.extraCost) : this.getTierPrice(t);
            if (cost < minCost) {
              minCost = cost;
              bestTier = t;
            }
          }

          if (this.count === 33) this.selectedBase = 25;
          else if (this.count === 38) this.selectedBase = 36;
          else if (this.count === 47) this.selectedBase = 40;
          else this.selectedBase = bestTier;
        },

        sanitizeInput() {
          let val = parseInt(this.count, 10);
          if (isNaN(val) || val < 25) val = 25;
          if (val > 150) val = 150;
          this.count = val;
          this.evaluateCheapestBase();
        },

        get effectiveTier() {
          return { imgs: this.selectedBase, price: this.holdsSelection ? this.getTierPrice(this.selectedBase) : 0 };
        },

        get targetUpgradeTier() {
          if (!this.holdsSelection) return null;
          if (this.selectedBase === 25 && this.count === 33) return 36;
          if (this.selectedBase === 36 && this.count === 38) return 40;
          if (this.selectedBase === 40 && this.count === 47) return 50;
          return null;
        },

        get extras() { return Math.max(0, this.count - this.effectiveTier.imgs); },
        get extraTotal() { return this.extras * this.extraCost; },
        get rawTotal() { return this.effectiveTier.price + this.extraTotal; },
        get finalTotal() { 
          if (!this.holdsSelection) return null;
          const amount = this.includeTax ? this.rawTotal * (1 + this.taxRate) : this.rawTotal;
          return amount.toFixed(2);
        },

        get priceDollars() { return this.finalTotal ? this.finalTotal.split('.')[0] : '--'; },
        get priceCents() { return this.finalTotal ? '.' + this.finalTotal.split('.')[1] : ''; },

        updateCount(dir) {
          if (!this.holdsSelection) return;
          if (dir === 'up' && this.count < 150) {
            this.count++;
            this.evaluateCheapestBase();
          }
          if (dir === 'down' && this.count > 25) {
            this.count--;
            this.evaluateCheapestBase();
          }
        },

        triggerCart() {
          if (!this.holdsSelection || this.state !== 'idle') return;
          this.state = 'success';
          this.cartCount++;
          if (window.navigator && window.navigator.vibrate) {
            window.navigator.vibrate(40);
          }
          setTimeout(() => { 
            this.state = 'idle'; 
            this.closeSheet();
          }, 800);
        },

        /* TOUCH GLIDE HANDLERS FOR BOTTOM SHEET */
        openSheet() {
          this.dragY = 0;
          this.sheetOpen = true;
        },

        closeSheet() {
          this.sheetOpen = false;
          setTimeout(() => { this.dragY = 0; }, 250);
        },

        touchStart(e) {
          this.startY = e.touches[0].clientY;
          this.isDragging = true;
        },

        touchMove(e) {
          if (!this.isDragging) return;
          let delta = e.touches[0].clientY - this.startY;
          if (delta > 0) {
            this.dragY = delta;
          }
        },

        touchEnd() {
          if (!this.isDragging) return;
          this.isDragging = false;
          if (this.dragY > 120) {
            this.closeSheet();
          } else {
            this.dragY = 0;
          }
        }
      }">

  <!-- REAL-WORLD FULL APP CONTAINER -->
  <div class="w-full min-h-screen max-w-md mx-auto flex flex-col justify-between relative pb-28">

    <!-- REAL TOP APP HEADER -->
    <header class="px-5 pt-6 pb-4 flex justify-between items-center backdrop-blur-xl sticky top-0 z-30 border-b transition-colors duration-300"
            :class="isDark ? 'bg-black/85 border-white/10' : 'bg-white/85 border-neutral-200 shadow-sm'">
      
      <!-- BRAND LOGO -->
      <div class="font-black text-[20px] tracking-tight" :class="isDark ? 'text-white' : 'text-neutral-900'">
        S<span class="text-[#E50914]">2</span>S FIELD
      </div>

      <!-- HEADER CONTROLS -->
      <div class="flex items-center gap-3">
        <!-- OUTLINE SUN/MOON THEME SWITCHER -->
        <button @click="isDark = !isDark" 
                class="w-10 h-10 rounded-full flex items-center justify-center border transition-all duration-200 active:scale-90"
                :class="isDark ? 'bg-[#121212] border-[#262626] text-white hover:border-white/40' : 'bg-white border-neutral-300 text-neutral-800 hover:border-neutral-500 shadow-sm'"
                :title="isDark ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
          <template x-if="isDark">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m0 13.5V21m8.966-8.966h-2.25m-13.5 0H3m15.364-6.364l-1.591 1.591M6.758 17.242l-1.591 1.591m12.728 0l-1.591-1.591M6.758 6.758L5.167 5.167M12 8.25a3.75 3.75 0 100 7.5 3.75 3.75 0 000-7.5z" />
            </svg>
          </template>
          <template x-if="!isDark">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
            </svg>
          </template>
        </button>

        <!-- CART ICON -->
        <div class="w-10 h-10 rounded-full flex items-center justify-center border relative transition-colors duration-300"
             :class="isDark ? 'bg-[#121212] border-[#262626] text-white' : 'bg-white border-neutral-300 text-neutral-800 shadow-sm'">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
          </svg>
          <template x-if="cartCount > 0">
            <div class="absolute -top-1 -right-1 bg-[#E50914] text-white text-[11px] font-black w-4 h-4 rounded-full flex items-center justify-center"
                 x-text="cartCount"></div>
          </template>
        </div>
      </div>

    </header>

    <!-- MAIN DASHBOARD CONTENT -->
    <main class="p-4 flex-1 flex flex-col gap-4">

      <!-- HERO PRIMARY BLOCK: PHOTOS -->
      <section class="rounded-3xl p-4 flex flex-col gap-3.5 border transition-colors duration-300"
               :class="isDark ? 'bg-[#121212] border-[#262626] border-l-4 border-l-white' : 'bg-white border-neutral-300 border-l-4 border-l-neutral-900 shadow-md'">
        
        <div class="flex items-center gap-2 font-extrabold text-[19px]" :class="isDark ? 'text-white' : 'text-neutral-900'">
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574v9.176A2.25 2.25 0 004.5 21h15a2.25 2.25 0 002.25-2.25V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z" />
          </svg>
          <span>Photos</span>
        </div>

        <!-- CATEGORY SUB-TOGGLES -->
        <div class="flex border rounded-2xl p-1 gap-1 transition-colors duration-300"
             :class="isDark ? 'bg-black border-[#262626]' : 'bg-neutral-100 border-neutral-200'">
          <button class="flex-1 py-2 text-[12px] font-black text-center bg-[#E50914] text-white rounded-xl shadow-[0_0_12px_rgba(229,9,20,0.35)]">MLS</button>
          <button class="flex-1 py-2 text-[12px] font-bold text-center text-[#8E8E93]">Airbnb</button>
          <button class="flex-1 py-2 text-[12px] font-bold text-center text-[#8E8E93]">PORT</button>
        </div>

        <!-- SERVICES LIST -->
        <div class="flex flex-col gap-2.5 pt-1">
          
          <!-- FULL SHOOT BUTTON (TRIGGERS GLIDE SLIDER) -->
          <button @click="openSheet()"
                  class="p-4 rounded-2xl flex items-center justify-between text-left border transition-all active:scale-[0.98]"
                  :class="isDark ? 'bg-black border-[#262626] text-white active:border-white' : 'bg-neutral-50 border-neutral-200 text-neutral-900 active:border-neutral-900'">
            <span class="text-[15px] font-black">Full Shoot</span>
            <svg class="w-5 h-5 text-[#8E8E93]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
            </svg>
          </button>

          <div class="p-4 rounded-2xl flex items-center justify-between text-left border opacity-50 transition-colors"
               :class="isDark ? 'bg-black border-[#262626] text-white' : 'bg-neutral-50 border-neutral-200 text-neutral-900'">
            <span class="text-[15px] font-bold">Reshoot</span>
            <svg class="w-5 h-5 text-[#8E8E93]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
            </svg>
          </div>

          <div class="p-4 rounded-2xl flex items-center justify-between text-left border opacity-50 transition-colors"
               :class="isDark ? 'bg-black border-[#262626] text-white' : 'bg-neutral-50 border-neutral-200 text-neutral-900'">
            <span class="text-[15px] font-bold">Ranch Shoot</span>
            <svg class="w-5 h-5 text-[#8E8E93]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
            </svg>
          </div>

          <div class="p-4 rounded-2xl flex items-center justify-between text-left border opacity-50 transition-colors"
               :class="isDark ? 'bg-black border-[#262626] text-white' : 'bg-neutral-50 border-neutral-200 text-neutral-900'">
            <span class="text-[15px] font-bold">Exterior Only</span>
            <svg class="w-5 h-5 text-[#8E8E93]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
            </svg>
          </div>

          <div class="p-4 rounded-2xl flex items-center justify-between text-left border opacity-50 transition-colors"
               :class="isDark ? 'bg-black border-[#262626] text-white' : 'bg-neutral-50 border-neutral-200 text-neutral-900'">
            <span class="text-[15px] font-bold">Mini Shoot</span>
            <svg class="w-5 h-5 text-[#8E8E93]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
            </svg>
          </div>

        </div>
      </section>

      <!-- SECONDARY BENTO TILES -->
      <div class="grid grid-cols-2 gap-3">
        <div class="rounded-3xl p-4 h-[104px] flex flex-col justify-between border transition-colors duration-300"
             :class="isDark ? 'bg-[#121212] border-[#262626]' : 'bg-white border-neutral-300 shadow-sm'">
          <div class="flex justify-between items-center">
            <svg class="w-5 h-5" :class="isDark ? 'text-white' : 'text-neutral-900'" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>
            <svg class="w-4 h-4 text-[#8E8E93]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" /></svg>
          </div>
          <div>
            <div class="text-[15px] font-extrabold" :class="isDark ? 'text-white' : 'text-neutral-900'">Video</div>
            <div class="text-[11px] text-[#8E8E93]">MLS • PORT</div>
          </div>
        </div>

        <div class="rounded-3xl p-4 h-[104px] flex flex-col justify-between border transition-colors duration-300"
             :class="isDark ? 'bg-[#121212] border-[#262626]' : 'bg-white border-neutral-300 shadow-sm'">
          <div class="flex justify-between items-center">
            <svg class="w-5 h-5" :class="isDark ? 'text-white' : 'text-neutral-900'" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg>
            <svg class="w-4 h-4 text-[#8E8E93]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" /></svg>
          </div>
          <div>
            <div class="text-[15px] font-extrabold" :class="isDark ? 'text-white' : 'text-neutral-900'">Aerial</div>
            <div class="text-[11px] text-[#8E8E93]">Images • Combos</div>
          </div>
        </div>
      </div>

    </main>

    <!-- NEW ATTACHED IMAGE SPEC CAPSULE FLOATING PILL NAV BAR -->
    <div class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-sm h-[58px] rounded-full px-5 flex items-center justify-between z-30 border transition-all duration-300 shadow-2xl backdrop-blur-2xl"
         :class="isDark ? 'bg-black/90 border-white/20 shadow-black/80' : 'bg-white/90 border-neutral-300 shadow-neutral-400/50'">
      
      <!-- 1. PHOTOS ICON -->
      <button @click="activeTab = 'photos'" class="p-2 transition-transform active:scale-90" :class="activeTab === 'photos' ? 'text-[#E50914]' : (isDark ? 'text-white' : 'text-neutral-800')">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574v9.176A2.25 2.25 0 004.5 21h15a2.25 2.25 0 002.25-2.25V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z" />
          <circle cx="12" cy="13.5" r="3" stroke-width="2" />
        </svg>
      </button>

      <!-- 2. VIDEO ICON -->
      <button @click="activeTab = 'video'" class="p-2 transition-transform active:scale-90" :class="activeTab === 'video' ? 'text-[#E50914]' : (isDark ? 'text-white' : 'text-neutral-800')">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <rect x="3" y="6" width="12" height="12" rx="2" stroke-width="2" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 10l5-3v10l-5-3" />
        </svg>
      </button>

      <!-- 3. AERIAL / DRONE ICON -->
      <button @click="activeTab = 'aerial'" class="p-2 transition-transform active:scale-90" :class="activeTab === 'aerial' ? 'text-[#E50914]' : (isDark ? 'text-white' : 'text-neutral-800')">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 6h14M8 6V4m8 2V4M6 18h12M9 18v2m6-2v2M9 10a3 3 0 106 0 3 3 0 00-6 0z" />
        </svg>
      </button>

      <!-- 4. 360 TOUR ICON -->
      <button @click="activeTab = '360'" class="p-2 transition-transform active:scale-90" :class="activeTab === '360' ? 'text-[#E50914]' : (isDark ? 'text-white' : 'text-neutral-800')">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="8" r="2.5" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 10.5v3.5m0 0l-2 4m2-4l2 4M4.5 16.5c2.5 2 12.5 2 15 0" />
        </svg>
      </button>

      <!-- 5. FLOOR PLAN ICON -->
      <button @click="activeTab = 'floor'" class="p-2 transition-transform active:scale-90" :class="activeTab === 'floor' ? 'text-[#E50914]' : (isDark ? 'text-white' : 'text-neutral-800')">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 4h16v16H4V4zm6 0v16M4 12h6m6 0h4m-4 0v8" />
        </svg>
      </button>

      <!-- 6. ADD-ONS (+) ICON -->
      <button @click="activeTab = 'addons'" class="p-2 transition-transform active:scale-90" :class="activeTab === 'addons' ? 'text-[#E50914]' : (isDark ? 'text-white' : 'text-neutral-800')">
        <svg class="w-6.5 h-6.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <rect x="4" y="4" width="16" height="16" rx="5" stroke-width="2" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v8m-4-4h8" />
        </svg>
      </button>

    </div>

    <!-- BACKDROP WITH SMOOTH FADE -->
    <div x-show="sheetOpen"
         x-cloak
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         @click="closeSheet()"
         class="fixed inset-0 bg-black/75 backdrop-blur-md z-40"></div>

    <!-- FULL SHOOT HIGH-PERFORMANCE SMOOTH GLIDE BOTTOM SHEET -->
    <div x-show="sheetOpen"
         x-cloak
         x-transition:enter="transition ease-[cubic-bezier(0.16,1,0.3,1)] duration-500 transform"
         x-transition:enter-start="translate-y-full"
         x-transition:enter-end="translate-y-0"
         x-transition:leave="transition ease-[cubic-bezier(0.7,0,0.84,0)] duration-300 transform"
         x-transition:leave-start="translate-y-0"
         x-transition:leave-end="translate-y-full"
         :style="`transform: translateY(${dragY}px)`"
         @touchstart="touchStart($event)"
         @touchmove="touchMove($event)"
         @touchend="touchEnd()"
         class="fixed bottom-0 left-0 right-0 max-w-md mx-auto border-t rounded-t-[36px] p-5 pt-3 z-50 shadow-2xl flex flex-col gap-3.5 max-h-[92vh] overflow-y-auto no-scrollbar transition-colors duration-300"
         :class="isDark ? 'bg-[#050505] text-white border-white/20' : 'bg-white text-neutral-900 border-neutral-300'">

      <!-- TOUCH DRAG HANDLE -->
      <div class="py-2 w-full flex justify-center cursor-grab active:cursor-grabbing">
        <div class="w-12 h-1.5 rounded-full transition-colors duration-300"
             :class="isDark ? 'bg-white/30' : 'bg-neutral-300'"></div>
      </div>

      <!-- HERO HEADER -->
      <div class="flex items-end justify-between gap-2 pb-0.5">
        
        <!-- LEFT TITLE & ICON BLOCK -->
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 rounded-2xl flex items-center justify-center shrink-0 border transition-colors duration-300"
               :class="isDark ? 'bg-white/5 border-white/10 text-white' : 'bg-neutral-100 border-neutral-300 text-neutral-900'">
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
            </svg>
          </div>
          <div class="flex flex-col justify-center">
            <span class="text-[13px] font-extrabold leading-none uppercase tracking-widest mb-1"
                  :class="isDark ? 'text-neutral-400' : 'text-neutral-500'">MLS Photos</span>
            <h1 class="text-[28px] font-black leading-none tracking-tight" :class="isDark ? 'text-white' : 'text-neutral-900'">Full Shoot</h1>
          </div>
        </div>

        <!-- RIGHT PRICE & MICROBADGE -->
        <div class="flex items-baseline gap-1.5 select-none tabular-nums">
          
          <button @click="includeTax = !includeTax"
                  :disabled="!holdsSelection"
                  title="Toggle Sales Tax"
                  class="p-0 cursor-pointer outline-none focus:outline-none group active:scale-90 transition-transform self-baseline mb-[2px]">
            <span class="inline-flex items-center justify-center px-1.5 py-0.5 rounded-[4px] text-[10px] font-black tracking-wider uppercase transition-all duration-300 backdrop-blur-md border leading-tight"
                  :class="[
                    includeTax 
                      ? 'bg-emerald-400/20 text-emerald-400 border-emerald-400/50 shadow-[0_0_6px_rgba(52,211,153,0.3)]' 
                      : (isDark ? 'bg-white/5 text-neutral-400 border-white/10 hover:border-white/20 hover:text-white' : 'bg-black/5 text-neutral-500 border-black/10 hover:border-black/20 hover:text-black')
                  ]">
              TAX
            </span>
          </button>

          <!-- HERO PRICE DISPLAY -->
          <div class="text-[30px] font-black leading-none tracking-tighter flex items-baseline" :class="isDark ? 'text-white' : 'text-neutral-900'">
            <template x-if="holdsSelection">
              <span class="text-[15px] font-black leading-none self-start pt-[2px] mr-[1px] opacity-90">$</span>
            </template>
            <span x-text="priceDollars" class="leading-none"></span>
            <span class="text-[15px] font-black leading-none opacity-90 self-baseline" x-text="priceCents"></span>
          </div>

        </div>

      </div>

      <!-- HIG DROPDOWN SELECTOR -->
      <div class="relative" @click.outside="dropdownOpen = false">
        
        <button type="button"
                @click="dropdownOpen = !dropdownOpen"
                class="w-full h-12 px-4 rounded-2xl text-[17px] font-bold border flex items-center justify-between transition-all duration-200 focus:outline-none shadow-sm"
                :class="[
                  !holdsSelection 
                    ? (isDark ? 'animate-pulse-dark bg-neutral-900 text-white border-white/30' : 'animate-pulse-light bg-white text-red-600 border-red-500/80') 
                    : (isDark ? 'bg-neutral-900/90 text-white border-white/20 hover:border-white/40' : 'bg-white text-neutral-900 border-neutral-300 hover:border-neutral-400')
                ]">
          <span class="w-full text-center" x-text="selectedSqFtLabel"></span>
          
          <svg class="w-4 h-4 shrink-0 transition-transform duration-200"
               :class="[
                 dropdownOpen ? 'rotate-180' : 'rotate-0',
                 !holdsSelection && !isDark ? 'text-red-500' : (isDark ? 'text-white' : 'text-neutral-600')
               ]" 
               fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
          </svg>
        </button>

        <!-- FLOATING OPTIONS MENU -->
        <div x-show="dropdownOpen"
             x-cloak
             x-transition:enter="transition ease-out duration-150 transform"
             x-transition:enter-start="opacity-0 scale-95 -translate-y-1"
             x-transition:enter-end="opacity-100 scale-100 translate-y-0"
             x-transition:leave="transition ease-in duration-100 transform"
             x-transition:leave-start="opacity-100 scale-100 translate-y-0"
             x-transition:leave-end="opacity-0 scale-95 -translate-y-1"
             class="absolute z-[100] left-0 right-0 mt-2 p-1.5 rounded-2xl border shadow-2xl backdrop-blur-2xl overflow-hidden transition-colors duration-300"
             :class="isDark ? 'bg-neutral-900/98 border-white/20 text-white shadow-black/90' : 'bg-white/98 border-neutral-300 text-neutral-900 shadow-neutral-400/50'">
          
          <div class="px-3 pt-2 pb-1 text-[11px] font-black uppercase tracking-widest text-center"
               :class="isDark ? 'text-neutral-500' : 'text-neutral-400'">
            Select Sq Ft
          </div>

          <div class="space-y-0.5 max-h-56 overflow-y-auto">
            <template x-for="opt in sqFtOptions" :key="opt.value">
              <button type="button"
                      @click="selectSqFt(opt.value)"
                      class="w-full px-3 py-2.5 rounded-xl text-[15px] font-bold flex items-center justify-between transition-colors duration-150"
                      :class="[
                        selectedSqFt === opt.value 
                          ? (isDark ? 'bg-white/10 text-white font-extrabold' : 'bg-neutral-100 text-black font-extrabold') 
                          : (isDark ? 'hover:bg-white/5 text-neutral-300 hover:text-white' : 'hover:bg-neutral-50 text-neutral-700 hover:text-black')
                      ]">
                <span class="w-full text-center" x-text="opt.label"></span>
                <template x-if="selectedSqFt === opt.value">
                  <svg class="w-4 h-4 shrink-0 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
                  </svg>
                </template>
              </button>
            </template>
          </div>

        </div>

      </div>

      <!-- MAIN CALCULATOR TIERS -->
      <div :class="!holdsSelection && 'opacity-30 pointer-events-none select-none'">
        
        <!-- PHOTO TIER TILES -->
        <div class="grid grid-cols-4 gap-1.5 mb-3.5 tabular-nums">
          <template x-for="tImg in [25, 36, 40, 50]" :key="tImg">
            <button @click="selectTier(tImg)"
                    :disabled="!holdsSelection"
                    :class="[
                      targetUpgradeTier === tImg ? 'bg-emerald-400 text-black font-black ring-2 ring-black' : '',
                      !targetUpgradeTier && effectiveTier.imgs === tImg && holdsSelection ? (isDark ? 'bg-white text-black font-extrabold shadow-lg border-white' : 'bg-neutral-900 text-white font-extrabold shadow-md border-neutral-900') : '',
                      targetUpgradeTier && targetUpgradeTier !== tImg ? 'opacity-20 border-transparent bg-transparent' : '',
                      !targetUpgradeTier && effectiveTier.imgs !== tImg ? (isDark ? 'bg-neutral-900/60 text-neutral-400 border-white/10 hover:border-white/20' : 'bg-neutral-200/50 text-neutral-600 border-neutral-300 hover:border-neutral-400') : ''
                    ]"
                    class="py-3 px-1 rounded-2xl border flex flex-col items-center justify-center text-center transition-all duration-200 active:scale-95">
              <span class="text-[16px] font-bold leading-tight" x-text="tImg"></span>
              <div class="flex items-start justify-center mt-0.5 leading-none">
                <template x-if="holdsSelection"><span class="text-[10px] font-bold leading-none pt-[1px] mr-[0.5px]">$</span></template>
                <span class="text-[14px] font-extrabold leading-none" x-text="getTierPrice(tImg)"></span>
              </div>
            </button>
          </template>
        </div>

        <!-- BREAKDOWN LINE ITEMS -->
        <div class="rounded-2xl border divide-y mb-3.5 tabular-nums overflow-hidden transition-colors duration-300"
             :class="isDark ? 'bg-neutral-900 border-white/10 divide-white/10' : 'bg-white border-neutral-300 divide-neutral-200 shadow-sm'">
          
          <div class="px-4 h-[48px] flex items-center justify-between">
            <span class="text-[15px] font-semibold" :class="isDark ? 'text-neutral-300' : 'text-neutral-700'" x-text="'Base ' + (holdsSelection ? effectiveTier.imgs : 25) + ' Photos'"></span>
            <div class="flex items-start text-[15px] font-bold" :class="isDark ? 'text-neutral-300' : 'text-neutral-800'">
              <template x-if="holdsSelection"><span class="text-[10px] font-bold leading-none pt-[1px] mr-[0.5px]">$</span></template>
              <span class="leading-none" x-text="holdsSelection ? effectiveTier.price : '--'"></span>
            </div>
          </div>

          <div @click="targetUpgradeTier && selectTier(targetUpgradeTier)"
               class="px-4 h-[48px] flex items-center justify-center transition-all duration-300"
               :class="[
                 targetUpgradeTier 
                   ? 'bg-emerald-400 text-black rounded-b-2xl cursor-pointer hover:opacity-95 active:scale-[0.99]'
                   : (extras > 0 && holdsSelection ? (isDark ? 'bg-white text-black font-bold' : 'bg-black text-white font-bold') : (isDark ? 'bg-transparent text-neutral-400 font-semibold' : 'bg-transparent text-neutral-600 font-semibold'))
               ]">
            
            <template x-if="!targetUpgradeTier">
              <div class="flex items-center justify-between w-full">
                <div class="text-[15px] transition-colors flex items-start">
                  <span class="text-[10px] font-bold leading-none pt-[1px] mr-[0.5px]">$</span>
                  <span class="leading-none" x-text="extras > 0 && holdsSelection ? '5 / Extra × ' + extras : '5 / Extra'"></span>
                </div>
                <div class="flex items-center text-[15px] font-bold transition-colors">
                  <template x-if="extras > 0 && holdsSelection">
                    <div class="flex items-start">
                      <span class="leading-none mr-[0.5px]">+</span>
                      <span class="text-[10px] font-bold leading-none pt-[1px] mr-[0.5px]">$</span>
                      <span class="leading-none" x-text="extraTotal"></span>
                    </div>
                  </template>
                  <template x-if="extras === 0 || !holdsSelection">
                    <div class="flex items-start">
                      <span class="text-[10px] font-bold leading-none pt-[1px] mr-[0.5px]">$</span>
                      <span class="leading-none">0</span>
                    </div>
                  </template>
                </div>
              </div>
            </template>

            <template x-if="targetUpgradeTier">
              <div class="flex items-center justify-center gap-2 w-full select-none text-center">
                <svg class="w-4 h-4 shrink-0 text-black" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l7.5-7.5 7.5 7.5m-15 6l7.5-7.5 7.5 7.5" />
                </svg>
                <span class="text-[15px] font-black tracking-tight leading-none text-black">
                  <span x-text="targetUpgradeTier"></span> Upgrade – Same Price!
                </span>
              </div>
            </template>
          </div>

        </div>

        <!-- STEPPER & ADD TO CART CTA -->
        <div class="flex items-center justify-between gap-2 mb-2">
          <span class="text-[16px] font-bold" :class="isDark ? 'text-white' : 'text-neutral-900'">Total Photos</span>
          
          <div class="flex items-center gap-2 shrink-0">
            <div class="flex items-center rounded-2xl border p-1 transition-colors h-11"
                 :class="isDark ? 'bg-neutral-900 border-white/10' : 'bg-white border-neutral-300 shadow-sm'">
              <button @click="updateCount('down')" :disabled="!holdsSelection || count <= 25"
                      :class="!holdsSelection || count <= 25 ? 'opacity-20 cursor-not-allowed' : (isDark ? 'hover:bg-white/10 text-white' : 'hover:bg-neutral-100 text-black')"
                      class="w-8 h-8 rounded-xl font-bold text-lg flex items-center justify-center transition-all active:scale-90">-</button>
              
              <input type="number" 
                     x-model.number="count"
                     @change="sanitizeInput()"
                     @blur="sanitizeInput()"
                     :disabled="!holdsSelection"
                     min="25"
                     max="150"
                     class="w-10 h-8 bg-transparent text-center text-[16px] font-black focus:outline-none tabular-nums"
                     :class="isDark ? 'text-white' : 'text-neutral-900'" />
              
              <button @click="updateCount('up')" :disabled="!holdsSelection || count >= 150"
                      :class="!holdsSelection || count >= 150 ? 'opacity-20 cursor-not-allowed' : (isDark ? 'hover:bg-white/10 text-white' : 'hover:bg-neutral-100 text-black')"
                      class="w-8 h-8 rounded-xl font-bold text-lg flex items-center justify-center transition-all active:scale-90">+</button>
            </div>

            <button @click="triggerCart()" 
                    :disabled="!holdsSelection || state !== 'idle'"
                    :class="[
                      !holdsSelection 
                        ? (isDark ? 'opacity-30 cursor-not-allowed bg-neutral-800 text-neutral-500' : 'opacity-40 cursor-not-allowed bg-neutral-300 text-neutral-500') 
                        : (state === 'success' ? 'bg-emerald-400 text-black font-black' : (isDark ? 'bg-white text-black hover:bg-neutral-200' : 'bg-black text-white hover:bg-neutral-800'))
                    ]"
                    class="h-11 px-4 rounded-2xl flex items-center justify-center transition-all duration-200 active:scale-95 shadow-md">
              
              <template x-if="state !== 'success'">
                <svg class="w-6 h-6" :class="!holdsSelection ? 'text-neutral-400' : (isDark ? 'text-black' : 'text-white')" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2.5 3.5h2l2.3 8.8a2 2 0 001.9 1.5h8.6a2 2 0 001.9-1.5l1.8-6.8" stroke-width="2.3" />
                  <circle cx="9" cy="19.5" r="1.5" fill="currentColor" />
                  <circle cx="16.5" cy="19.5" r="1.5" fill="currentColor" />
                  <path d="M11 7.5h5M13.5 5v5" stroke-width="2.6" stroke="currentColor" />
                </svg>
              </template>

              <template x-if="state === 'success'">
                <svg class="w-6 h-6 text-black" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2.5 3.5h2l2.3 8.8a2 2 0 001.9 1.5h8.6a2 2 0 001.9-1.5l1.8-6.8" stroke-width="2.3" />
                  <circle cx="9" cy="19.5" r="1.5" fill="currentColor" />
                  <circle cx="16.5" cy="19.5" r="1.5" fill="currentColor" />
                  <path d="M11 7.5l2 2 4.2-4.5" stroke-width="2.8" stroke="currentColor" />
                </svg>
              </template>
            </button>
          </div>
        </div>

      </div>

      <!-- FOOTER WIZARD -->
      <div class="flex items-center justify-between pt-1 pb-2">
        <div class="relative inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl text-[13px] font-bold border transition-all tracking-tight cursor-pointer"
             :class="isDark ? 'text-neutral-400 bg-white/5 border-white/10 hover:border-white/30' : 'text-neutral-700 bg-neutral-200/60 border-neutral-300 hover:border-neutral-400 shadow-sm'">
          <svg class="w-3.5 h-3.5" :class="isDark ? 'text-white' : 'text-neutral-900'" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z" />
          </svg>
          <span>Wizard</span>
        </div>
      </div>

    </div>

  </div>

</body>
</html>
