<!DOCTYPE html>
<html lang="en" class="h-full antialiased" x-data="{ isDark: true, style: 'cyber' }" :class="isDark ? 'bg-[#050505] text-white' : 'bg-neutral-100 text-neutral-900'">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10 Radically Distinct Hero Redesigns</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700;900&family=Playfair+Display:ital,wght@0,700;1,400&family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-space { font-family: 'Space Grotesk', sans-serif; }
    .font-serif-luxury { font-family: 'Playfair Display', serif; }
    .font-mono-tech { font-family: 'JetBrains Mono', monospace; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    [x-cloak] { display: none !important; }

    @keyframes rotate-glow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .animate-spin-slow { animation: rotate-glow 12s linear infinite; }

    @keyframes marquee {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }
    .animate-marquee { animation: marquee 10s linear infinite; }
  </style>
</head>
<body class="min-h-full p-4 flex flex-col items-center justify-center transition-colors duration-300"
      x-data="{ 
        includeTax: false,
        taxRate: 0.0825,
        rawPrice: 139,
        get finalTotal() {
          const val = this.includeTax ? this.rawPrice * (1 + this.taxRate) : this.rawPrice;
          return val.toFixed(2);
        },
        get priceDollars() { return this.finalTotal.split('.')[0]; },
        get priceCents() { return '.' + this.finalTotal.split('.')[1]; }
      }">

  <!-- 10-VARIANT SWITCHER TOOLBAR -->
  <header class="mb-6 flex flex-wrap items-center justify-center gap-1.5 p-1.5 rounded-2xl border text-[11px] font-bold transition-colors max-w-lg w-full"
          :class="isDark ? 'bg-neutral-900/90 border-white/10 text-neutral-400' : 'bg-white border-neutral-300 text-neutral-600 shadow-sm'">
    <span class="px-2 text-[10px] uppercase tracking-widest font-black opacity-50 w-full text-center sm:w-auto">Redesign Variant:</span>
    
    <button @click="style = 'cyber'" :class="style === 'cyber' ? 'bg-red-600 text-white font-extrabold' : 'opacity-70 hover:opacity-100'" class="px-2 py-1 rounded-lg">1. Cyber HUD</button>
    <button @click="style = 'luxury'" :class="style === 'luxury' ? 'bg-amber-400 text-black font-extrabold' : 'opacity-70 hover:opacity-100'" class="px-2 py-1 rounded-lg">2. Luxury Serif</button>
    <button @click="style = 'ticket'" :class="style === 'ticket' ? 'bg-white text-black font-extrabold' : 'opacity-70 hover:opacity-100'" class="px-2 py-1 rounded-lg">3. Pass Stub</button>
    <button @click="style = 'stat'" :class="style === 'stat' ? 'bg-emerald-500 text-black font-extrabold' : 'opacity-70 hover:opacity-100'" class="px-2 py-1 rounded-lg">4. Massive Stat</button>
    <button @click="style = 'pill'" :class="style === 'pill' ? 'bg-red-500 text-white font-extrabold' : 'opacity-70 hover:opacity-100'" class="px-2 py-1 rounded-lg">5. Floating Capsule</button>
    <button @click="style = 'neobrutal'" :class="style === 'neobrutal' ? 'bg-red-500 text-black font-extrabold' : 'opacity-70 hover:opacity-100'" class="px-2 py-1 rounded-lg">6. Neo-Brutal</button>
    <button @click="style = 'dashboard'" :class="style === 'dashboard' ? 'bg-neutral-800 text-white font-extrabold' : 'opacity-70 hover:opacity-100'" class="px-2 py-1 rounded-lg">7. Telemetry</button>
    <button @click="style = 'minimalist'" :class="style === 'minimalist' ? 'bg-white text-black font-extrabold' : 'opacity-70 hover:opacity-100'" class="px-2 py-1 rounded-lg">8. Ultra Mono</button>
    <button @click="style = 'vertical'" :class="style === 'vertical' ? 'bg-red-600 text-white font-extrabold' : 'opacity-70 hover:opacity-100'" class="px-2 py-1 rounded-lg">9. Stacked Tower</button>
    <button @click="style = 'marquee'" :class="style === 'marquee' ? 'bg-neutral-900 text-red-500 font-extrabold' : 'opacity-70 hover:opacity-100'" class="px-2 py-1 rounded-lg">10. Motion Strip</button>
  </header>

  <!-- MAIN CARD CONTAINER -->
  <main class="w-full max-w-sm py-4 border-y transition-all duration-300 relative"
        :class="isDark ? 'border-white/15' : 'border-neutral-300'">

    <!-- VARIANT 1: CYBER HUD (NEON GLOW + CORNER BRACKETS) -->
    <template x-if="style === 'cyber'">
      <div class="mb-5 p-4 rounded-xl border relative overflow-hidden bg-black font-mono-tech border-red-500/40 shadow-[0_0_20px_rgba(239,68,68,0.15)]">
        <!-- Corner brackets -->
        <div class="absolute top-0 left-0 w-2 h-2 border-t-2 border-l-2 border-red-500"></div>
        <div class="absolute top-0 right-0 w-2 h-2 border-t-2 border-r-2 border-red-500"></div>
        <div class="absolute bottom-0 left-0 w-2 h-2 border-b-2 border-l-2 border-red-500"></div>
        <div class="absolute bottom-0 right-0 w-2 h-2 border-b-2 border-r-2 border-red-500"></div>
        
        <div class="flex items-center justify-between mb-3 text-[10px] text-red-500 font-bold uppercase tracking-widest">
          <span>// MLS_PHOTO_UNIT</span>
          <span class="animate-pulse">● LIVE_FEE</span>
        </div>

        <div class="flex items-center justify-between">
          <div>
            <h1 class="text-xl font-black text-white tracking-tight uppercase">FULL SHOOT</h1>
            <span class="text-[9px] text-neutral-400 font-extrabold">STANDARD MEDIA PACKAGE</span>
          </div>

          <div class="flex items-center gap-2">
            <button @click="includeTax = !includeTax"
                    class="px-2 py-1 rounded text-[9px] font-black uppercase transition-all border"
                    :class="includeTax 
                      ? 'bg-red-500 text-white border-red-400 shadow-[0_0_10px_#ef4444]' 
                      : 'bg-neutral-900 text-neutral-400 border-neutral-700'">
              TAX
            </button>
            <div class="text-2xl font-black text-white tracking-tighter">
              $<span x-text="priceDollars"></span><span class="text-sm opacity-80" x-text="priceCents"></span>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- VARIANT 2: LUXURY SERIF (EDITORIAL GOLD ACCENTS & HIGH-END TYPOGRAPHY) -->
    <template x-if="style === 'luxury'">
      <div class="mb-5 p-5 rounded-2xl border text-center relative overflow-hidden transition-all"
           :class="isDark ? 'bg-[#0c0a09] border-amber-500/20 text-white' : 'bg-stone-50 border-stone-300 text-stone-900 shadow-sm'">
        <span class="text-[9px] font-bold tracking-[0.3em] uppercase text-amber-500 block mb-1">REAL ESTATE MEDIA</span>
        <h1 class="text-3xl font-serif-luxury italic font-bold mb-3">Full Shoot</h1>
        
        <div class="inline-flex items-center gap-3 px-3 py-1.5 rounded-full border border-amber-500/30 bg-amber-500/5 backdrop-blur-md">
          <span class="text-2xl font-serif-luxury font-bold tracking-tight">
            $<span x-text="priceDollars"></span><span class="text-sm" x-text="priceCents"></span>
          </span>
          <div class="h-4 w-[1px] bg-amber-500/30"></div>
          <button @click="includeTax = !includeTax"
                  class="text-[9px] font-bold tracking-widest uppercase transition-colors"
                  :class="includeTax ? 'text-amber-400 underline font-black' : 'text-neutral-500 hover:text-amber-400'">
            <span x-text="includeTax ? 'Tax Incl' : '+ Tax'"></span>
          </button>
        </div>
      </div>
    </template>

    <!-- VARIANT 3: PASS STUB (PHYSICAL TICKET/BOARDING PASS METAPHOR) -->
    <template x-if="style === 'ticket'">
      <div class="mb-5 rounded-2xl border overflow-hidden transition-all relative"
           :class="isDark ? 'bg-neutral-900 border-white/20' : 'bg-white border-neutral-300 shadow-md'">
        <div class="p-3.5 flex items-center justify-between border-b border-dashed"
             :class="isDark ? 'border-white/20 bg-neutral-800/50' : 'border-neutral-300 bg-neutral-100'">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-red-600"></span>
            <span class="text-[10px] font-black uppercase tracking-wider">MLS PASS #880</span>
          </div>
          <button @click="includeTax = !includeTax"
                  class="px-2 py-0.5 rounded-md text-[9px] font-black uppercase transition-all"
                  :class="includeTax ? 'bg-black text-white' : 'bg-neutral-200 text-neutral-600'">
            TAX
          </button>
        </div>
        <div class="p-4 flex items-center justify-between">
          <div>
            <span class="text-[9px] font-extrabold uppercase opacity-50 block">SERVICE</span>
            <h1 class="text-2xl font-black tracking-tight">Full Shoot</h1>
          </div>
          <div class="text-right">
            <span class="text-[9px] font-extrabold uppercase opacity-50 block">RATE</span>
            <div class="text-2xl font-black tracking-tight">
              $<span x-text="priceDollars"></span><span class="text-sm opacity-70" x-text="priceCents"></span>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- VARIANT 4: MASSIVE STAT (FINTECH SCALE TYPOGRAPHY FIRST) -->
    <template x-if="style === 'stat'">
      <div class="mb-5 p-4 rounded-3xl border transition-all"
           :class="isDark ? 'bg-neutral-900/80 border-white/10' : 'bg-neutral-50 border-neutral-300 shadow-sm'">
        <div class="flex items-center justify-between mb-1">
          <span class="text-[10px] font-black uppercase tracking-widest text-red-500">TOTAL RATE</span>
          <button @click="includeTax = !includeTax"
                  class="text-[9px] font-extrabold uppercase tracking-wider px-2 py-0.5 rounded-full border transition-all"
                  :class="includeTax 
                    ? 'bg-red-500 text-white border-red-500' 
                    : (isDark ? 'text-neutral-400 border-white/10' : 'text-neutral-600 border-neutral-300')">
            <span x-text="includeTax ? 'TAX INCLUDED' : '+ TAX'"></span>
          </button>
        </div>

        <div class="text-5xl font-black tracking-tighter tabular-nums mb-2 leading-none" :class="isDark ? 'text-white' : 'text-black'">
          <span class="text-2xl font-bold -mr-1">$</span><span x-text="priceDollars"></span><span class="text-2xl font-bold" x-text="priceCents"></span>
        </div>

        <div class="flex items-center justify-between pt-2 border-t" :class="isDark ? 'border-white/10' : 'border-neutral-200'">
          <h1 class="text-sm font-black uppercase tracking-wide">MLS Photos • Full Shoot</h1>
          <span class="text-[10px] font-bold opacity-50">Base Tier</span>
        </div>
      </div>
    </template>

    <!-- VARIANT 5: FLOATING CAPSULE (PUNCHY GLASS FLOATING BAR) -->
    <template x-if="style === 'pill'">
      <div class="mb-5 p-2 rounded-full border backdrop-blur-2xl flex items-center justify-between shadow-xl transition-all"
           :class="isDark ? 'bg-white/10 border-white/20' : 'bg-white/90 border-neutral-300'">
        
        <div class="flex items-center gap-2 pl-2">
          <div class="w-8 h-8 rounded-full bg-red-600 text-white font-black text-[10px] flex items-center justify-center shrink-0">
            MLS
          </div>
          <h1 class="text-sm font-black tracking-tight pr-2">Full Shoot</h1>
        </div>

        <div class="flex items-center gap-2 pr-1">
          <div class="text-lg font-black tracking-tight tabular-nums">
            $<span x-text="priceDollars"></span><span class="text-xs opacity-80" x-text="priceCents"></span>
          </div>
          <button @click="includeTax = !includeTax"
                  class="w-7 h-7 rounded-full text-[9px] font-black uppercase flex items-center justify-center transition-all border"
                  :class="includeTax 
                    ? 'bg-red-600 text-white border-red-600 shadow-[0_0_8px_#ef4444]' 
                    : (isDark ? 'bg-white/10 text-neutral-300 border-white/10' : 'bg-neutral-200 text-neutral-700 border-neutral-300')">
            TAX
          </button>
        </div>
      </div>
    </template>

    <!-- VARIANT 6: NEO-BRUTALISM (HEAVY OUTLINES, POPPING SHADOWS) -->
    <template x-if="style === 'neobrutal'">
      <div class="mb-5 p-4 rounded-xl border-4 border-black bg-white text-black shadow-[4px_4px_0px_0px_#ef4444] font-space">
        <div class="flex items-center justify-between mb-2">
          <span class="bg-black text-white px-2 py-0.5 text-[9px] font-bold uppercase tracking-wider">MLS PHOTOS</span>
          <button @click="includeTax = !includeTax"
                  class="border-2 border-black px-2 py-0.5 text-[9px] font-black uppercase tracking-wider shadow-[2px_2px_0px_0px_#000] active:translate-x-0.5 active:translate-y-0.5 transition-all"
                  :class="includeTax ? 'bg-red-500 text-white' : 'bg-yellow-300 text-black'">
            TAX
          </button>
        </div>

        <div class="flex items-end justify-between">
          <h1 class="text-2xl font-black uppercase tracking-tighter leading-none">Full Shoot</h1>
          <div class="text-3xl font-black tracking-tighter leading-none bg-yellow-300 px-2 py-1 border-2 border-black">
            $<span x-text="priceDollars"></span><span class="text-base" x-text="priceCents"></span>
          </div>
        </div>
      </div>
    </template>

    <!-- VARIANT 7: TELEMETRY DASHBOARD (FINANCE CONTROL MATRIX) -->
    <template x-if="style === 'dashboard'">
      <div class="mb-5 grid grid-cols-3 gap-1.5 p-1.5 rounded-2xl border"
           :class="isDark ? 'bg-neutral-900 border-white/10' : 'bg-neutral-200 border-neutral-300'">
        
        <div class="col-span-2 p-3 rounded-xl border flex flex-col justify-between"
             :class="isDark ? 'bg-black border-white/10' : 'bg-white border-neutral-300'">
          <span class="text-[9px] font-extrabold uppercase text-red-500">MEDIA UNIT</span>
          <h1 class="text-lg font-black tracking-tight leading-tight">Full Shoot</h1>
        </div>

        <div class="p-3 rounded-xl border flex flex-col justify-between items-end tabular-nums"
             :class="isDark ? 'bg-black border-white/10' : 'bg-white border-neutral-300'">
          <button @click="includeTax = !includeTax"
                  class="px-1.5 py-0.5 rounded text-[8px] font-black uppercase border"
                  :class="includeTax ? 'bg-red-600 text-white border-red-600' : 'text-neutral-400 border-neutral-700'">
            TAX
          </button>
          <div class="text-xl font-black tracking-tight">
            $<span x-text="priceDollars"></span>
          </div>
        </div>
      </div>
    </template>

    <!-- VARIANT 8: ULTRA MINIMAL MONO (PURE TYPE NO CONTAINERS) -->
    <template x-if="style === 'minimalist'">
      <div class="mb-5 font-mono-tech border-b-2 pb-3" :class="isDark ? 'border-white' : 'border-black'">
        <div class="flex items-baseline justify-between mb-1">
          <span class="text-[10px] opacity-60">01 / PACKAGE</span>
          <button @click="includeTax = !includeTax"
                  class="text-[9px] font-bold uppercase transition-all"
                  :class="includeTax ? 'text-red-500 font-extrabold' : 'opacity-40'">
            [TAX: <span x-text="includeTax ? 'ON' : 'OFF'"></span>]
          </button>
        </div>
        <div class="flex items-baseline justify-between">
          <h1 class="text-2xl font-extrabold tracking-tighter">Full Shoot</h1>
          <div class="text-3xl font-black tracking-tighter">
            $<span x-text="priceDollars"></span><span class="text-sm opacity-60" x-text="priceCents"></span>
          </div>
        </div>
      </div>
    </template>

    <!-- VARIANT 9: STACKED TOWER (VERTICAL CENTERED EMPHASIS) -->
    <template x-if="style === 'vertical'">
      <div class="mb-5 p-5 rounded-3xl border text-center relative overflow-hidden"
           :class="isDark ? 'bg-neutral-900/90 border-white/10' : 'bg-white border-neutral-300 shadow-sm'">
        <div class="w-10 h-10 rounded-2xl bg-red-600 text-white mx-auto mb-2 flex items-center justify-center font-black text-sm">
          MLS
        </div>
        <h1 class="text-xl font-black tracking-tight mb-1">Full Shoot</h1>
        
        <div class="text-4xl font-black tracking-tighter mb-3 tabular-nums">
          $<span x-text="priceDollars"></span><span class="text-xl font-bold opacity-80" x-text="priceCents"></span>
        </div>

        <button @click="includeTax = !includeTax"
                class="w-full py-1.5 rounded-xl text-[10px] font-black tracking-widest uppercase transition-all border"
                :class="includeTax 
                  ? 'bg-red-600 text-white border-red-600 shadow-md' 
                  : (isDark ? 'bg-white/5 text-neutral-400 border-white/10' : 'bg-neutral-100 text-neutral-600 border-neutral-300')">
          <span x-text="includeTax ? 'SALES TAX INCLUDED' : '+ ADD SALES TAX'"></span>
        </button>
      </div>
    </template>

    <!-- VARIANT 10: MOTION STRIP (MARQUEE BRAND ACCENT) -->
    <template x-if="style === 'marquee'">
      <div class="mb-5 rounded-2xl border overflow-hidden"
           :class="isDark ? 'bg-neutral-900 border-white/10' : 'bg-white border-neutral-300 shadow-sm'">
        <!-- Running marquee banner -->
        <div class="bg-red-600 text-white text-[8px] font-black uppercase tracking-widest py-1 overflow-hidden whitespace-nowrap">
          <div class="inline-block animate-marquee">
            MLS PHOTOS • FULL SHOOT • GUARANTEED RATE • MLS PHOTOS • FULL SHOOT • GUARANTEED RATE •
          </div>
        </div>

        <div class="p-4 flex items-center justify-between">
          <div>
            <h1 class="text-2xl font-black tracking-tight">Full Shoot</h1>
            <button @click="includeTax = !includeTax"
                    class="mt-1 text-[9px] font-bold uppercase transition-colors"
                    :class="includeTax ? 'text-red-500 font-extrabold' : 'opacity-50'">
              <span x-text="includeTax ? '✓ Tax Included' : '+ Enable Tax'"></span>
            </button>
          </div>

          <div class="text-3xl font-black tracking-tight tabular-nums">
            $<span x-text="priceDollars"></span><span class="text-lg font-bold opacity-80" x-text="priceCents"></span>
          </div>
        </div>
      </div>
    </template>

    <!-- CALCULATOR CONTENT PLACEHOLDER -->
    <div class="opacity-40 pointer-events-none select-none">
      <div class="h-10 rounded-xl border mb-3 flex items-center justify-center text-xs font-bold"
           :class="isDark ? 'border-white/10 bg-white/5' : 'border-neutral-300 bg-neutral-200/50'">
        0 – 1,999 Sq Ft
      </div>
      <div class="grid grid-cols-4 gap-1.5">
        <div class="h-12 rounded-xl bg-red-600 text-white flex flex-col items-center justify-center text-xs font-bold">
          <span>25</span>
          <span>$139</span>
        </div>
        <div class="h-12 rounded-xl border flex flex-col items-center justify-center text-xs font-bold" :class="isDark ? 'border-white/10' : 'border-neutral-300'">36</div>
        <div class="h-12 rounded-xl border flex flex-col items-center justify-center text-xs font-bold" :class="isDark ? 'border-white/10' : 'border-neutral-300'">40</div>
        <div class="h-12 rounded-xl border flex flex-col items-center justify-center text-xs font-bold" :class="isDark ? 'border-white/10' : 'border-neutral-300'">50</div>
      </div>
    </div>

    <!-- FOOTER WIZARD & THEME TOGGLE -->
    <div class="flex items-center justify-between pt-4 mt-4 border-t" :class="isDark ? 'border-white/10' : 'border-neutral-200'">
      <span class="text-[10px] font-bold opacity-50">10 Radical Redesigns</span>
      <button @click="isDark = !isDark" 
              class="w-7 h-7 flex items-center justify-center rounded-lg text-xs"
              :class="isDark ? 'text-neutral-400 hover:text-white' : 'text-neutral-500 hover:text-black'">
        <span x-text="isDark ? '☀️' : '🌙'"></span>
      </button>
    </div>

  </main>
</body>
</html>
