<!DOCTYPE html>
<html lang="en" class="h-full bg-[#050505] text-white antialiased">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full Shoot - Final UI Polish</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    [x-cloak] { display: none !important; }
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
  </style>
</head>
<body class="min-h-full bg-[#050505] text-white p-4 flex flex-col items-center justify-center"
      x-data="{ 
        state: 'idle',
        toast: false,
        flashingTier: null,
        includeTax: false,
        taxRate: 0.08,
        count: 26,
        previousTierImgs: 25,
        maxCount: 150,
        extraCost: 5,

        selectTier(tierCount) { this.count = tierCount; },

        get effectiveTier() {
          let tier = { imgs: 25, price: 139 };
          if (this.count >= 47) tier = { imgs: 50, price: 224 };
          else if (this.count >= 38) tier = { imgs: 40, price: 189 };
          else if (this.count >= 33) tier = { imgs: 36, price: 179 };

          if (tier.imgs > this.previousTierImgs) {
            this.pulseUpgradeTile(tier.imgs);
          }
          this.previousTierImgs = tier.imgs;
          return tier;
        },

        pulseUpgradeTile(tierImgs) {
          this.flashingTier = tierImgs;
          if (window.navigator && window.navigator.vibrate) {
            window.navigator.vibrate([10, 30, 20]);
          }
          setTimeout(() => { this.flashingTier = null; }, 1800);
        },

        get extras() { return Math.max(0, this.count - this.effectiveTier.imgs); },
        get extraTotal() { return this.extras * this.extraCost; },
        get rawTotal() { return this.effectiveTier.price + this.extraTotal; },
        get finalTotal() { 
          const amount = this.includeTax ? this.rawTotal * (1 + this.taxRate) : this.rawTotal;
          return amount.toFixed(2);
        },

        get priceDollars() { return this.finalTotal.split('.')[0].split(''); },
        get priceCents() { return this.finalTotal.split('.')[1]; },

        validateInput() {
          let val = parseInt(this.count);
          if (isNaN(val) || val < 25) this.count = 25;
          else if (val > this.maxCount) this.count = this.maxCount;
          else this.count = val;
        },

        updateCount(direction) {
          if (this.state === 'success') return;
          if (direction === 'up' && this.count < this.maxCount) this.count++;
          else if (direction === 'down' && this.count > 25) this.count--;
        },

        triggerSequence() {
          if (this.state !== 'idle') return;
          this.state = 'success';
          this.toast = true;
          if (window.navigator && window.navigator.vibrate) {
            window.navigator.vibrate(40);
          }
          setTimeout(() => {
            this.toast = false;
            setTimeout(() => { this.state = 'idle'; }, 300);
          }, 2800);
        }
      }">

  <!-- FLOATING TOAST -->
  <aside x-show="toast" 
         x-transition:enter="transition ease-out duration-300 transform"
         x-transition:enter-start="-translate-y-4 opacity-0 scale-95"
         x-transition:enter-end="translate-y-0 opacity-100 scale-100"
         x-transition:leave="transition ease-in duration-200 transform"
         x-transition:leave-start="translate-y-0 opacity-100"
         x-transition:leave-end="-translate-y-4 opacity-0"
         x-cloak
         class="fixed top-6 left-0 right-0 mx-auto w-max bg-neutral-900/90 backdrop-blur-xl border border-white/20 px-4 py-2 rounded-full shadow-2xl flex items-center gap-2.5 text-xs font-semibold text-white z-50">
      <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
      <span>Added to cart • <span class="text-neutral-300 tabular-nums font-bold" x-text="'$' + finalTotal"></span></span>
  </aside>

  <!-- CARD CONTAINER -->
  <main class="w-full max-w-sm relative bg-[#0D0D0D] p-6 rounded-[28px] border border-white/10 shadow-2xl backdrop-blur-2xl">
    
    <!-- 1. Header Controls -->
    <div class="flex items-center justify-between mb-5">
      <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium text-neutral-400 bg-white/5 border border-white/10">
        <svg class="w-3.5 h-3.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z" />
        </svg>
        <span>Wizard</span>
      </span>
      <button class="w-11 h-11 -mr-2.5 -mt-2 rounded-full flex items-center justify-center text-xs text-neutral-400 hover:text-white transition-colors" title="Package details">
        <span class="w-6 h-6 rounded-full border border-white/15 flex items-center justify-center">ⓘ</span>
      </button>
    </div>

    <!-- 2. Hero Row -->
    <div class="flex items-start justify-between gap-3 mb-6">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center text-white shrink-0">
          <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
        </div>
        <div>
          <span class="text-[10px] font-bold text-neutral-400 uppercase tracking-widest block">MLS PHOTOS</span>
          <h3 class="text-lg font-extrabold text-white leading-tight">Full Shoot</h3>
        </div>
      </div>

      <!-- Hero Price -->
      <div class="flex flex-col items-end shrink-0">
        <div class="text-white font-extrabold text-3xl tracking-tight flex items-start leading-none select-none">
          <span class="text-sm font-bold leading-none mt-0.5 mr-0.5 text-white">$</span>
          
          <div class="flex items-baseline leading-none">
            <template x-for="(char, i) in priceDollars" :key="i">
              <span class="tabular-nums text-white" x-text="char"></span>
            </template>
          </div>

          <div class="flex items-baseline text-xs font-bold leading-none ml-0.5 self-end mb-0.5 text-neutral-400">
            <span>.</span>
            <span class="tabular-nums" x-text="priceCents"></span>
          </div>
        </div>
        
        <!-- Tax Switcher -->
        <label class="flex items-center gap-2 mt-2 cursor-pointer select-none">
          <span class="text-[10px] font-bold text-neutral-400 uppercase tracking-wider" x-text="includeTax ? 'Inc. Tax' : 'No Tax'"></span>
          <input type="checkbox" x-model="includeTax" class="sr-only">
          <div class="w-8 h-4 bg-neutral-800 rounded-full border border-white/10 transition-colors relative"
               :class="includeTax ? 'bg-white/30 border-white/40' : 'bg-neutral-800'">
            <div class="w-3 h-3 bg-white rounded-full absolute top-0.5 left-0.5 transition-transform shadow-md"
                 :class="includeTax ? 'translate-x-4' : 'translate-x-0'"></div>
          </div>
        </label>
      </div>
    </div>

    <!-- 3. 4-Up Horizontal Track -->
    <div class="grid grid-cols-4 gap-1.5 mb-5 tabular-nums">
      <template x-for="t in [{imgs: 25, price: 139}, {imgs: 36, price: 179}, {imgs: 40, price: 189}, {imgs: 50, price: 224}]" :key="t.imgs">
        <button @click="selectTier(t.imgs)"
                :class="effectiveTier.imgs === t.imgs ? 'bg-white/10 border-white text-white ring-1 ring-white/50 shadow-lg' : 'bg-neutral-900/60 text-neutral-400 border-white/10 hover:border-white/20 hover:text-white'"
                class="py-2.5 px-1 rounded-2xl border flex flex-col items-center justify-center text-center transition-all duration-200 active:scale-95">
          
          <span class="text-[11px] font-bold leading-tight" :class="effectiveTier.imgs === t.imgs ? 'text-white' : 'text-neutral-300'" x-text="t.imgs + ' Imgs'"></span>
          
          <div class="flex items-start justify-center mt-0.5 leading-none">
            <span class="text-[9px] font-bold text-white mt-[1px] mr-[1px]">$</span>
            <span class="text-xs font-extrabold text-white" x-text="t.price"></span>
          </div>

        </button>
      </template>
    </div>

    <!-- 4. Line Items with Refined Active/Inactive Color States -->
    <div class="space-y-2 mb-5 tabular-nums">
      <!-- Base Package Row -->
      <div class="bg-neutral-900/90 border border-white/10 p-3.5 rounded-2xl flex items-center justify-between">
        <span class="text-xs font-bold text-white" x-text="'Base Package ' + effectiveTier.imgs + ' Photos'"></span>
        
        <div class="flex items-start leading-none">
          <span class="text-[10px] font-bold text-white mt-[1px] mr-[1px]">$</span>
          <span class="text-xs font-extrabold text-white" x-text="effectiveTier.price"></span>
        </div>
      </div>

      <!-- Extras Row with Exact Color Mapping -->
      <div class="bg-neutral-900/90 border p-3.5 rounded-2xl flex items-center justify-between transition-all duration-200"
           :class="extras > 0 ? 'border-red-500/40 bg-red-500/5' : 'border-white/10'">
        
        <div class="flex items-center text-xs font-bold">
          <span class="text-white font-extrabold">$5</span>
          <span :class="extras > 0 ? 'text-white' : 'text-neutral-400'"
                x-text="extras > 0 ? ' /Extra Photo × ' + extras : ' /Extra Photo'"></span>
        </div>
        
        <div class="flex items-start leading-none font-extrabold text-xs">
          <template x-if="extras > 0">
            <div class="flex items-center">
              <span class="text-white">+</span>
              <span class="text-white text-[10px] font-bold mt-[1px] mx-[0.5px]">$</span>
              <span class="text-red-500 font-extrabold" x-text="extraTotal"></span>
            </div>
          </template>
          
          <template x-if="extras === 0">
            <span class="text-neutral-500 font-bold">$0</span>
          </template>
        </div>
      </div>
    </div>

    <!-- 5. Stepper Row -->
    <div class="flex items-center justify-between py-1 mb-5">
      <span class="text-xs font-bold text-neutral-300">Total Image Count</span>
      <div class="flex items-center gap-1 bg-neutral-900 p-1 rounded-2xl border border-white/10">
        <button @click="updateCount('down')" 
                :disabled="count <= 25"
                :class="count <= 25 ? 'opacity-20 cursor-not-allowed' : 'hover:bg-neutral-800 active:scale-95 text-white'"
                class="w-10 h-10 rounded-xl font-bold text-base flex items-center justify-center transition-all">
          -
        </button>
        
        <input type="number" 
               x-model.number="count"
               @blur="validateInput()"
               @focus="$el.scrollIntoView({behavior: 'smooth'})"
               @keydown.enter="$event.target.blur()"
               class="w-12 h-10 bg-transparent text-center text-xs font-bold text-white focus:outline-none focus:bg-neutral-800/80 rounded-lg tabular-nums" />

        <button @click="updateCount('up')"
                :disabled="count >= maxCount"
                :class="count >= maxCount ? 'opacity-20 cursor-not-allowed' : 'hover:bg-neutral-800 active:scale-95 text-white'"
                class="w-10 h-10 rounded-xl font-bold text-base flex items-center justify-center transition-all">
          +
        </button>
      </div>
    </div>

    <!-- 6. Matched CTA Button -->
    <button @click="triggerSequence()" :disabled="state !== 'idle'"
            :class="state === 'success' ? 'bg-[#0D0D0D] border border-white text-white' : 'bg-white text-black hover:bg-neutral-200 active:scale-[0.98]'"
            class="relative w-full h-13 py-3.5 px-5 rounded-2xl flex items-center justify-center transition-all duration-200 shadow-xl disabled:pointer-events-none">
      
      <!-- Default State: White Pill with Cart Icon and Chevron -->
      <template x-if="state !== 'success'">
        <div class="flex items-center justify-between w-full relative">
          <div class="w-5"></div> <!-- Spacer for perfect centering -->
          <svg class="w-5 h-5 text-black" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
          </svg>
          <svg class="w-5 h-5 text-black" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
          </svg>
        </div>
      </template>

      <!-- Active/Confirmed State: Dark Pill with White Check Circle and Chevron -->
      <template x-if="state === 'success'">
        <div class="flex items-center justify-between w-full relative">
          <div class="w-5"></div> <!-- Spacer for perfect centering -->
          <div class="w-6 h-6 rounded-full bg-white flex items-center justify-center">
            <svg class="w-3.5 h-3.5 text-black" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
            </svg>
          </div>
          <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
          </svg>
        </div>
      </template>

    </button>

  </main>
</body>
</html>
