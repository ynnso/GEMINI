  <title>S2S Field App - Airbnb Toggle & Pricing Sheet</title>

    tailwind.config = {
      darkMode: 'class',

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      overscroll-behavior-y: none;
    }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    [x-cloak] { display: none !important; }
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }

    @keyframes subtle-pulse-white {
      0%, 100% { border-color: rgba(255, 255, 255, 0.25); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
      50% { border-color: rgba(255, 255, 255, 0.8); box-shadow: 0 0 12px 0 rgba(255, 255, 255, 0.25); }
    }

    @keyframes subtle-pulse-red-light {
      0%, 100% { border-color: rgba(239, 68, 68, 0.4); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
      50% { border-color: rgba(239, 68, 68, 0.9); box-shadow: 0 0 10px 0 rgba(239, 68, 68, 0.2); }
    }

    .animate-pulse-dark { animation: subtle-pulse-white 2s infinite ease-in-out; }
    .animate-pulse-light { animation: subtle-pulse-red-light 1.8s infinite ease-in-out; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>

        /* CART ACTIONS */
        deleteItem(item) {
          item.state = 'deleted';
          if (item.timer) clearTimeout(item.timer);
          item.timer = setTimeout(() => {
            item.state = 'removed';
          }, 6000);
        },
        restoreItem(item) {
          if (item.timer) clearTimeout(item.timer);
          item.state = 'active';
        },
        permanentlyDismiss(item) {
          if (item.timer) clearTimeout(item.timer);
          item.state = 'removed';
        },
        clearCart() {
          const activeItems = this.cartItems.filter(i => i.state === 'active');
          if (activeItems.length === 0) return;
          this.clearedCache = JSON.parse(JSON.stringify(activeItems));
          this.cartItems.forEach(i => {
            if (i.timer) clearTimeout(i.timer);
            i.state = 'removed';
          });
        },
        restoreClearedCart() {
          if (this.clearedCache.length === 0) return;
          this.cartItems = JSON.parse(JSON.stringify(this.clearedCache));
          this.cartItems.forEach(i => i.state = 'active');

        },

        /* FULL SHOOT LOGIC */
        get holdsSelection() { return this.selectedSqFt !== ''; },

        get selectedSqFtLabel() {
          const found = this.sqFtOptions.find(o => o.value === this.selectedSqFt);
          return found ? found.label : 'Select Sq Ft';
        },

        selectSqFt(val) {
          this.selectedSqFt = val;
          this.dropdownOpen = false;
          this.handleSqFtChange();
        },

        handleSqFtChange() {
          this.selectedBase = 25;
          if (this.count < 25) this.count = 25;
          this.evaluateCheapestBase();
        },

        getTierPrice(imgs) {
          if (!this.holdsSelection) return '--';
          return this.priceMatrix[this.selectedSqFt][imgs];
        },

        selectTier(c) { 
          if (!this.holdsSelection) return;
          this.selectedBase = c;
          this.count = c; 
        },

        evaluateCheapestBase() {
          if (!this.holdsSelection) return;
          const tiers = [25, 36, 40, 50];
          let bestTier = tiers[0];
          let minCost = Infinity;

          for (let t of tiers) {
            let cost = (this.count >= t) ? (this.getTierPrice(t) + (this.count - t) * this.extraCost) : this.getTierPrice(t);
            if (cost < minCost) {
              minCost = cost;
              bestTier = t;
            }
          }

          if (this.count === 33) this.selectedBase = 25;
          else if (this.count === 38) this.selectedBase = 36;
          else if (this.count === 47) this.selectedBase = 40;
          else this.selectedBase = bestTier;
        },

        sanitizeInput() {
          let val = parseInt(this.count, 10);
          if (isNaN(val) || val < 25) val = 25;
          if (val > 150) val = 150;
          this.count = val;
          this.evaluateCheapestBase();
        },

        get effectiveTier() {
          return { imgs: this.selectedBase, price: this.holdsSelection ? this.getTierPrice(this.selectedBase) : 0 };
        },

        get targetUpgradeTier() {
          if (!this.holdsSelection) return null;
          if (this.selectedBase === 25 && this.count === 33) return 36;
          if (this.selectedBase === 36 && this.count === 38) return 40;
          if (this.selectedBase === 40 && this.count === 47) return 50;
          return null;
        },

        get extras() { return Math.max(0, this.count - this.effectiveTier.imgs); },
        get extraTotal() { return this.extras * this.extraCost; },
        get rawTotal() { return this.effectiveTier.price + this.extraTotal; },

          if (!this.holdsSelection) return null;
          const amount = this.includeTax ? this.rawTotal * (1 + this.taxRate) : this.rawTotal;
          return amount.toFixed(2);
        },

        get priceCents() { return this.finalTotal ? '.' + this.finalTotal.split('.')[1] : ''; },

        updateCount(dir) {
          if (!this.holdsSelection) return;
          if (dir === 'up' && this.count < 150) {
            this.count++;
            this.evaluateCheapestBase();
          }
          if (dir === 'down' && this.count > 25) {
            this.count--;
            this.evaluateCheapestBase();
          }
        },

        get reshootExtras() { return Math.max(0, this.reshootCount - 8); },

            this.reshootCount--;
          }
        },

          }
        },

        sanitizeMiniInput() {
          let val = parseInt(this.miniCount, 10);
          if (isNaN(val) || val < 12) val = 12;
          if (val > 24) val = 24;
          this.miniCount = val;
        },

        /* AIRBNB / LEASE LOGIC */
        get airbnbExtras() { return Math.max(0, this.airbnbCount - 12); },
        get airbnbExtraTotal() { return this.airbnbExtras * this.airbnbExtraCost; },
        get airbnbRawTotal() { return this.airbnbBasePrice + this.airbnbExtraTotal; },
        get airbnbFinalTotal() {
          const amount = this.includeTax ? this.airbnbRawTotal * (1 + this.taxRate) : this.airbnbRawTotal;
          return amount.toFixed(2);
        },
        get airbnbPriceDollars() { return this.airbnbFinalTotal.split('.')[0]; },
        get airbnbPriceCents() { return '.' + this.airbnbFinalTotal.split('.')[1]; },

        updateAirbnbCount(dir) {
          if (dir === 'up' && this.airbnbCount < 50) {
            this.airbnbCount++;
          }
          if (dir === 'down' && this.airbnbCount > 12) {
            this.airbnbCount--;
          }
        },

        sanitizeAirbnbInput() {
          let val = parseInt(this.airbnbCount, 10);
          if (isNaN(val) || val < 12) val = 12;
          if (val > 50) val = 50;
          this.airbnbCount = val;
        },

        /* EXTERIOR ONLY LOGIC */
        get exteriorExtras() { return Math.max(0, this.exteriorCount - 8); },
        get exteriorExtraTotal() { return this.exteriorExtras * this.exteriorExtraCost; },
        get exteriorRawTotal() { return this.exteriorBasePrice + this.exteriorExtraTotal; },
        get exteriorFinalTotal() {
          const amount = this.includeTax ? this.exteriorRawTotal * (1 + this.taxRate) : this.exteriorRawTotal;
          return amount.toFixed(2);
        },
        get exteriorPriceDollars() { return this.exteriorFinalTotal.split('.')[0]; },
        get exteriorPriceCents() { return '.' + this.exteriorFinalTotal.split('.')[1]; },

        updateExteriorCount(dir) {
          if (dir === 'up' && this.exteriorCount < 20) {
            this.exteriorCount++;
          }
          if (dir === 'down' && this.exteriorCount > 8) {
            this.exteriorCount--;
          }
        },

        sanitizeExteriorInput() {
          let val = parseInt(this.exteriorCount, 10);
          if (isNaN(val) || val < 8) val = 8;
          if (val > 20) val = 20;
          this.exteriorCount = val;
        },

        /* RANCH SHOOT LOGIC */
        getRanchTierPrice(imgs) {
          return this.ranchPriceMatrix[imgs];
        },

        selectRanchTier(c) {
          this.ranchSelectedBase = c;
          this.ranchCount = c;
        },

        evaluateRanchCheapestBase() {
          if (this.ranchCount === 35) {
            this.ranchSelectedBase = 25;
          } else if (this.ranchCount >= 36) {
            this.ranchSelectedBase = 36;
          } else {
            this.ranchSelectedBase = 25;
          }
        },

        sanitizeRanchInput() {
          let val = parseInt(this.ranchCount, 10);
          if (isNaN(val) || val < 25) val = 25;
          if (val > 150) val = 150;
          this.ranchCount = val;
          this.evaluateRanchCheapestBase();
        },

        get ranchEffectiveTier() {
          return { imgs: this.ranchSelectedBase, price: this.getRanchTierPrice(this.ranchSelectedBase) };
        },

        get ranchTargetUpgradeTier() {
          if (this.ranchSelectedBase === 25 && this.ranchCount === 35) return 36;
          return null;
        },

        get ranchExtras() { return Math.max(0, this.ranchCount - this.ranchEffectiveTier.imgs); },
        get ranchExtraTotal() { return this.ranchExtras * this.ranchExtraCost; },
        get ranchRawTotal() { return this.ranchEffectiveTier.price + this.ranchExtraTotal; },
        get ranchFinalTotal() {
          const amount = this.includeTax ? this.ranchRawTotal * (1 + this.taxRate) : this.ranchRawTotal;
          return amount.toFixed(2);
        },

        get ranchPriceDollars() { return this.ranchFinalTotal ? this.ranchFinalTotal.split('.')[0] : '299'; },
        get ranchPriceCents() { return this.ranchFinalTotal ? '.' + this.ranchFinalTotal.split('.')[1] : '.00'; },

        updateRanchCount(dir) {
          if (dir === 'up' && this.ranchCount < 150) {
            this.ranchCount++;
            this.evaluateRanchCheapestBase();
          }
          if (dir === 'down' && this.ranchCount > 25) {
            this.ranchCount--;
            this.evaluateRanchCheapestBase();
          }
        },

        /* ADD ITEM TO CART FROM OPTION SHEETS */
        addConfiguredItemToCart(title, desc, rawPrice, iconName) {
          if (this.state !== 'idle') return;
          this.state = 'success';
          
          const newItem = {
            id: Date.now(),
            title: title,
            desc: desc,
            price: rawPrice,
            icon: iconName,
            state: 'active',
            timer: null
          };

          this.cartItems.push(newItem);

          if (window.navigator && window.navigator.vibrate) {
            window.navigator.vibrate(40);
          }
          
          setTimeout(() => { 
            this.state = 'idle'; 
            this.closeSheet();
            setTimeout(() => {
              this.openSheet('cart');
            }, 250);
          }, 600);
        },

        /* SHEET CONTROLS & SMOOTH DRAG MECHANICS */
        openSheet(sheetName) {
          this.dragY = 0;
          this.activeSheet = null;
          this.$nextTick(() => {
            this.activeSheet = sheetName;
          });
        },

        closeSheet() {
          this.activeSheet = null;
          setTimeout(() => { this.dragY = 0; }, 300);
        },

        dragStart(e) {
          const clientY = e.clientY ?? (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
          this.startY = clientY;
          this.lastY = clientY;
          this.lastTime = Date.now();
          this.velocityY = 0;
          this.isDragging = true;
        },

        dragMove(e) {
          if (!this.isDragging) return;
          const currentY = e.clientY ?? (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
          const now = Date.now();
          const deltaY = currentY - this.startY;
          const dt = now - this.lastTime;

          if (dt > 0) {
            this.velocityY = (currentY - this.lastY) / dt;
          }

          this.lastY = currentY;
          this.lastTime = now;

          if (deltaY < 0) {
            this.dragY = deltaY * 0.25; 
          } else {
            this.dragY = deltaY;
          }
        },

        dragEnd() {
          if (!this.isDragging) return;
          this.isDragging = false;

          if (this.dragY > 100 || this.velocityY > 0.45) {
            this.closeSheet();
          } else {
            this.dragY = 0;
          }
        }

              </template>

              <template x-if="ranchTargetUpgradeTier">
                <div class="flex items-center justify-center gap-2 w-full select-none text-center">
                  <svg class="w-4 h-4 shrink-0 text-black" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l7.5-7.5 7.5 7.5m-15 6l7.5-7.5 7.5 7.5" />
                  </svg>
                  <span class="text-[15px] font-black tracking-tight leading-none text-black">
                    <span x-text="ranchTargetUpgradeTier"></span> Upgrade – Same Price!
                  </span>
                </div>
              </template>
            </div>

          </div>

          <div class="flex items-center justify-between gap-2 px-1">
            <span class="text-[16px] font-bold" :class="isDark ? 'text-white' : 'text-neutral-900'">Total Photos</span>
            <div class="flex items-center gap-2 shrink-0">
              <div class="flex items-center rounded-2xl border p-1 transition-colors h-11"
                   :class="isDark ? 'bg-neutral-900 border-white/10' : 'bg-white border-neutral-300 shadow-sm'">
                <button @click="updateRanchCount('down')" :disabled="ranchCount <= 25"
                        :class="ranchCount <= 25 ? 'opacity-20 cursor-not-allowed' : (isDark ? 'hover:bg-white/10 text-white cursor-pointer' : 'hover:bg-neutral-100 text-black cursor-pointer')"
                        class="w-8 h-8 rounded-xl font-bold text-lg flex items-center justify-center transition-all active:scale-90">-</button>
                
                <input type="number" 
                       x-model.number="ranchCount"
                       @change="sanitizeRanchInput()"
                       @blur="sanitizeRanchInput()"
                       min="25"
                       max="150"
                       class="w-10 h-8 bg-transparent text-center text-[16px] font-black focus:outline-none tabular-nums"
                       :class="isDark ? 'text-white' : 'text-neutral-900'" />
                
                <button @click="updateRanchCount('up')" :disabled="ranchCount >= 150"
                        :class="ranchCount >= 150 ? 'opacity-20 cursor-not-allowed' : (isDark ? 'hover:bg-white/10 text-white cursor-pointer' : 'hover:bg-neutral-100 text-black cursor-pointer')"
                        class="w-8 h-8 rounded-xl font-bold text-lg flex items-center justify-center transition-all active:scale-90">+</button>
              </div>

              <button @click="addConfiguredItemToCart('MLS Photos: Ranch Shoot', ranchCount + ' imgs', ranchRawTotal, 'home')" 
                      :disabled="state !== 'idle'"
                      :class="state === 'success' ? 'bg-emerald-400 text-black font-black cursor-pointer' : (isDark ? 'bg-white text-black hover:bg-neutral-200 cursor-pointer' : 'bg-black text-white hover:bg-neutral-800 cursor-pointer')"
                      class="h-11 px-4 rounded-2xl flex items-center justify-center transition-all duration-200 active:scale-95 shadow-md">
                <template x-if="state !== 'success'">
                  <svg class="w-6 h-6" :class="isDark ? 'text-black' : 'text-white'" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2.5 3.5h2l2.3 8.8a2 2 0 001.9 1.5h8.6a2 2 0 001.9-1.5l1.8-6.8" stroke-width="2.3" />
                    <circle cx="9" cy="19.5" r="1.5" fill="currentColor" />
                    <circle cx="16.5" cy="19.5" r="1.5" fill="currentColor" />
                    <path d="M11 7.5h5M13.5 5v5" stroke-width="2.6" stroke="currentColor" />
                  </svg>
                </template>
                <template x-if="state === 'success'">
                  <svg class="w-6 h-6 text-black" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2.5 3.5h2l2.3 8.8a2 2 0 001.9 1.5h8.6a2 2 0 001.9-1.5l1.8-6.8" stroke-width="2.3" />
                    <circle cx="9" cy="19.5" r="1.5" fill="currentColor" />
                    <circle cx="16.5" cy="19.5" r="1.5" fill="currentColor" />
                    <path d="M11 7.5l2 2 4.2-4.5" stroke-width="2.8" stroke="currentColor" />
                  </svg>
                </template>
              </button>
            </div>
          </div>
        </div>

        <div class="flex items-center justify-between pt-2 pb-1">
          <div class="relative inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl text-[13px] font-bold border transition-all tracking-tight cursor-pointer"
               :class="isDark ? 'text-neutral-400 bg-white/5 border-white/10 hover:border-white/30' : 'text-neutral-700 bg-neutral-200/60 border-neutral-300 hover:border-neutral-400 shadow-sm'">
            <svg class="w-3.5 h-3.5" :class="isDark ? 'text-white' : 'text-neutral-900'" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z" />
            </svg>
            <span>Wizard</span>
          </div>
        </div>

      </div>
    </template>

  </div>

</body>
</html>
