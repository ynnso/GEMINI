<!DOCTYPE html>
<html lang="en" class="h-full antialiased" x-data="{ isDark: true, style: 'split' }" :class="isDark ? 'bg-[#050505] text-white' : 'bg-neutral-100 text-neutral-900'">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10 More Wildly Different Hero Redesigns</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Syne:wght@700;800&family=Cinzel:wght@700;900&family=VT323&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-syne { font-family: 'Syne', sans-serif; }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .font-retro { font-family: 'VT323', monospace; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    [x-cloak] { display: none !important; }

    /* Dot grid background texture */
    .bg-dots-dark { background-image: radial-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 1px); background-size: 8px 8px; }
    .bg-dots-light { background-image: radial-gradient(rgba(0, 0, 0, 0.15) 1px, transparent 1px); background-size: 8px 8px; }
    
    /* Diagonal stripes texture */
    .bg-stripes { background: repeating-linear-gradient(-45deg, rgba(239, 68, 68, 0.1), rgba(239, 68, 68, 0.1) 10px, transparent 10px, transparent 20px); }
  </style>
</head>
<body class="min-h-full p-4 flex flex-col items-center justify-center transition-colors duration-300"
      x-data="{ 
        includeTax: false,
        taxRate: 0.0825,
        rawPrice: 139,
        get finalTotal() {
          const val = this.includeTax ? this.rawPrice * (1 + this.taxRate) : this.rawPrice;
          return val.toFixed(2);
        },
        get priceDollars() { return this.finalTotal.split('.')[0]; },
        get priceCents() { return '.' + this.finalTotal.split('.')[1]; }
      }">

  <!-- 10-VARIANT SWITCHER TOOLBAR -->
  <header class="mb-6 flex flex-wrap items-center justify-center gap-1.5 p-1.5 rounded-2xl border text-[11px] font-bold transition-colors max-w-lg w-full"
          :class="isDark ? 'bg-neutral-900/90 border-white/10 text-neutral-400' : 'bg-white border-neutral-300 text-neutral-600 shadow-sm'">
    <span class="px-2 text-[10px] uppercase tracking-widest font-black opacity-50 w-full text-center sm:w-auto">Next Gen Switcher:</span>
    
    <button @click="style = 'split'" :class="style === 'split' ? 'bg-red-600 text-white font-extrabold' : 'opacity-70 hover:opacity-100'" class="px-2 py-1 rounded-lg">11. 50/50 Split</button>
    <button @click="style = 'tab'" :class="style === 'tab' ? 'bg-white text-black font-extrabold' : 'opacity-70 hover:opacity-100'" class="px-2 py-1 rounded-lg">12. Folder Tab</button>
    <button @click="style = 'retro'" :class="style === 'retro' ? 'bg-red-500 text-white font-extrabold' : 'opacity-70 hover:opacity-100'" class="px-2 py-1 rounded-lg">13. Arcade CRT</button>
    <button @click="style = 'cinematic'" :class="style === 'cinematic' ? 'bg-stone-100 text-black font-extrabold' : 'opacity-70 hover:opacity-100'" class="px-2 py-1 rounded-lg">14. Cinematic</button>
    <button @click="style = 'switch'" :class="style === 'switch' ? 'bg-red-600 text-white font-extrabold' : 'opacity-70 hover:opacity-100'" class="px-2 py-1 rounded-lg">15. Toggle Deck</button>
    <button @click="style = 'badge'" :class="style === 'badge' ? 'bg-white text-black font-extrabold' : 'opacity-70 hover:opacity-100'" class="px-2 py-1 rounded-lg">16. Oversized Badge</button>
    <button @click="style = 'texture'" :class="style === 'texture' ? 'bg-red-600 text-white font-extrabold' : 'opacity-70 hover:opacity-100'" class="px-2 py-1 rounded-lg">17. Mesh Matrix</button>
    <button @click="style = 'floating'" :class="style === 'floating' ? 'bg-neutral-800 text-white font-extrabold' : 'opacity-70 hover:opacity-100'" class="px-2 py-1 rounded-lg">18. Orb Lock</button>
    <button @click="style = 'editorial'" :class="style === 'editorial' ? 'bg-red-600 text-white font-extrabold' : 'opacity-70 hover:opacity-100'" class="px-2 py-1 rounded-lg">19. Massive Syne</button>
    <button @click="style = 'receipt'" :class="style === 'receipt' ? 'bg-white text-black font-extrabold' : 'opacity-70 hover:opacity-100'" class="px-2 py-1 rounded-lg">20. Thermal Slip</button>
  </header>

  <!-- MAIN CARD CONTAINER -->
  <main class="w-full max-w-sm py-4 border-y transition-all duration-300 relative"
        :class="isDark ? 'border-white/15' : 'border-neutral-300'">

    <!-- VARIANT 11: 50/50 DUAL-TONE SPLIT BLOCK -->
    <template x-if="style === 'split'">
      <div class="mb-5 rounded-2xl border overflow-hidden grid grid-cols-2 shadow-lg"
           :class="isDark ? 'border-white/10' : 'border-neutral-300'">
        <div class="p-4 bg-red-600 text-white flex flex-col justify-between">
          <span class="text-[9px] font-black uppercase tracking-widest opacity-80">MLS PHOTOS</span>
          <h1 class="text-2xl font-black uppercase leading-tight tracking-tight mt-2">Full<br>Shoot</h1>
        </div>
        <div class="p-4 flex flex-col justify-between items-end tabular-nums"
             :class="isDark ? 'bg-neutral-900 text-white' : 'bg-white text-black'">
          <button @click="includeTax = !includeTax"
                  class="px-2 py-0.5 rounded text-[8px] font-black uppercase border transition-all"
                  :class="includeTax 
                    ? 'bg-red-600 text-white border-red-600' 
                    : (isDark ? 'border-white/20 text-neutral-400' : 'border-black/20 text-neutral-600')">
            TAX <span x-text="includeTax ? 'ON' : 'OFF'"></span>
          </button>
          <div class="text-3xl font-black tracking-tighter text-right mt-3">
            $<span x-text="priceDollars"></span><span class="text-base font-extrabold opacity-80" x-text="priceCents"></span>
          </div>
        </div>
      </div>
    </template>

    <!-- VARIANT 12: FOLDER TAB METAPHOR -->
    <template x-if="style === 'tab'">
      <div class="mb-5 relative pt-3">
        <!-- Floating tab -->
        <div class="absolute top-0 left-3 px-3 py-1 rounded-t-xl text-[9px] font-black tracking-widest uppercase bg-red-600 text-white z-10 shadow-sm">
          MLS MEDIA FILE
        </div>
        <div class="p-4 rounded-b-2xl rounded-tr-2xl border transition-all"
             :class="isDark ? 'bg-neutral-900/90 border-white/10' : 'bg-white border-neutral-300 shadow-md'">
          <div class="flex items-center justify-between mt-1">
            <h1 class="text-xl font-black tracking-tight">Full Shoot</h1>
            <div class="flex items-center gap-2 tabular-nums">
              <button @click="includeTax = !includeTax"
                      class="px-1.5 py-0.5 rounded-md text-[8px] font-black uppercase border"
                      :class="includeTax ? 'bg-red-600 text-white border-red-600' : 'bg-neutral-200 text-neutral-600 border-neutral-300'">
                TAX
              </button>
              <div class="text-2xl font-black tracking-tight">
                $<span x-text="priceDollars"></span><span class="text-sm opacity-80" x-text="priceCents"></span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- VARIANT 13: ARCADE CRT SCREEN -->
    <template x-if="style === 'retro'">
      <div class="mb-5 p-4 rounded-xl border-2 bg-black text-red-500 font-retro border-red-600 shadow-[0_0_15px_rgba(239,68,68,0.3)]">
        <div class="flex items-center justify-between text-xs tracking-widest border-b border-red-900/50 pb-1 mb-2">
          <span>* MLS_ARCADE_V1 *</span>
          <button @click="includeTax = !includeTax" class="hover:underline">
            [TAX:<span x-text="includeTax ? 'YES' : 'NO'"></span>]
          </button>
        </div>
        <div class="flex items-baseline justify-between">
          <h1 class="text-2xl font-bold tracking-widest uppercase text-white">FULL SHOOT</h1>
          <div class="text-3xl font-bold text-red-500 tracking-wider">
            $<span x-text="priceDollars"></span><span class="text-lg" x-text="priceCents"></span>
          </div>
        </div>
      </div>
    </template>

    <!-- VARIANT 14: CINEMATIC MONOCHROME LUXURY -->
    <template x-if="style === 'cinematic'">
      <div class="mb-5 p-5 rounded-2xl border text-center transition-all"
           :class="isDark ? 'bg-stone-950 border-stone-800 text-stone-100' : 'bg-stone-50 border-stone-300 text-stone-900 shadow-sm'">
        <span class="text-[8px] font-cinzel font-bold tracking-[0.4em] text-red-600 uppercase block mb-1">ARCHITECTURAL MEDIA</span>
        <h1 class="text-3xl font-cinzel font-bold uppercase tracking-widest mb-3">Full Shoot</h1>
        
        <div class="flex items-center justify-center gap-3 tabular-nums border-t pt-3" :class="isDark ? 'border-stone-800' : 'border-stone-200'">
          <div class="text-3xl font-cinzel font-bold tracking-tight">
            $<span x-text="priceDollars"></span><span class="text-lg opacity-70" x-text="priceCents"></span>
          </div>
          <button @click="includeTax = !includeTax"
                  class="px-2 py-0.5 rounded text-[8px] font-bold uppercase tracking-widest border transition-all"
                  :class="includeTax ? 'bg-red-600 text-white border-red-600' : 'border-neutral-500 text-neutral-400'">
            TAX
          </button>
        </div>
      </div>
    </template>

    <!-- VARIANT 15: INTERACTIVE DECK TOGGLE CARDS -->
    <template x-if="style === 'switch'">
      <div class="mb-5 p-4 rounded-2xl border transition-all"
           :class="isDark ? 'bg-neutral-900 border-white/10' : 'bg-white border-neutral-300 shadow-sm'">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2">
            <div class="w-3 h-3 bg-red-600 rounded-sm"></div>
            <span class="text-[10px] font-black uppercase tracking-wider opacity-60">MLS Photos</span>
          </div>
          <h1 class="text-base font-black tracking-tight">Full Shoot</h1>
        </div>

        <!-- Full-width tactile toggle button -->
        <button @click="includeTax = !includeTax"
                class="w-full py-2 px-3 rounded-xl border flex items-center justify-between transition-all active:scale-[0.98]"
                :class="includeTax 
                  ? 'bg-red-600 text-white border-red-500 shadow-md' 
                  : (isDark ? 'bg-white/5 border-white/10 text-neutral-300' : 'bg-neutral-100 border-neutral-200 text-neutral-700')">
          <span class="text-[10px] font-black uppercase tracking-wider" x-text="includeTax ? 'Price (Tax Included)' : 'Base Price (+ Tax)'"></span>
          <div class="text-xl font-black tabular-nums">
            $<span x-text="priceDollars"></span><span class="text-xs opacity-80" x-text="priceCents"></span>
          </div>
        </button>
      </div>
    </template>

    <!-- VARIANT 16: OVERSIZED BADGE EMBLEM -->
    <template x-if="style === 'badge'">
      <div class="mb-5 p-4 rounded-3xl border flex items-center gap-4 transition-all"
           :class="isDark ? 'bg-neutral-900 border-white/10' : 'bg-white border-neutral-300 shadow-md'">
        <!-- Oversized Badge Block -->
        <div class="w-16 h-16 rounded-2xl bg-red-600 text-white flex flex-col items-center justify-center shrink-0 shadow-lg shadow-red-600/30">
          <span class="text-[9px] font-black uppercase tracking-widest opacity-80">RATE</span>
          <span class="text-xl font-black leading-none">$<span x-text="priceDollars"></span></span>
        </div>

        <div class="flex flex-col justify-between grow">
          <span class="text-[9px] font-black uppercase tracking-widest text-red-500">MLS PHOTOS</span>
          <h1 class="text-xl font-black tracking-tight leading-tight">Full Shoot</h1>
          
          <button @click="includeTax = !includeTax"
                  class="mt-1 self-start text-[9px] font-black uppercase tracking-wider transition-all"
                  :class="includeTax ? 'text-red-500 underline' : 'opacity-50 hover:opacity-100'">
            <span x-text="includeTax ? 'Tax Included' : '+ Include Sales Tax'"></span>
          </button>
        </div>
      </div>
    </template>

    <!-- VARIANT 17: MESH MATRIX TEXTURE -->
    <template x-if="style === 'texture'">
      <div class="mb-5 p-4 rounded-2xl border transition-all relative overflow-hidden"
           :class="isDark ? 'bg-neutral-900 border-white/10 bg-dots-dark' : 'bg-white border-neutral-300 bg-dots-light shadow-sm'">
        <div class="flex items-center justify-between relative z-10">
          <div>
            <div class="inline-block px-2 py-0.5 rounded bg-red-600 text-white text-[8px] font-black uppercase tracking-widest mb-1">
              MLS PHOTOS
            </div>
            <h1 class="text-2xl font-black tracking-tight">Full Shoot</h1>
          </div>

          <div class="flex flex-col items-end tabular-nums">
            <button @click="includeTax = !includeTax"
                    class="mb-1 px-1.5 py-0.5 rounded-full text-[8px] font-black uppercase border transition-all"
                    :class="includeTax ? 'bg-red-600 text-white border-red-600' : 'bg-neutral-200 text-neutral-600 border-neutral-300'">
              TAX
            </button>
            <div class="text-3xl font-black tracking-tighter">
              $<span x-text="priceDollars"></span><span class="text-lg opacity-80" x-text="priceCents"></span>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- VARIANT 18: FLOATING ORB LOCK -->
    <template x-if="style === 'floating'">
      <div class="mb-5 p-4 rounded-2xl border flex items-center justify-between relative overflow-hidden"
           :class="isDark ? 'bg-black border-white/15' : 'bg-neutral-900 text-white shadow-xl'">
        <!-- Red Orb -->
        <div class="absolute -left-6 -bottom-6 w-24 h-24 bg-red-600/40 rounded-full blur-xl pointer-events-none"></div>

        <div class="relative z-10">
          <span class="text-[9px] font-black uppercase tracking-widest text-red-400 block mb-0.5">MLS PHOTOS</span>
          <h1 class="text-xl font-black tracking-tight text-white">Full Shoot</h1>
        </div>

        <div class="relative z-10 flex items-center gap-2 tabular-nums">
          <button @click="includeTax = !includeTax"
                  class="w-8 h-8 rounded-full border flex items-center justify-center text-[9px] font-black uppercase transition-all"
                  :class="includeTax ? 'bg-red-600 border-red-500 text-white' : 'bg-white/10 border-white/20 text-neutral-400'">
            TAX
          </button>
          <div class="text-2xl font-black text-white tracking-tight">
            $<span x-text="priceDollars"></span><span class="text-sm opacity-80" x-text="priceCents"></span>
          </div>
        </div>
      </div>
    </template>

    <!-- VARIANT 19: MASSIVE SYNE TYPOGRAPHY HEADER -->
    <template x-if="style === 'editorial'">
      <div class="mb-5 font-syne border-b-4 pb-3" :class="isDark ? 'border-red-600' : 'border-black'">
        <div class="flex items-center justify-between text-[10px] font-bold uppercase tracking-widest mb-1 opacity-60">
          <span>MLS PHOTOS</span>
          <button @click="includeTax = !includeTax" :class="includeTax && 'text-red-600 font-extrabold'">
            TAX [<span x-text="includeTax ? 'INCL' : 'EXCL'"></span>]
          </button>
        </div>
        <div class="flex items-end justify-between gap-2">
          <h1 class="text-3xl font-extrabold uppercase tracking-tighter leading-none">Full Shoot</h1>
          <div class="text-3xl font-extrabold tracking-tighter tabular-nums leading-none">
            $<span x-text="priceDollars"></span>
          </div>
        </div>
      </div>
    </template>

    <!-- VARIANT 20: THERMAL PRINT RECEIPT SLIP -->
    <template x-if="style === 'receipt'">
      <div class="mb-5 p-4 rounded-lg bg-white text-black font-mono-tech border-2 border-dashed border-neutral-400 shadow-md">
        <div class="text-center border-b-2 border-black pb-2 mb-2">
          <span class="text-[10px] font-bold tracking-widest uppercase block">*** MLS MEDIA SLIP ***</span>
          <h1 class="text-lg font-black uppercase">Full Shoot Package</h1>
        </div>
        
        <div class="flex items-center justify-between text-sm font-bold tabular-nums">
          <button @click="includeTax = !includeTax"
                  class="text-[10px] font-black uppercase px-1.5 py-0.5 border border-black"
                  :class="includeTax ? 'bg-black text-white' : 'bg-neutral-100'">
            TAX: <span x-text="includeTax ? '8.25%' : '0%'"></span>
          </button>
          <div class="text-2xl font-black">
            $<span x-text="priceDollars"></span><span class="text-sm" x-text="priceCents"></span>
          </div>
        </div>
      </div>
    </template>

    <!-- CALCULATOR CONTENT PLACEHOLDER -->
    <div class="opacity-40 pointer-events-none select-none">
      <div class="h-10 rounded-xl border mb-3 flex items-center justify-center text-xs font-bold"
           :class="isDark ? 'border-white/10 bg-white/5' : 'border-neutral-300 bg-neutral-200/50'">
        0 – 1,999 Sq Ft
      </div>
      <div class="grid grid-cols-4 gap-1.5">
        <div class="h-12 rounded-xl bg-red-600 text-white flex flex-col items-center justify-center text-xs font-bold">
          <span>25</span>
          <span>$139</span>
        </div>
        <div class="h-12 rounded-xl border flex flex-col items-center justify-center text-xs font-bold" :class="isDark ? 'border-white/10' : 'border-neutral-300'">36</div>
        <div class="h-12 rounded-xl border flex flex-col items-center justify-center text-xs font-bold" :class="isDark ? 'border-white/10' : 'border-neutral-300'">40</div>
        <div class="h-12 rounded-xl border flex flex-col items-center justify-center text-xs font-bold" :class="isDark ? 'border-white/10' : 'border-neutral-300'">50</div>
      </div>
    </div>

    <!-- FOOTER WIZARD & THEME TOGGLE -->
    <div class="flex items-center justify-between pt-4 mt-4 border-t" :class="isDark ? 'border-white/10' : 'border-neutral-200'">
      <span class="text-[10px] font-bold opacity-50">Variants 11–20 Showcase</span>
      <button @click="isDark = !isDark" 
              class="w-7 h-7 flex items-center justify-center rounded-lg text-xs"
              :class="isDark ? 'text-neutral-400 hover:text-white' : 'text-neutral-500 hover:text-black'">
        <span x-text="isDark ? '☀️' : '🌙'"></span>
      </button>
    </div>

  </main>
</body>
</html>
