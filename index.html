<!DOCTYPE html>
<html lang="en" class="h-full antialiased" x-data="{ isDark: true }" :class="isDark ? 'bg-[#050505] text-white' : 'bg-neutral-100 text-neutral-900'">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Refined Sq Ft Popover Mechanics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="min-h-full p-4 flex flex-col items-center justify-center transition-colors duration-300"
      x-data="{ 
        isOpen: true,
        selectedSqFt: '0-1999',
        selectedLabel: '0 – 1,999 Sq Ft',
        sqFtOptions: [
          { label: '0 – 1,999 Sq Ft', value: '0-1999' },
          { label: '2,000 – 2,999 Sq Ft', value: '2000-2999' },
          { label: '3,000 – 3,999 Sq Ft', value: '3000-3999' },
          { label: '4,000 – 4,999 Sq Ft', value: '4000-4999' },
          { label: '5,000 – 6,999 Sq Ft', value: '5000-6999' },
          { label: '7,000 – 9,999 Sq Ft', value: '7000-9999' },
          { label: '10,000+ Sq Ft', value: '10000+' }
        ],
        selectOption(opt) {
          this.selectedSqFt = opt.value;
          this.selectedLabel = opt.label;
          this.isOpen = false;
        }
      }">

  <!-- MAIN CONTAINER CARD -->
  <main class="w-full max-w-sm p-4 rounded-3xl border transition-all duration-300 relative overflow-visible"
        :class="isDark ? 'bg-[#121212] border-white/10 text-white' : 'bg-[#FAFAFA] border-black/10 text-[#18181B]'">

    <!-- HERO HEADER -->
    <div class="mb-5 flex items-end justify-between gap-2 pb-0.5">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-xl flex items-center justify-center shrink-0 border"
             :class="isDark ? 'bg-white/5 border-white/10 text-white' : 'bg-white border-black/10 text-neutral-900 shadow-sm'">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
        </div>
        <div>
          <span class="text-[13px] font-extrabold leading-none uppercase tracking-widest text-neutral-400 block mb-1">MLS Photos</span>
          <h1 class="text-[28px] font-black leading-none tracking-tight">Full Shoot</h1>
        </div>
      </div>
      <div class="text-[28px] font-black leading-none tracking-tighter tabular-nums">
        <span class="text-base">$</span>139<span class="text-2xl">.00</span>
      </div>
    </div>

    <!-- SQ FT SELECTOR CONTAINER -->
    <div class="relative mb-4">
      
      <!-- TRIGGER BUTTON -->
      <button @click="isOpen = !isOpen" 
              class="w-full h-12 rounded-xl border flex items-center justify-between px-4 text-[17px] font-bold transition-all shadow-sm active:scale-[0.99]"
              :class="isDark ? 'bg-white/5 border-white/15 text-white' : 'bg-white border-black/10 text-neutral-900'">
        <span class="w-full text-center pl-4" x-text="selectedLabel"></span>
        <svg class="w-4 h-4 shrink-0 transition-transform duration-300" :class="isOpen ? 'rotate-180' : ''" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
        </svg>
      </button>

      <!-- REFINED ANCHORED POPOVER WITH EASED DROP MECHANICS -->
      <div x-show="isOpen" x-cloak
           @click.outside="isOpen = false"
           x-transition:enter="transition ease-out duration-200"
           x-transition:enter-start="opacity-0 -translate-y-2 scale-95"
           x-transition:enter-end="opacity-100 translate-y-0 scale-100"
           x-transition:leave="transition ease-in duration-150"
           x-transition:leave-start="opacity-100 translate-y-0 scale-100"
           x-transition:leave-end="opacity-0 -translate-y-2 scale-95"
           class="absolute z-50 top-full mt-2 left-0 w-full rounded-2xl p-2 shadow-2xl backdrop-blur-2xl border max-h-60 overflow-y-auto origin-top"
           :class="isDark ? 'bg-[#18181B]/95 border-white/15 text-white shadow-black/80' : 'bg-white/95 border-black/10 text-neutral-900 shadow-xl'">
        
        <!-- TITLE CASE HEADER -->
        <div class="py-2 text-center text-[13px] font-extrabold text-neutral-400 border-b mb-1"
             :class="isDark ? 'border-white/10' : 'border-black/5'">
          Select Sq Ft
        </div>
        
        <!-- CENTER-ALIGNED OPTIONS -->
        <div class="space-y-1">
          <template x-for="opt in sqFtOptions" :key="opt.value">
            <button @click="selectOption(opt)" 
                    class="w-full h-11 px-4 rounded-xl flex items-center justify-center text-center text-[15px] font-semibold transition-all relative active:scale-[0.98]"
                    :class="[
                      selectedSqFt === opt.value 
                        ? (isDark ? 'bg-white/10 text-white font-extrabold' : 'bg-black/5 text-black font-extrabold')
                        : (isDark ? 'hover:bg-white/5 text-neutral-300' : 'hover:bg-black/5 text-neutral-700')
                    ]">
              <span x-text="opt.label"></span>
              
              <!-- PINNED RIGHT CHECKMARK -->
              <template x-if="selectedSqFt === opt.value">
                <svg class="w-4 h-4 text-emerald-500 absolute right-3 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
                </svg>
              </template>
            </button>
          </template>
        </div>
      </div>

    </div>

    <!-- TIER TILES -->
    <div class="grid grid-cols-4 gap-1.5 mb-4 tabular-nums">
      <div class="py-2.5 rounded-xl border bg-white/10 text-center">
        <div class="text-[15px] font-bold">25</div>
        <div class="text-[13px] font-extrabold">$139</div>
      </div>
      <div class="py-2.5 rounded-xl border bg-white/5 text-center">
        <div class="text-[15px] font-bold">36</div>
        <div class="text-[13px] font-extrabold">$179</div>
      </div>
      <div class="py-2.5 rounded-xl border bg-white/5 text-center">
        <div class="text-[15px] font-bold">40</div>
        <div class="text-[13px] font-extrabold">$189</div>
      </div>
      <div class="py-2.5 rounded-xl border bg-white/5 text-center">
        <div class="text-[15px] font-bold">50</div>
        <div class="text-[13px] font-extrabold">$224</div>
      </div>
    </div>

    <!-- FOOTER BAR -->
    <div class="flex items-center justify-between pt-2 border-t border-white/10">
      <button @click="isOpen = !isOpen" class="text-[13px] font-bold text-neutral-400 hover:text-white">
        Toggle Dropdown Menu
      </button>
      <button @click="isDark = !isDark" class="text-sm">
        <span x-text="isDark ? '☀️' : '🌙'"></span>
      </button>
    </div>

  </main>
</body>
</html>
