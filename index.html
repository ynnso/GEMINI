<!DOCTYPE html>
<html lang="en" class="h-full antialiased" x-data="{ isDark: true, style: 'apple' }" :class="isDark ? 'bg-[#050505] text-white' : 'bg-neutral-100 text-neutral-900'">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5-Star Hero Showcase</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    [x-cloak] { display: none !important; }

    @keyframes pulse-glow {
      0%, 100% { opacity: 0.4; filter: blur(20px); }
      50% { opacity: 0.8; filter: blur(28px); }
    }
    .animate-glow { animation: pulse-glow 4s ease-in-out infinite; }

    @keyframes stripe-flow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .animate-stripe {
      background-size: 200% 200%;
      animation: stripe-flow 6s ease infinite;
    }
  </style>
</head>
<body class="min-h-full p-4 flex flex-col items-center justify-center transition-colors duration-300"
      x-data="{ 
        includeTax: false,
        taxRate: 0.0825,
        rawPrice: 139,
        get finalTotal() {
          const val = this.includeTax ? this.rawPrice * (1 + this.taxRate) : this.rawPrice;
          return val.toFixed(2);
        },
        get priceDollars() { return this.finalTotal.split('.')[0]; },
        get priceCents() { return '.' + this.finalTotal.split('.')[1]; }
      }">

  <!-- STYLE SWITCHER TOOLBAR -->
  <header class="mb-6 flex flex-wrap items-center justify-center gap-1.5 p-1.5 rounded-2xl border text-[11px] font-bold transition-colors max-w-md w-full"
          :class="isDark ? 'bg-neutral-900/90 border-white/10 text-neutral-400' : 'bg-white border-neutral-300 text-neutral-600 shadow-sm'">
    <span class="px-2 text-[10px] uppercase tracking-widest font-black opacity-50">Style:</span>
    
    <button @click="style = 'apple'" :class="style === 'apple' ? (isDark ? 'bg-white text-black font-extrabold' : 'bg-black text-white font-extrabold') : 'hover:opacity-100 opacity-70'" class="px-2.5 py-1 rounded-xl transition-all">Apple</button>
    <button @click="style = 'stripe'" :class="style === 'stripe' ? (isDark ? 'bg-red-500 text-white font-extrabold' : 'bg-red-600 text-white font-extrabold') : 'hover:opacity-100 opacity-70'" class="px-2.5 py-1 rounded-xl transition-all">Stripe</button>
    <button @click="style = 'nike'" :class="style === 'nike' ? (isDark ? 'bg-white text-black font-extrabold' : 'bg-black text-white font-extrabold') : 'hover:opacity-100 opacity-70'" class="px-2.5 py-1 rounded-xl transition-all">Nike</button>
    <button @click="style = 'robinhood'" :class="style === 'robinhood' ? (isDark ? 'bg-emerald-400 text-black font-extrabold' : 'bg-black text-white font-extrabold') : 'hover:opacity-100 opacity-70'" class="px-2.5 py-1 rounded-xl transition-all">Robinhood</button>
    <button @click="style = 'vercel'" :class="style === 'vercel' ? (isDark ? 'bg-white text-black font-extrabold' : 'bg-black text-white font-extrabold') : 'hover:opacity-100 opacity-70'" class="px-2.5 py-1 rounded-xl transition-all">Vercel</button>
    <button @click="style = 'uber'" :class="style === 'uber' ? (isDark ? 'bg-white text-black font-extrabold' : 'bg-black text-white font-extrabold') : 'hover:opacity-100 opacity-70'" class="px-2.5 py-1 rounded-xl transition-all">Uber</button>
  </header>

  <!-- CARD SHELL -->
  <main class="w-full max-w-sm py-4 border-y transition-all duration-300 relative"
        :class="isDark ? 'border-white/15' : 'border-neutral-300'">

    <!-- 1. APPLE STYLE (DYNAMIC GLASS TILE & HYPER-CLEAN MONUMENTAL TYPOGRAPHY) -->
    <template x-if="style === 'apple'">
      <div class="mb-5 flex items-center justify-between gap-3 p-3.5 rounded-2xl border backdrop-blur-xl transition-all duration-300"
           :class="isDark ? 'bg-white/[0.03] border-white/10 shadow-2xl' : 'bg-white/80 border-neutral-200/80 shadow-lg shadow-neutral-200/50'">
        
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 rounded-xl flex items-center justify-center shrink-0 border transition-all duration-300"
               :class="isDark ? 'bg-gradient-to-b from-white/10 to-white/5 border-white/20 text-white shadow-inner' : 'bg-neutral-900 border-neutral-800 text-white shadow-md'">
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
            </svg>
          </div>
          <div>
            <div class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[9px] font-black tracking-widest uppercase mb-0.5"
                 :class="isDark ? 'bg-red-500/20 text-red-400 border border-red-500/30' : 'bg-red-100 text-red-600 border border-red-200'">
              MLS Photos
            </div>
            <h1 class="text-xl font-black tracking-tight" :class="isDark ? 'text-white' : 'text-neutral-900'">Full Shoot</h1>
          </div>
        </div>

        <div class="flex flex-col items-end justify-center tabular-nums">
          <button @click="includeTax = !includeTax"
                  class="p-1 -m-1 cursor-pointer group active:scale-90 transition-transform">
            <span class="inline-flex items-center justify-center px-1.5 py-0.5 rounded-md text-[8px] font-black tracking-wider uppercase backdrop-blur-md border"
                  :class="includeTax 
                            ? 'bg-emerald-400/20 text-emerald-400 border-emerald-400/50 shadow-[0_0_8px_rgba(52,211,153,0.3)]' 
                            : (isDark ? 'bg-white/5 text-neutral-400 border-white/10 group-hover:text-white' : 'bg-black/5 text-neutral-500 border-black/10 group-hover:text-black')">
              TAX
            </span>
          </button>
          <div class="text-2xl font-black tracking-tight flex items-baseline mt-0.5" :class="isDark ? 'text-white' : 'text-neutral-900'">
            <span class="text-xs font-extrabold mr-0.5 opacity-80">$</span>
            <span x-text="priceDollars"></span>
            <span class="text-lg font-extrabold opacity-80" x-text="priceCents"></span>
          </div>
        </div>
      </div>
    </template>

    <!-- 2. STRIPE STYLE (GRADIENT AMBIENT GLOW + HIGH-TECH FINANCIAL PRECISION) -->
    <template x-if="style === 'stripe'">
      <div class="mb-5 relative p-4 rounded-2xl border overflow-hidden transition-all duration-300"
           :class="isDark ? 'bg-neutral-900/90 border-white/10' : 'bg-white border-neutral-300 shadow-md'">
        
        <!-- Animated Background Glow -->
        <div class="absolute -top-12 -right-12 w-32 h-32 bg-gradient-to-br from-red-600 to-amber-500 rounded-full animate-glow opacity-30 pointer-events-none"></div>

        <div class="relative z-10 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-lg flex items-center justify-center shrink-0 bg-gradient-to-br from-red-500 to-red-700 text-white shadow-lg shadow-red-500/20">
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
              </svg>
            </div>
            <div>
              <span class="text-[9px] font-black tracking-widest uppercase opacity-60 block" :class="isDark ? 'text-neutral-300' : 'text-neutral-600'">MLS Photos</span>
              <h1 class="text-lg font-black tracking-tight" :class="isDark ? 'text-white' : 'text-neutral-900'">Full Shoot</h1>
            </div>
          </div>

          <div class="flex items-baseline gap-2 tabular-nums">
            <button @click="includeTax = !includeTax"
                    class="px-1.5 py-0.5 rounded text-[8px] font-black tracking-wide uppercase transition-all border"
                    :class="includeTax 
                              ? 'bg-red-500 text-white border-red-400 shadow-[0_0_10px_rgba(239,68,68,0.4)]' 
                              : (isDark ? 'bg-white/5 text-neutral-400 border-white/10' : 'bg-neutral-100 text-neutral-600 border-neutral-300')">
              TAX
            </button>
            <div class="text-2xl font-black tracking-tighter" :class="isDark ? 'text-white' : 'text-neutral-900'">
              <span class="text-xs font-bold">$</span><span x-text="priceDollars"></span><span class="text-sm font-extrabold" x-text="priceCents"></span>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- 3. NIKE STYLE (HIGH-CONTRAST BOLD EDITORIAL) -->
    <template x-if="style === 'nike'">
      <div class="mb-5 flex items-end justify-between p-2 border-b-2"
           :class="isDark ? 'border-white' : 'border-black'">
        <div>
          <div class="flex items-center gap-1.5 mb-1">
            <span class="w-2 h-2 bg-red-600 rounded-full inline-block"></span>
            <span class="text-[9px] font-black tracking-widest uppercase" :class="isDark ? 'text-neutral-400' : 'text-neutral-500'">MLS PHOTOS</span>
          </div>
          <h1 class="text-3xl font-black uppercase tracking-tighter leading-none" :class="isDark ? 'text-white' : 'text-black'">FULL SHOOT</h1>
        </div>

        <div class="flex flex-col items-end tabular-nums">
          <button @click="includeTax = !includeTax"
                  class="mb-1 px-1.5 py-0.5 text-[8px] font-black tracking-widest uppercase border transition-all"
                  :class="includeTax 
                            ? 'bg-red-600 text-white border-red-600' 
                            : (isDark ? 'bg-transparent text-neutral-400 border-neutral-700' : 'bg-transparent text-black border-black')">
            TAX
          </button>
          <div class="text-3xl font-black tracking-tighter leading-none" :class="isDark ? 'text-white' : 'text-black'">
            <span class="text-sm font-black">$</span><span x-text="priceDollars"></span><span class="text-xl font-black" x-text="priceCents"></span>
          </div>
        </div>
      </div>
    </template>

    <!-- 4. ROBINHOOD STYLE (COMPACT TRADING DATA DISPLAY WITH STATUS GLOW) -->
    <template x-if="style === 'robinhood'">
      <div class="mb-5 p-3.5 rounded-2xl border transition-all"
           :class="isDark ? 'bg-[#0c0d0e] border-white/10' : 'bg-white border-neutral-300 shadow-sm'">
        <div class="flex items-center justify-between mb-2">
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full" :class="includeTax ? 'bg-emerald-400 shadow-[0_0_8px_#34d399]' : 'bg-neutral-500'"></span>
            <span class="text-[10px] font-extrabold tracking-wider uppercase opacity-60">MLS Photos • Full Shoot</span>
          </div>
          <button @click="includeTax = !includeTax"
                  class="px-2 py-0.5 rounded-full text-[9px] font-black tracking-wide uppercase transition-all border"
                  :class="includeTax 
                            ? 'bg-emerald-400/20 text-emerald-400 border-emerald-400/40' 
                            : (isDark ? 'bg-white/5 text-neutral-400 border-white/10' : 'bg-neutral-200 text-neutral-600 border-neutral-300')">
            TAX <span x-text="includeTax ? 'ON' : 'OFF'"></span>
          </button>
        </div>

        <div class="flex items-baseline justify-between tabular-nums">
          <h1 class="text-xl font-black tracking-tight" :class="isDark ? 'text-white' : 'text-black'">Package Total</h1>
          <div class="text-3xl font-black tracking-tight" :class="includeTax ? 'text-emerald-400' : (isDark ? 'text-white' : 'text-black')">
            <span class="text-base font-bold">$</span><span x-text="priceDollars"></span><span class="text-xl font-extrabold" x-text="priceCents"></span>
          </div>
        </div>
      </div>
    </template>

    <!-- 5. VERCEL STYLE (MONOCHROME ULTRA-MINIMAL GRID & GEOMETRY) -->
    <template x-if="style === 'vercel'">
      <div class="mb-5 p-3 rounded-xl border transition-all"
           :class="isDark ? 'bg-black border-neutral-800' : 'bg-white border-neutral-300 shadow-sm'">
        <div class="flex items-center justify-between border-b pb-2 mb-2" :class="isDark ? 'border-neutral-800' : 'border-neutral-200'">
          <div class="flex items-center gap-2">
            <div class="w-2 h-2 bg-red-600 rotate-45"></div>
            <span class="text-[10px] font-mono uppercase tracking-widest" :class="isDark ? 'text-neutral-400' : 'text-neutral-500'">MLS_PHOTOS / FULL_SHOOT</span>
          </div>
          <button @click="includeTax = !includeTax"
                  class="px-1.5 py-0.5 text-[8px] font-mono font-bold uppercase border transition-all"
                  :class="includeTax 
                            ? (isDark ? 'bg-white text-black border-white' : 'bg-black text-white border-black') 
                            : (isDark ? 'text-neutral-500 border-neutral-800' : 'text-neutral-500 border-neutral-300')">
            [TAX:<span x-text="includeTax ? 'INCL' : 'EXCL'"></span>]
          </button>
        </div>
        <div class="flex items-baseline justify-between tabular-nums">
          <span class="text-xs font-mono" :class="isDark ? 'text-neutral-400' : 'text-neutral-600'">PRICE_ESTIMATE</span>
          <div class="text-3xl font-black tracking-tighter font-mono" :class="isDark ? 'text-white' : 'text-black'">
            $<span x-text="priceDollars"></span><span class="text-xl opacity-70" x-text="priceCents"></span>
          </div>
        </div>
      </div>
    </template>

    <!-- 6. UBER STYLE (CARD DOCK WITH DIRECT TACTILE FEEDBACK) -->
    <template x-if="style === 'uber'">
      <div class="mb-5 p-4 rounded-2xl transition-all"
           :class="isDark ? 'bg-neutral-900 border border-white/10' : 'bg-neutral-900 text-white shadow-lg'">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-full bg-white text-black flex items-center justify-center font-black text-xs">
              MLS
            </div>
            <div>
              <h1 class="text-base font-black leading-tight text-white">Full Shoot</h1>
              <span class="text-[10px] font-bold text-neutral-400">Standard Tier</span>
            </div>
          </div>

          <button @click="includeTax = !includeTax"
                  class="px-2 py-1 rounded-full text-[9px] font-black tracking-wider uppercase transition-all"
                  :class="includeTax ? 'bg-red-600 text-white' : 'bg-neutral-800 text-neutral-400 hover:text-white'">
            TAX
          </button>
        </div>

        <div class="pt-2 border-t border-neutral-800 flex items-baseline justify-between tabular-nums">
          <span class="text-xs font-bold text-neutral-400">Guaranteed Total</span>
          <div class="text-2xl font-black text-white tracking-tight">
            $<span x-text="priceDollars"></span><span class="text-lg opacity-80" x-text="priceCents"></span>
          </div>
        </div>
      </div>
    </template>

    <!-- REMAINING CALCULATOR CONTENT PLACEHOLDER -->
    <div class="opacity-40 pointer-events-none select-none">
      <div class="h-10 rounded-xl border mb-3 flex items-center justify-center text-xs font-bold"
           :class="isDark ? 'border-white/10 bg-white/5' : 'border-neutral-300 bg-neutral-200/50'">
        0 – 1,999 Sq Ft
      </div>
      <div class="grid grid-cols-4 gap-1.5">
        <div class="h-12 rounded-xl bg-red-600 text-white flex flex-col items-center justify-center text-xs font-bold">
          <span>25</span>
          <span>$139</span>
        </div>
        <div class="h-12 rounded-xl border flex flex-col items-center justify-center text-xs font-bold" :class="isDark ? 'border-white/10' : 'border-neutral-300'">36</div>
        <div class="h-12 rounded-xl border flex flex-col items-center justify-center text-xs font-bold" :class="isDark ? 'border-white/10' : 'border-neutral-300'">40</div>
        <div class="h-12 rounded-xl border flex flex-col items-center justify-center text-xs font-bold" :class="isDark ? 'border-white/10' : 'border-neutral-300'">50</div>
      </div>
    </div>

    <!-- FOOTER WIZARD & THEME TOGGLE -->
    <div class="flex items-center justify-between pt-4 mt-4 border-t" :class="isDark ? 'border-white/10' : 'border-neutral-200'">
      <span class="text-[10px] font-bold opacity-50">5-Star Hero Showcase</span>
      <button @click="isDark = !isDark" 
              class="w-7 h-7 flex items-center justify-center rounded-lg text-xs"
              :class="isDark ? 'text-neutral-400 hover:text-white' : 'text-neutral-500 hover:text-black'">
        <span x-text="isDark ? '☀️' : '🌙'"></span>
      </button>
    </div>

  </main>
</body>
</html>
